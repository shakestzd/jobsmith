<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Jobsmith">
  <!-- Indigo Ink squircle background -->
  <rect x="5" y="5" width="90" height="90" rx="20" ry="20" fill="#2C2E72"/>
  <!-- White J-Rise glyph + amber tip, centered -->
  <g transform="translate(14.2,14.5) scale(0.716)">
    <!-- shaft + hook (white) -->
    <path d="M59,27 L59,60 Q59,79 41,79 Q24,79 24,63" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- amber arrowhead tip -->
    <path d="M46,32 L59,18 L72,32" fill="none" stroke="#F4A024" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
