[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "jobsmith"
version = "0.1.0"
description = "Tailored resume and cover-letter pipeline. Master-first, no fabrication, anchor-preserving. Ships as a Claude Code plugin and a standalone CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Thandolwethu \"Shakes\" Dlamini", email = "shakestzd@gmail.com" },
]
keywords = [
    "resume",
    "cover-letter",
    "job-application",
    "quarto",
    "typst",
    "ats",
    "claude-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    # Slice A.1 — comment-preserving YAML round-trip for `jobsmith mark-anchors`.
    # PyYAML cannot preserve comments or key order; ruamel.yaml can.
    "ruamel.yaml>=0.18",
    # Slice 4 (feat-901b79a7) — JWT auth pipeline. PyJWT for HS256 encode/decode,
    # bcrypt directly (passlib's bcrypt backend mishandles modern bcrypt 4.x/5.x).
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    # feat-8842ad01 — server-side JD fetching with httpx fast-path and Playwright fallback.
    "httpx>=0.27",
    "playwright>=1.44",
    # feat-f85f4815 — user-level settings store (OS config dir).
    "platformdirs>=4.0",
    # tomllib is stdlib on py>=3.11; tomli is needed for py3.10.
    "tomli>=2.0 ; python_full_version < '3.11'",
    # feat-bd145368 — resume/LinkedIn ingest specialists.
    "pdfplumber>=0.11",
    "python-docx>=1.0",
    # feat-5531c54b — ATS adapter scoring + HTML stripping.
    "rapidfuzz>=3.0",
    "beautifulsoup4>=4.12",
    # feat-b1bd050e — Gmail adapter for email job alert ingestion (read-only).
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    # feat-1602d64c — LLM triage rescore via claude-agent-sdk (Max subscription).
    "claude-agent-sdk>=0.0.11",
    # feat-c920ceeb — per-node apply backend: cloud Claude via strict tool_use
    # (Anthropic Messages API). Structured output uses a forced custom tool.
    "anthropic>=0.49",
    # trk-ac5661e4 — API server runtime deps.
    "fastapi>=0.111",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
    # Required by FastAPI Form/File upload (onboard multipart routes).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
tui = [
    "textual>=0.60",
]
# feat-b621a4ab — desktop sidecar: PyInstaller onefile build of the FastAPI
# backend, spawned by the Tauri shell. platformdirs is already a runtime dep.
desktop = [
    "pyinstaller>=6.0",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
dev = [
    "jobsmith[test]",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
jobsmith = "jobsmith.cli:app"

[project.urls]
Homepage = "https://jobsmith.dev"
Repository = "https://github.com/shakestzd/jobsmith"
Issues = "https://github.com/shakestzd/jobsmith/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsmith"]
artifacts = ["src/jobsmith/web_dist/**"]

# Force-include the templates tree inside the installed package so wheel
# installs ship the same templates/ layout that checkout installs see at
# <repo>/templates/. Resolved at runtime via _find_package_root() in
# jobsmith.assemble — checkout layout returns <repo>/, wheel layout returns
# <site-packages>/jobsmith/.
#
# The plugin subtree (agents/, commands/, plugin.json) lives under
# src/jobsmith/plugin/ and is included automatically by the Hatchling
# `packages = ["src/jobsmith"]` rule — no explicit force-include needed.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "jobsmith/templates"
# NOTE: src/jobsmith/web_dist/ is gitignored (see .gitignore) so it is NOT
# picked up by the `packages` glob. It is included via the `artifacts` setting
# above. Do NOT force-include it here — that would duplicate the artifact entry.

# Custom build hook: run `vite build` and copy output into src/jobsmith/web_dist/.
# Requires hatchling>=1.20 (ships since hatch 1.9.0 / hatchling 1.21+).
# If npm/node are absent the hook no-ops — wheel builds in API-only mode.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".claire", "testenv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Typer use call expressions as argument defaults by design
# (Depends(), typer.Option(), typer.Argument()). These are the framework's
# intended dependency-injection sentinels, not the mutable-default footgun
# B008 targets — treat them as immutable.
extend-immutable-calls = ["fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "e2e: end-to-end tests requiring JOBSMITH_E2E=1 and a real server subprocess (opt-in)",
]
