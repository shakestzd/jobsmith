# Sample master work history for jobsmith
#
# This is a fictional "Pat Doe" profile — a senior data engineer with
# climate-tech and fintech experience. Replace with your real history.
#
# CONVENTIONS
# - Each position has: title, location, date, description, details
# - "details" entries can be either:
#     a) a plain string — anchors detected via regex (≥$10M / ≥50% / ≥100K-asset)
#     b) a dict with explicit user-declared metadata (Slice A object form):
#          - bullet:        the bullet text
#          - anchor:        true|false — overrides regex anchor detection
#          - anchor_reason: human rationale (propagated into bullet-decisions.json)
#          - tags:          list of free-form tags (e.g. [cost-out, ops])
#          - drop_when:     condition string consulted by bullet-selector
#   Use the dict form when your anchor signal isn't a $/%/asset-count
#   (e.g. "served 200K students", "shipped 12 design systems").
# - Anchors are preserved across applications unless an explicit reason
#   to drop them is logged in the application's bullet-decisions.json.

