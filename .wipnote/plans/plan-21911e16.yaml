meta:
    id: plan-21911e16
    track_id: trk-f5052600
    title: 'Model-agnostic apply pipeline: run claude -p on local gemma via claude-code-router'
    description: Keep the Claude Code agentic apply harness but point claude -p at a local gemma-4 (mlx_lm.server) through a claude-code-router proxy, config-driven, cloud Claude preserved as default. Extends plan-938f735b.
    created_at: "2026-06-26"
    status: draft
    priority: medium
    schema_version: v4
    version: 2
design:
    problem: |
        jobsmith's apply pipeline (gather -> draft -> render) is hardwired to the Claude
        Code CLI: src/jobsmith/headless.py spawns `claude -p` with a system-prompt file,
        --allowedTools, and specialist subagents (apply-jd-parser etc.), doing multi-step
        agentic tool calls (WebFetch/Read/Write/Bash + claude-in-chrome MCP, incl. the new
        Workday Chrome-render fallback). plan-938f735b made CHAT + sourcing SCORING
        pluggable but explicitly scoped OUT this agentic harness. The user wants the WHOLE
        pipeline runnable by a local/open model so jobsmith is not Claude-locked.
    goals:
        - Run the full apply pipeline end-to-end on a local gemma-4 model, reusing the existing Claude Code harness unchanged (no specialist/tool re-architecture).
        - Drive it by pointing `claude -p` at a local Anthropic-API gateway (claude-code-router) that translates to mlx_lm.server (gemma-4) — selected via the existing `llm` config.
        - Preserve the cloud Claude path as the default/backward-compatible backend; the local path is opt-in.
        - Prove tool-calling fidelity first (spike) before building the plumbing — de-risk that a 4B gemma can complete the agentic loop.
    constraints:
        - Do not regress the existing `claude -p` cloud path (default behavior unchanged when the local backend is not selected).
        - Tool use under the local model must work — WebFetch/Read/Write/Bash + the claude-in-chrome Chrome-render fallback (feat-2c81da71).
        - No LiteLLM 1.82.7/1.82.8 (shipped credential-stealing malware); prefer claude-code-router as the gateway. Apple Silicon (MLX) for the model engine.
    approved: false
    comment: |
        DECISIONS (from this session's research + user choices):
        - Approach D (keep Claude Code, swap model) chosen over A (build agent loop) and
          C (adopt OpenCode/OpenHands) because it preserves the entire existing harness.
          C (OpenCode / OpenHands Python SDK) is the documented FALLBACK if the spice
          (slice 1) shows gemma can't drive the agentic loop reliably.
        - Gateway = claude-code-router in front of the existing mlx_lm.server (single MLX
          engine for chat+scoring+apply); Ollama-native-Anthropic was the runner-up.
        - INTERVIEW NOTE: the design forks (approach, gateway) were settled via AUQ in this
          session; per-slice 4-stage interviews were compressed — decisions_notes capture
          inferred picks; human review (wipnote serve) + plan-critique are the gates.
    research:
        - url: https://code.claude.com/docs/en/model-config
          claim: Claude Code repoints to any Anthropic-Messages-API gateway via ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN/ANTHROPIC_MODEL/ANTHROPIC_SMALL_FAST_MODEL — the basis for running claude -p on a local model without changing the harness.
          accessed: "2026-06-26"
        - url: https://github.com/musistudio/claude-code-router
          claim: claude-code-router exposes an Anthropic-Messages endpoint and routes/translates to OpenAI-format backends — the chosen gateway in front of mlx_lm.server (avoids LiteLLM's malware history).
          accessed: "2026-06-26"
        - url: https://docs.litellm.ai/docs/tutorials/claude_non_anthropic_models
          claim: Confirms the Anthropic<->OpenAI translation-proxy pattern Claude Code requires for local OpenAI-format models like MLX; documents the env-var wiring (alternative gateway, but pin a clean version).
          accessed: "2026-06-26"
        - url: https://developers.googleblog.com/bring-state-of-the-art-agentic-skills-to-the-edge-with-gemma-4/
          claim: Gemma 4 has native function-calling + constrained JSON — the capability that makes driving Claude Code's agentic tool-calling on a local model plausible (validated by the spike).
          accessed: "2026-06-26"
slices:
    - id: slice-1
      num: 1
      title: 'SPIKE: prove gemma-4 drives the Claude Code agentic apply via claude-code-router (decision gate)'
      what: |
        Stand up claude-code-router in front of the existing mlx_lm.server
        (gemma-4-E4B-it-qat-4bit) so it exposes an Anthropic-Messages endpoint mapping
        to the local OpenAI model. Run a real `claude -p` against it with the apply
        system prompt + the apply-jd-parser allowedTools, on a representative
        JS-rendered job (e.g. the NVIDIA Workday URL), and assess whether gemma-4
        completes the agentic loop: correct tool calls (WebFetch/Read/Write/Bash +
        claude-in-chrome render), specialist hand-off, and a usable gather->draft->render
        result. Output a GO/NO-GO with concrete fidelity notes (which gemma size, router
        config needed, where tool-calling broke if it did). This gates slices 2-6.
      why: |
        The whole approach hinges on a 4B local model driving Claude Code's multi-step
        tool-calling. Proving it first avoids building config plumbing on a false premise;
        a NO-GO pivots to the C fallback (OpenCode/OpenHands).
      files:
        - scripts/_apply_byo_spike.sh
        - docs/spikes/byo-model-apply.md
      deps: []
      done_when:
        - A `claude -p` apply run against gemma-4-via-router completes a gather->draft->render on a real JS-rendered job, with the tool calls actually firing (not hallucinated).
        - docs/spikes/byo-model-apply.md records an explicit GO or NO-GO with evidence (transcript excerpts, which tools worked/failed, gemma size, router config).
      effort: M
      risk: High
      tests: |
        Manual spike: run scripts/_apply_byo_spike.sh end-to-end; capture the claude -p
        stream-json transcript; verify real tool-use events + a produced draft. Compare
        output quality against a cloud-Claude baseline run on the same job.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://github.com/musistudio/claude-code-router
          claim: Router config maps an Anthropic model name to an OpenAI-format backend route — the mechanism the spike wires for mlx_lm.server.
          accessed: "2026-06-26"
        - url: https://developers.googleblog.com/bring-state-of-the-art-agentic-skills-to-the-edge-with-gemma-4/
          claim: Gemma-4 native function-calling is the capability under test in this spike.
          accessed: "2026-06-26"
      questions:
        - id: q-gate
          text: What happens on a NO-GO?
          answer: Pivot to the C fallback (adopt OpenCode or OpenHands' Python SDK as the apply orchestrator) — captured in design.comment; slices 2-6 are D-specific and would be re-planned. (User chose D primary; C is the documented fallback.)
      decisions_notes: |
        **Trigger:** manual spike before any plumbing.
        **State:** throwaway script + a findings doc; no production code changes.
        **Payload:** a GO/NO-GO decision + fidelity notes that shape slices 2-6.
        **Rejected:** building the config/headless plumbing first (slices 2-4) — wasteful if gemma can't drive the loop; spike-first de-risks. Using a larger gemma (12B) up front — try E4B first (matches the chosen default), escalate only if E4B fails.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - scripts/_apply_byo_spike.sh (new, throwaway — start router->mlx, run claude -p apply against it)
            - docs/spikes/byo-model-apply.md (new — GO/NO-GO findings + fidelity notes)
            - src/jobsmith/headless.py (reference only — read how claude -p is built; no edits this slice)
        - type: diagram
          title: Spike data path
          entries:
            - mlx_lm.server (gemma-4-E4B) on :8081 (OpenAI /v1)
            - claude-code-router on :PORT (Anthropic /v1/messages -> OpenAI)
            - claude -p (ANTHROPIC_BASE_URL=router, apply system prompt + allowedTools)
            - 'agentic loop: tool calls (WebFetch/Read/Write/Bash + chrome render)'
            - 'assess: gather->draft->render completed? tool fidelity?'
    - id: slice-2
      num: 2
      title: Extend the `llm` config with an apply-pipeline backend selector
      what: |
        Add to the existing `llm` config (src/jobsmith/config.py) an apply-backend
        selector so the apply pipeline can choose `claude_cloud` (default) vs
        `claude_local` (route claude -p through the local gateway). Carry the gateway
        settings (router host/port, the Anthropic model name claude -p should request,
        and the small/fast model) — reusing the existing openai_compatible base_url/model
        (gemma-4) as the upstream. Validate with Pydantic; default maps to claude_cloud
        for backward compatibility.
      why: |
        Goal 2/3 — one config switch selects the apply backend without touching call
        sites; default stays cloud Claude (no regression).
      files:
        - src/jobsmith/config.py
        - config-schema.yaml
        - tests/test_config.py
      deps:
        - 1
      done_when:
        - Config parses llm.apply.backend; default is claude_cloud (existing behavior).
        - Selecting claude_local with a missing router_url fails Pydantic validation with a clear error.
      effort: S
      risk: Low
      tests: |
        Unit (tests/test_config.py): default backend = claude_cloud; claude_local without
        router_url -> validation error; round-trips through .apply-config.yaml.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/model-config
          claim: The env vars the apply_backend=claude_local path must set (ANTHROPIC_BASE_URL/MODEL/SMALL_FAST_MODEL) — config carries the values.
          accessed: "2026-06-26"
      questions:
        - id: q-reuse
          text: Reuse the existing llm.openai_compatible model, or a separate apply model?
          answer: Reuse the same gemma-4 upstream (base_url/model) for consistency across chat/scoring/apply; the router just re-exposes it over the Anthropic API. (Inferred — single-model story is simplest.)
      decisions_notes: |
        **Trigger:** startup config load.
        **State:** immutable config; reuses the existing openai_compatible base_url/model (gemma-4) as the router upstream.
        **Payload:** llm.apply block selecting cloud vs local + gateway coordinates.
        **Rejected:** a separate top-level config section (duplicates the existing llm block); an env-only switch (undocumented, hard to surface in the UI).
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - src/jobsmith/config.py (edit — add llm.apply_backend + gateway settings)
            - config-schema.yaml (edit — document the new fields)
            - tests/test_config.py (edit — parse/default/validation tests)
        - type: data-model
          title: llm.apply config
          fields:
            name: llm.apply
          rows:
            - name: backend
              type: 'enum: claude_cloud | claude_local (default claude_cloud)'
            - name: router_url
              type: string (Anthropic-Messages endpoint of claude-code-router, e.g. http://127.0.0.1:8788)
            - name: anthropic_model
              type: string (model name claude -p requests; router maps it to the gemma upstream)
            - name: small_fast_model
              type: string (ANTHROPIC_SMALL_FAST_MODEL mapping)
    - id: slice-3
      num: 3
      title: 'claude-code-router gateway: lifecycle + config in front of mlx_lm.server'
      what: |
        Add a gateway manager (src/jobsmith/llm/cc_router.py) that writes a
        claude-code-router config routing the Anthropic model name to the local
        mlx_lm.server OpenAI endpoint (gemma-4), starts/stops the router as a managed
        child, and exposes a health check. Reuses the desktop dependency-detection
        pattern (slice 6 of the desktop plan) to detect whether claude-code-router is
        installed and guide install if not.
      why: |
        Goal 2 — the translation gateway is what lets the unchanged claude -p speak to a
        local OpenAI model; it must be reliably startable + healthy before an apply run.
      files:
        - src/jobsmith/llm/cc_router.py
        - src/jobsmith/desktop/deps.py
      deps:
        - 1
      done_when:
        - cc_router.start() launches claude-code-router pointed at mlx_lm.server and health-checks green; stop() terminates it (no orphan).
        - If claude-code-router is not installed, deps.py reports it (status) and surfaces a guided-install hint rather than crashing.
      effort: M
      risk: Med
      tests: |
        Unit: router-config writer produces the expected JSON mapping (anthropic_model ->
        base_url/model). Integration (gated): start router against a stub OpenAI server,
        assert /v1/messages health; stop() leaves no process.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://github.com/musistudio/claude-code-router
          claim: Router config format (provider/route/model mapping) + how it exposes the Anthropic endpoint — the contract cc_router.py writes against.
          accessed: "2026-06-26"
      questions:
        - id: q-detect
          text: Bundle claude-code-router or detect+guide install?
          answer: Detect + guided install (mirror the desktop claude-detection pattern, feat slice 6) — it's a Node tool; bundling drags in Node. (Inferred from the desktop dep-handling precedent.)
      decisions_notes: |
        **Trigger:** before a claude_local apply run; app/CLI lifecycle.
        **State:** router config file under the app data dir; router runs as a managed child (no persistence beyond the process).
        **Payload:** a healthy Anthropic-Messages endpoint backed by gemma-4.
        **Rejected:** Ollama-native-Anthropic (would add a second engine alongside MLX); LiteLLM (malware history in 1.82.7/8); embedding a custom translator (reinvents claude-code-router).
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - src/jobsmith/llm/cc_router.py (new — write router config, start/stop child, health check)
            - src/jobsmith/desktop/deps.py (edit — detect claude-code-router install + guided install)
        - type: diagram
          title: Gateway lifecycle
          fields:
            direction: lr
          entries:
            - ensure mlx_lm.server up (gemma-4)
            - write router config (anthropic_model -> mlx OpenAI route)
            - start claude-code-router child
            - poll router health (Anthropic /v1/messages reachable)
            - 'on apply done / app exit: stop router'
    - id: slice-4
      num: 4
      title: 'headless.py: inject BYO-model env when apply_backend=claude_local'
      what: |
        In src/jobsmith/headless.py, when config.llm.apply.backend == claude_local,
        spawn `claude -p` with the BYO-model env: ANTHROPIC_BASE_URL=<router_url>,
        ANTHROPIC_AUTH_TOKEN=<token>, ANTHROPIC_MODEL=<anthropic_model>,
        ANTHROPIC_SMALL_FAST_MODEL=<small_fast_model>, and
        CLAUDE_CODE_ATTRIBUTION_HEADER=0 (prefix-cache fix for local backends). All
        existing flags (--system-prompt-file, --allowedTools, specialists, stream-json)
        are unchanged. Default (claude_cloud) spawns exactly as today — no env override.
      why: |
        Goal 1/3 — this is the single seam that swaps the model while preserving the
        entire harness; everything downstream (specialists, tools, Chrome fallback) is untouched.
      files:
        - src/jobsmith/headless.py
        - tests/test_headless.py
      deps:
        - 2
        - 3
      done_when:
        - With apply_backend=claude_local, the spawned claude -p process env contains ANTHROPIC_BASE_URL=router + ANTHROPIC_MODEL + CLAUDE_CODE_ATTRIBUTION_HEADER=0.
        - With apply_backend=claude_cloud (default), no ANTHROPIC_* override is injected — the command is byte-identical to today's.
        - --allowedTools / --system-prompt-file / specialists are unchanged in both modes.
      effort: M
      risk: Med
      tests: |
        Unit (tests/test_headless.py): mock subprocess, assert the env dict for both
        backends (set vs unset), and that the allowedTools/system-prompt args are
        identical across modes. Regression: existing headless tests still pass.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://docs.vllm.ai/en/stable/serving/integrations/claude_code/
          claim: Confirms ANTHROPIC_BASE_URL + the per-request-hash prefix-cache issue mitigated by CLAUDE_CODE_ATTRIBUTION_HEADER=0 — injected for the local backend.
          accessed: "2026-06-26"
      questions:
        - id: q-auth
          text: What ANTHROPIC_AUTH_TOKEN value for the local router?
          answer: A dummy/local token the router accepts (router does the real upstream auth, or none for localhost); claude -p just needs a non-empty value. (Inferred from local-gateway setups.)
      decisions_notes: |
        **Trigger:** apply run dispatch in headless.py.
        **State:** env passed per-subprocess; no global env mutation.
        **Payload:** the four ANTHROPIC_* vars + the prefix-cache header, only in local mode.
        **Rejected:** mutating the global/process env (leaks into other calls); a separate code path/duplicate command builder (drift risk — the only diff should be the env dict).
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - src/jobsmith/headless.py (edit — conditional env injection in the claude -p subprocess builder)
            - tests/test_headless.py (edit — assert env set for claude_local, absent for claude_cloud)
        - type: diagram
          title: Env injection seam
          entries:
            - config.llm.apply.backend == claude_local?
            - yes -> subprocess env += ANTHROPIC_BASE_URL/AUTH/MODEL/SMALL_FAST + ATTRIBUTION_HEADER=0
            - no  -> spawn claude -p unchanged (cloud)
            - claude -p runs the SAME specialists/tools either way
    - id: slice-5
      num: 5
      title: End-to-end apply on local gemma + cloud fallback
      what: |
        Wire it together: a claude_local apply run starts the gateway (slice 3), spawns
        claude -p with the BYO env (slice 4), and completes a real apply on a
        JS-rendered job (NVIDIA Workday) end-to-end. Add graceful fallback: if the
        gateway is unhealthy or the local run fails/stalls, surface a clear error and
        (optionally, per config) fall back to cloud Claude rather than producing a broken
        application. Verify the Chrome-render fallback (feat-2c81da71) works under the
        local model.
      why: |
        Goal 1 — the actual deliverable: a full apply produced by a local model, with a
        safety net so a flaky local backend never silently yields garbage.
      files:
        - src/jobsmith/headless.py
        - src/jobsmith/llm/cc_router.py
        - tests/test_apply_local_backend.py
      deps:
        - 4
      done_when:
        - A claude_local apply on a real JS-rendered job (NVIDIA Workday) produces a complete gather->draft->render with the Chrome-render fallback exercised.
        - If the gateway is down or the local run fails, the user gets a clear error (and a cloud fallback when configured) — never a silently broken application.
        - An equivalent claude_cloud run still works unchanged (no regression).
      effort: L
      risk: High
      tests: |
        Integration (tests/test_apply_local_backend.py): mock the router health + a
        stubbed claude -p; assert the orchestration (gateway-up -> spawn -> teardown) and
        the fallback path on unhealthy gateway. Manual E2E: real apply on the NVIDIA
        Workday URL through gemma-4; compare to a cloud-Claude baseline.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/model-config
          claim: Same harness, swapped endpoint — the e2e behavior depends only on the gateway being a faithful Anthropic-Messages endpoint.
          accessed: "2026-06-26"
      questions:
        - id: q-fallback
          text: Auto-fall-back to cloud on local failure, or just error?
          answer: 'Config-gated: default to a clear error + retryable (don''t silently spend cloud); allow opt-in auto-fallback to cloud Claude. (Inferred — matches the graceful-degradation pattern used for the browser/claude prompts.)'
      decisions_notes: |
        **Trigger:** a claude_local apply run.
        **State:** gateway child lifecycle bound to the apply run; results saved as today.
        **Payload:** a complete application from the local model, or a clear error/fallback.
        **Rejected:** silent fallback with no signal (hides that local failed); no fallback at all (a flaky 4B model would block the user). Fallback policy is config-gated.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - src/jobsmith/headless.py (edit — orchestrate gateway-up -> claude -p local -> fallback)
            - src/jobsmith/llm/cc_router.py (reuse — health/start/stop)
            - tests/test_apply_local_backend.py (new — e2e-ish with mocked router + fallback paths)
        - type: diagram
          title: End-to-end local apply
          entries:
            - apply_backend=claude_local -> ensure gateway healthy
            - spawn claude -p (BYO env) -> gather->draft->render via gemma-4
            - tool calls incl. Chrome render fallback fire
            - on gateway-unhealthy / run-failure -> clear error (+ optional cloud fallback)
    - id: slice-6
      num: 6
      title: 'Config-tab UI + docs: select the apply backend'
      what: |
        Surface the apply-backend choice in the web Config tab (web/src/app/views.tsx),
        alongside the existing LLM provider selector: a toggle for the apply pipeline
        between "Claude (cloud)" and "Local gemma (via router)", with the router URL /
        model fields when local is selected. Persist via /api/config. Document the local
        setup (install claude-code-router, start mlx_lm.server gemma-4) in docs.
      why: |
        Operators need to flip the apply backend without editing YAML; docs make the
        local path reproducible.
      files:
        - web/src/app/views.tsx
        - src/jobsmith/api/config_routes.py
        - docs/local-apply-backend.md
      deps:
        - 4
      done_when:
        - The Config tab shows the apply-backend toggle; selecting Local reveals router_url/model and persists via PUT /api/config.
        - docs/local-apply-backend.md documents installing claude-code-router + starting mlx_lm.server gemma-4 + flipping the toggle.
      effort: S
      risk: Low
      tests: |
        Unit (web): config tab renders the apply-backend toggle, persists the llm.apply
        payload on save. Doc lint/readthrough.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: UI + docs over the existing /api/config contract and the config fields defined in slice 2; no external API governs this surface.
      questions:
        - id: q-ui-scope
          text: One unified provider control or a separate apply toggle?
          answer: A separate apply-backend toggle next to the existing chat/scoring provider selector — apply (claude harness) and chat/scoring (OpenAICompatible) are different backends and shouldn't be conflated. (Inferred from the two-subsystem split.)
      decisions_notes: |
        **Trigger:** Config tab render + save.
        **State:** persisted via /api/config (llm.apply block).
        **Payload:** apply backend choice + router coordinates.
        **Rejected:** YAML-only configuration (operators can't switch without editing files); a separate settings screen (the Config tab already hosts the LLM provider selector).
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - web/src/app/views.tsx (edit — apply-backend toggle in the Config tab)
            - src/jobsmith/api/config_routes.py (edit — accept llm.apply in PUT /api/config)
            - docs/local-apply-backend.md (new — router + mlx_lm.server setup)
        - type: wireframe
          title: Config tab — apply backend
          fields:
            html: |
                <div style="padding:var(--wf-space-md);background:var(--wf-surface);color:var(--wf-text)">
                  <label style="display:block;margin-bottom:var(--wf-space-sm)">Apply pipeline backend</label>
                  <select style="width:100%;padding:var(--wf-space-sm);border:1px solid var(--wf-border)">
                    <option>Claude (cloud) — default</option>
                    <option>Local gemma (via router)</option>
                  </select>
                  <input placeholder="router_url (http://127.0.0.1:8788)" style="margin-top:var(--wf-space-sm);width:100%;padding:var(--wf-space-sm);border:1px solid var(--wf-border)"/>
                </div>
questions: []
