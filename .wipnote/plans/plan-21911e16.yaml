critique:
    reviewed_at: "2026-06-26"
    reviewers:
        - local-design (design critic; wipnote:researcher on Opus 4.8 — read headless.py + specialist-contracts.yaml)
        - local-feasibility (feasibility critic; wipnote:researcher on Opus 4.8 — verified headless.py subprocess, fetched all research URLs, checked engine/gateway viability)
    assumptions:
        - id: A1
          status: verified
          text: headless.py builds claude -p via _build_command (~241-294) and spawns via subprocess.Popen in run_phase (~415) with NO env= param — the env-injection seam must be built.
          evidence: Feasibility critic read headless.py:415; the Popen call lacks env=.
        - id: A2
          status: falsified
          text: ORIGINAL assumption that mlx_lm.server + claude-code-router could carry the agentic apply — FALSE. mlx_lm.server has no tool calling; claude-code-router is an Electron GUI. Both replaced by vllm-mlx.
          evidence: mlx_lm SERVER.md (no tools field); github.com/musistudio/claude-code-router (GUI, 'Open Server and click Start').
        - id: A3
          status: verified
          text: vllm-mlx exposes native Anthropic /v1/messages with real tool_use blocks + tool calling, AND OpenAI /v1 — one engine for apply + chat/scoring.
          evidence: https://github.com/waybarrios/vllm-mlx
        - id: A4
          status: plausible
          text: Gemma-4 (E4B) can drive Claude Code's multi-step agentic tool-calling reliably enough for the apply pipeline.
          evidence: Gemma-4 has native function-calling (Google blog, on LiteRT-LM); the spike (slice 1) is the gate that confirms it on vllm-mlx — marked plausible until then.
    critics: []
    risks:
        - risk: Gemma-4-E4B may not drive Claude Code's multi-tool agentic loop reliably (tool fidelity, phase-marker emission).
          severity: High
          mitigation: Spike-first (slice 1) gates the whole plan; NO-GO pivots to the C fallback (OpenCode/OpenHands). Escalate to a larger gemma if E4B is weak.
        - risk: vllm-mlx maturity / gemma-4 support on it unverified.
          severity: Medium
          mitigation: Slice 1 confirms gemma-4 loads + tool_use works on vllm-mlx before any plumbing; mlx-omni-server/Rapid-MLX are documented alternatives.
        - risk: ~60-90s cold load reads as a hang.
          severity: Low
          mitigation: Slice 3 loading-vs-crashed health + a loading status signal; slice 6 docs the wait.
    synthesis: |
        The dual-critic pass caught two structural blockers that would have sunk the build:
        mlx_lm.server has no tool calling and claude-code-router is a GUI app — so the
        original engine+gateway pair was infeasible. Both are replaced by vllm-mlx, a single
        Anthropic-native MLX server with real tool_use blocks (user-confirmed), which also
        SIMPLIFIES the design by removing the translation proxy and consolidating chat/
        scoring onto one engine. The deprecated ANTHROPIC_SMALL_FAST_MODEL is corrected to
        ANTHROPIC_DEFAULT_HAIKU_MODEL, and the headless.py env= seam is now an explicit build
        task (it does not exist yet). Multi-tier routing, phase-marker emission, cold-load
        UX, engine-crash detection, session isolation, port/concurrency safety, and the
        slice-6 dep are all folded in. The plan now hinges entirely on slice-1: if gemma-4
        on vllm-mlx can drive Claude Code's agentic tool-calling (incl. >=2 specialist tiers
        + phase markers), slices 2-6 are sound; if not, pivot to the C fallback. Ready for
        human review with slice-1 as the explicit go/no-go gate.
