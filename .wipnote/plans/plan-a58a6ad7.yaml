critique:
    reviewed_at: "2026-06-05"
    reviewers:
        - Haiku (design)
        - Sonnet (feasibility)
    assumptions:
        - id: A1
          status: falsified
          text: Reuse tables live in job_search.db.
          evidence: src/jobsmith/db.py:111 (open_pipeline_db) + _cli_apply.py:462 open private/jobsmith.db; job_search.db is a separate schema managed by apply-db-logger.
        - id: A2
          status: falsified
          text: apply-* specialists are Python modules under src/jobsmith/agents/.
          evidence: No src/jobsmith/agents/ dir; specialists are prompt .md files at src/jobsmith/plugin/agents/apply-*.md.
        - id: A3
          status: falsified
          text: Schema added via standalone reuse/schema.sql + migrate.py.
          evidence: Migration runner reads _PIPELINE_MIGRATIONS at src/jobsmith/db.py:50-58 from src/jobsmith/migrations/; new schema must be 009_reuse_store.sql registered there.
        - id: A4
          status: falsified
          text: No prior caching exists in the apply flow.
          evidence: llm_cache (migration 008, src/jobsmith/llm/sqlite_cache.py + phase_cache.py) memoizes draft phase by specialist+jd_hash+master_etag; research.py + private/companies/*.md caches company research (TTL 30d).
        - id: A5
          status: falsified
          text: Correctness gate is an apply-reviewer specialist.
          evidence: 'Gates are Python: src/jobsmith/guard.py (check_anchors) and src/jobsmith/factcheck.py.'
        - id: A6
          status: verified
          text: .apply-state artifacts are jd-parsed.json / fit-score.json / bullet-selection.json under <app-dir>/.apply-state/.
          evidence: src/jobsmith/_state_readers.py:36/44/52; factcheck.py:224.
    critics:
        - title: DESIGN CRITIC
          sections:
            - heading: Scope gaps
              items:
                - badge: config surface
                  kind: danger
                  text: Tunable TTLs/thresholds/cutoffs span slices 1-6 with no owning slice or documented defaults -- folded into slice-1.
                - badge: taxonomy upkeep
                  kind: danger
                  text: Synonym taxonomy 'grows' but no seed location or maintenance path -- addressed in slice-2.
                - badge: deletion/concurrency
                  kind: warn
                  text: Orphaned cache rows after a prior application is deleted, and two concurrent applies, are unhandled -- addressed in slice-1 (orphan-tolerant keys, WAL, INSERT OR REPLACE).
            - heading: Correctness coupling
              items:
                - badge: slice-4 gate
                  kind: danger
                  text: High-risk requirement reuse had no correctness done_when and an implicit slice-8 dependency -- clarified in slice-4.
                - badge: retry bound
                  kind: danger
                  text: slice-8 regen-and-re-gate retry limit lived only in a question answer -- promoted to a done_when.
                - badge: anchor owner
                  kind: warn
                  text: Anchor guarantee split between slice-7 and slice-8 -- slice-7 OWNS carry-forward, slice-8 VERIFIES.
                - badge: A/B AND-gate
                  kind: danger
                  text: slice-9 must fail if EITHER calls or wall-clock misses 50% -- made explicit.
        - title: FEASIBILITY CRITIC
          sections:
            - heading: Wrong paths (all corrected)
              items:
                - badge: db target
                  kind: danger
                  text: private/jobsmith.db, not job_search.db (db.py:111).
                - badge: migration
                  kind: danger
                  text: 009_reuse_store.sql registered in _PIPELINE_MIGRATIONS (db.py:50-58), not standalone migrate.py.
                - badge: specialists
                  kind: danger
                  text: src/jobsmith/plugin/agents/apply-*.md prompts, not src/jobsmith/agents/*.py.
                - badge: pipeline
                  kind: danger
                  text: src/jobsmith/core/pipeline.py + _cli_apply.py, not src/jobsmith/pipeline.py.
                - badge: gates
                  kind: danger
                  text: guard.py (check_anchors) + factcheck.py, not apply_reviewer.py.
            - heading: Reconcile, don't reinvent
              items:
                - badge: llm_cache
                  kind: warn
                  text: Existing exact-input draft cache (migration 008) -- reuse layer sits above it; A/B must control for it.
                - badge: company cache
                  kind: warn
                  text: Existing file cache research.py + private/companies/ (TTL 30d) -- slice-3 extends it, not a parallel table.
    risks:
        - risk: Reuse layer duplicates/contradicts existing llm_cache or research.py cache.
          severity: High
          mitigation: 'Slices 1/3/5 explicitly coexist: reuse layer is the fuzzy/cross-app tier above exact-input llm_cache; slice-3 extends research.py rather than adding a parallel table.'
        - risk: Requirement/warm-start reuse leaks a stale or context-wrong claim.
          severity: High
          mitigation: Slice-8 re-runs guard.py + factcheck.py on the FINAL assembled output unconditionally; failure regenerates the piece (bounded retries) then falls back to full generation.
        - risk: slice-6 planner is a critical-path bottleneck (depends on 2-5).
          severity: Medium
          mitigation: Slices 2/3 and 4/5 are parallelizable after slice-1; planner is intentionally the integration join point. Acceptable given correctness-first.
    synthesis: |
        Feasibility critic falsified five structural assumptions (A1-A5): the plan
        pointed at job_search.db, Python specialist modules, a standalone migration, a
        nonexistent apply-reviewer gate, and assumed no prior caching. All file paths
        are now corrected to verified locations, and the plan is reframed so the reuse
        layer SITS ABOVE the existing exact-input llm_cache (008) and EXTENDS the
        existing file-based company cache rather than forking them. Design critic's
        must-fix items are resolved: config surface folded into slice-1, taxonomy
        maintenance into slice-2, slice-8 retry bound and slice-9 AND-gate made
        explicit, anchor ownership assigned to slice-7 with slice-8 as verifier. No
        open danger items remain. Human reviewer should focus first on (1) the
        llm_cache coexistence boundary in slices 1/5 -- confirm the reuse layer's
        incremental value is real given exact-input memoization already exists; and
        (2) slice-3's reconciliation choice (extend research.py vs migrate to DB).
