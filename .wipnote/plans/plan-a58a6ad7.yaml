meta:
    id: plan-a58a6ad7
    track_id: trk-45e7fcd5
    title: Apply-pipeline incremental-reuse / caching layer
    description: ""
    created_at: ""
    status: draft
    schema_version: v3
    version: 19
design:
    problem: |
        Every `jobsmith apply` re-runs the full 3-phase pipeline (gather -> draft ->
        render) from zero, dispatching all apply-* specialists on every job even though
        JDs overlap heavily: the same requirements recur, the same companies recur, and
        a recently-tailored resume often already fits ~80% of a new JD. This wastes
        ~30-60 min wall-clock and many LLM calls per run by re-deriving information
        already generated in prior applications. An exact-input phase cache (llm_cache,
        migration 008, keyed specialist+jd_hash+master_etag) already exists but only
        memoizes IDENTICAL inputs -- a near-duplicate JD with different wording is a
        cache miss, and there is no cross-application requirement/company/resume reuse.
    goals:
        - Introduce a layered reuse layer (artifact + requirement + whole-resume warm-start) that SITS ABOVE the existing exact-input llm_cache and reuses prior outputs across applications, not just on identical inputs.
        - Canonicalize JD requirements (hybrid tags + LLM normalize, no vector store) so equivalent phrasings map to one requirement.
        - Provide a fast path that cuts model calls AND wall-clock ~50% on warm runs, with the full pipeline as fallback for novel JDs.
        - 'Make reuse correctness-first: the final assembled output always passes anchor (guard.py), no-fabrication, and fact-check (factcheck.py) gates regardless of how much was reused.'
        - Make savings measurable via per-run metrics + an A/B harness that controls for the existing llm_cache so it measures the reuse layer's INCREMENTAL benefit.
    constraints:
        - 'Local-first, single-tenant: no heavy new runtime deps (no vector store) -- canonical tags + sqlite + content-hashing only.'
        - Anchor preservation is non-negotiable; no fabrication; reuse must never carry a stale or wrong claim into a different JD.
        - 'Build on existing architecture: 3-phase pipeline (src/jobsmith/core/pipeline.py + _cli_apply.py), prompt-based apply-* specialists (src/jobsmith/plugin/agents/apply-*.md), <app-dir>/.apply-state/* artifacts, master YAMLs + anchors, and the pipeline DB private/jobsmith.db (migrations in src/jobsmith/migrations/).'
        - 'Do NOT duplicate or fork existing caches: coexist with llm_cache (migration 008) and the file-based company cache (research.py + private/companies/); reconcile, do not reinvent.'
        - Reuse is an optimization layer; the full pipeline remains the correctness backstop and the fallback (--no-reuse).
    approved: false
    comment: ""
slices:
    - id: slice-1
      feature_id: feat-4dfd1a0b
      num: 1
      title: 'Reuse store: migration 009 + hash/TTL + config surface'
      what: |
        Add reuse tables to the pipeline DB (private/jobsmith.db) via a new migration
        src/jobsmith/migrations/009_reuse_store.sql registered in _PIPELINE_MIGRATIONS
        (src/jobsmith/db.py:50-58): canonical_requirements, requirement_evidence_map,
        application_fingerprints, and run_metrics. (Company research reuses the
        existing file cache -- see slice-3 -- so NO company table here.) Add a
        reuse-store module (src/jobsmith/reuse/store.py) with typed read/write helpers
        and two freshness primitives: content_hash(inputs) (stable SHA over normalized
        input bytes) and is_fresh(row, ttl). Add a config surface
        (src/jobsmith/config.py or existing settings module) that owns ALL reuse
        knobs with documented defaults: fuzzy cutoff, JD-overlap warm-start threshold,
        dedup threshold, company TTL, and the regen retry bound. This is the
        foundation every later slice keys off and the home for all tunables.
      why: |
        Stage-2: cache state lives in the pipeline DB (private/jobsmith.db), queryable
        and transactional. Stage-4: invalidation = content-hash + TTL. Critics: the DB
        is private/jobsmith.db (not job_search.db), migrations are registered in
        _PIPELINE_MIGRATIONS (no standalone migrate.py), and a single config surface
        with defaults is required so the human reviewer can see every threshold in one
        place.
      files:
        - src/jobsmith/reuse/store.py
        - src/jobsmith/migrations/009_reuse_store.sql
        - src/jobsmith/db.py
        - src/jobsmith/config.py
      deps: []
      done_when:
        - Running apply creates all reuse tables in private/jobsmith.db via the registered migration 009 idempotently (re-run is a no-op)
        - content_hash is stable across runs for identical normalized input and changes when any input byte changes
        - is_fresh returns false when either the stored hash differs OR the row is older than its TTL
        - All reuse knobs (fuzzy cutoff, warm-start + dedup thresholds, company TTL, retry bound) are read from config with documented defaults
        - Cache rows survive deletion of a source application without error (orphaned rows are unreachable, not crashing) and writes use INSERT OR REPLACE under WAL
        - Existing apply pipeline and llm_cache still run end-to-end with the new tables present (no behavior change yet)
      effort: M
      risk: Med
      tests: |
        Unit: test_content_hash_stable_and_sensitive; test_is_fresh_hash_and_ttl;
              test_config_defaults_present
        Integration: test_migration_009_idempotent (run migrate twice via _PIPELINE_MIGRATIONS, assert one schema)
      complexity: complex
      approved: false
      comment: ""
      approval_status: approved
      execution_status: promoted
      questions:
        - id: q-blob
          text: Store large cached payloads inline as TEXT or offload to files referenced by the index?
          answer: Inline TEXT for v1 -- single-user, low volume, keeps invalidation atomic with the row; company research keeps its existing file form (slice-3). Revisit offload only if profiling shows DB bloat.
      decisions_notes: |
        **State:** new tables in private/jobsmith.db (NOT job_search.db) via migration
        009 registered in _PIPELINE_MIGRATIONS (db.py:50-58); standalone schema.sql +
        migrate.py REJECTED (incompatible with the existing migration runner, A3).
        **Coexistence:** this layer does NOT replace llm_cache (008) -- llm_cache
        memoizes exact inputs; the reuse layer adds the fuzzy/cross-application tier
        above it (A4). Company research stays in the existing file cache (slice-3), so
        no company table here. **Config:** one surface owns every threshold/TTL so
        reviewers and operators see all knobs together (design-critic danger).
        **Deletion/concurrency:** rows keyed by content hash tolerate orphaned source
        apps; single-user + WAL + INSERT OR REPLACE covers the rare concurrent apply.
        **Freshness:** hash over NORMALIZED inputs so cosmetic master-YAML edits do
        not bust the cache; TTL applies to company research (slice-3).
    - id: slice-2
      feature_id: feat-5024375d
      num: 2
      title: Requirement canonicalization + tiered match + taxonomy seed
      what: |
        Add a canonical skill/requirement taxonomy as a versioned seed file
        (src/jobsmith/reuse/taxonomy.py + a data seed, e.g. reuse/taxonomy_seed.yaml)
        with synonym aliases (advanced sql / strong sql skills / sql proficiency ->
        tag:sql) and a documented path for adding new tags. Add a normalizer
        (canonicalize.py): extend the apply-jd-parser prompt
        (src/jobsmith/plugin/agents/apply-jd-parser.md) to emit, per requirement, a
        canonical tag (when known) + a normalized phrase, and capture those in the
        post-phase ingest (src/jobsmith/db_ingest.py) into canonical_requirements.
        Implement match(req) (match.py) with tiered resolution: exact tag ->
        normalized-phrase equality -> fuzzy (token-set ratio) below the configured
        cutoff = no match; return reuse|regenerate + matched prior requirement id.
      why: |
        Stage-2: hybrid canonical-tags + LLM normalize, NO vector store. Stage-3:
        tiered exact->normalized->fuzzy. Critics: jd-parser is a prompt .md (A2), so
        canonical fields are injected via the prompt + db_ingest.py, not a Python
        module; and the taxonomy needs an explicit seed + maintenance path.
      files:
        - src/jobsmith/reuse/taxonomy.py
        - src/jobsmith/reuse/canonicalize.py
        - src/jobsmith/reuse/match.py
        - src/jobsmith/plugin/agents/apply-jd-parser.md
        - src/jobsmith/db_ingest.py
      deps:
        - 1
      done_when:
        - Three phrasings of the same skill resolve to the same canonical tag
        - An unknown phrasing with no tag still gets a normalized phrase and is matchable by normalized-equality / fuzzy
        - match returns reuse for exact+normalized hits and regenerate for fuzzy scores below the configured cutoff
        - Canonicalized requirements persist to canonical_requirements (via db_ingest) and round-trip on the next run
        - Adding a new synonym to the taxonomy seed is picked up without code changes and is covered by a test
      effort: L
      risk: Med
      tests: |
        Unit: test_synonyms_map_to_tag; test_normalize_unknown_phrase;
              test_tiered_match_thresholds; test_taxonomy_seed_extensible
        Integration: test_jd_parser_emits_canonical_fields_via_ingest
      complexity: complex
      approved: false
      comment: ""
      approval_status: approved
      execution_status: promoted
      questions:
        - id: q-fuzzy
          text: Fuzzy backend -- sqlite FTS5 or in-process token-set ratio?
          answer: Token-set ratio over normalized phrases (no schema dependency, fully local); add FTS5 only if recall is insufficient. Cutoff lives in the slice-1 config surface, tunable without code changes.
      decisions_notes: |
        **Trigger:** canonicalization rides the existing apply-jd-parser prompt (no
        extra model round-trip); fields land via db_ingest.py post-phase (A2 -- the
        parser is a .md prompt, there is no apply_jd_parser.py to edit).
        **Match tiers:** exact tag -> normalized-phrase equality -> token-set-ratio
        fuzzy with a config cutoff; below cutoff = regenerate (correctness-first).
        **Taxonomy:** versioned seed file with a documented add-a-tag path
        (design-critic danger on maintenance). **Rejected:** embeddings + vector store
        (violates local-first); pure deterministic synonym table (brittle -- LLM
        normalize covers the long tail without a vector DB).
    - id: slice-3
      feature_id: feat-62ac0b17
      num: 3
      title: Company-research cross-role reuse (extend existing file cache)
      what: |
        EXTEND the existing file-based company cache (src/jobsmith/research.py:
        slugify / is_fresh / cache_path_for, backed by private/companies/<slug>.md)
        so it reuses research across DIFFERENT roles at the same/normalized company,
        not just on the exact prior path. Add company-key normalization, surface the
        TTL through the slice-1 config (keep current 30d default), and record a
        reused-vs-generated signal for the reuse report. Update the
        apply-company-research prompt (src/jobsmith/plugin/agents/apply-company-research.md)
        / its dispatch so a fresh cache hit short-circuits the LLM call.
      why: |
        Stage-2 in-scope, lowest-risk reuse (company facts are JD-independent).
        Critic: a file-based company cache ALREADY exists (research.py +
        private/companies/, tests/test_company_research_cache.py) -- extend it for
        cross-role reuse rather than adding a parallel company_research_cache table
        that would fork the source of truth.
      files:
        - src/jobsmith/research.py
        - src/jobsmith/reuse/company_cache.py
        - src/jobsmith/plugin/agents/apply-company-research.md
      deps:
        - 1
      done_when:
        - A second application to the same (normalized) company within TTL reuses cached research and makes zero company-research LLM calls
        - A cache entry past its (config) TTL triggers regeneration and a fresh write-back
        - Existing tests/test_company_research_cache.py still pass (no regression to the file cache contract)
        - Each run records company-research as reused or generated for the reuse report
      effort: M
      risk: Low
      tests: |
        Unit: test_company_key_normalization; test_ttl_expiry_forces_regen
        Integration: test_second_role_same_company_skips_llm (assert call count 0)
      complexity: standard
      approved: false
      comment: ""
      approval_status: approved
      execution_status: promoted
      decisions_notes: |
        **Reconcile:** EXTEND research.py's existing file cache (slugify/is_fresh/
        cache_path_for + private/companies/) -- do NOT add a parallel DB table (critic:
        avoids two sources of truth). **Skip rule:** fresh hit (within TTL) returns
        the cached .md and bypasses the LLM call. **TTL:** surfaced through slice-1
        config, default kept at existing 30d. **Rejected:** keying on raw job_id
        (defeats cross-role reuse); a new DB company table (forks the live file cache).
        Similar-company fuzzy reuse deferred -- v1 is same-company normalized identity.
    - id: slice-4
      feature_id: feat-08e32ed5
      num: 4
      title: Requirement->evidence/bullet map + reuse
      what: |
        Populate requirement_evidence_map from each completed application's
        bullet-selection.json (read via src/jobsmith/_state_readers.py:52, at
        <app-dir>/.apply-state/bullet-selection.json): (canonical requirement) ->
        (master bullet id + content hash of that bullet). On a new JD, for each
        requirement resolving to a prior canonical requirement (slice-2), reuse the
        previously selected master bullet INSTEAD of re-selecting -- but only when the
        bullet's current content hash still matches the stored hash. A master-YAML
        edit changes the bullet hash and auto-invalidates the mapping. The
        apply-bullet-selector prompt (src/jobsmith/plugin/agents/apply-bullet-selector.md)
        consults the map before doing work.
      why: |
        Stage-2 in-scope; core of fine-grained reuse. Critics: bullet-selector is a
        prompt .md (A2); the artifact path is confirmed at
        <app-dir>/.apply-state/bullet-selection.json (A6); and this high-risk slice
        needs an explicit correctness done_when plus a clear statement that the
        assembled-output gate is slice-8.
      files:
        - src/jobsmith/reuse/evidence_map.py
        - src/jobsmith/plugin/agents/apply-bullet-selector.md
        - src/jobsmith/_state_readers.py
      deps:
        - 1
        - 2
      done_when:
        - A requirement seen in a prior application reuses the same master bullet without re-selecting for that requirement
        - Editing the master bullet's content changes its hash and invalidates the reused mapping (forces re-selection) -- verified by a dedicated unit test
        - A reused mapping never returns a bullet whose stored hash != current master hash (map-correctness test in isolation)
        - Anchor bullets remain present in the selection regardless of reuse decisions
        - New requirements with no prior mapping fall through to normal bullet selection
      effort: L
      risk: High
      tests: |
        Unit: test_map_population_from_bullet_selection;
              test_master_edit_busts_bullet_hash; test_no_reuse_on_hash_mismatch;
              test_anchors_always_selected
        Integration: test_recurring_requirement_reuses_bullet
      complexity: complex
      approved: false
      comment: ""
      approval_status: approved
      execution_status: promoted
      questions:
        - id: q-context
          text: Can a bullet that satisfied a requirement in JD-A be wrong for JD-B even if the tag matches?
          answer: Possibly (tone/context drift), so requirement-level reuse picks the bullet but never bypasses the final fact-check/no-fabrication gate (slice-8, guard.py + factcheck.py). The map is a hint, not authority.
      decisions_notes: |
        **State:** requirement_evidence_map rows store canonical-requirement id,
        master bullet id, and the bullet content hash at mapping time.
        **Invalidation:** reuse ONLY when stored hash == current master bullet hash
        (Stage-4 content-hash invalidation) -- this slice tests that in isolation so
        its correctness does not silently depend on slice-8. **Gate boundary:** the
        map is an optimization HINT, not a correctness authority; the assembled output
        is re-gated in slice-8. **Guardrail:** anchor preservation overrides reuse;
        anchors always selected. **Rejected:** reusing the whole bullet-selection.json
        blob here (that is slice-7 warm-start); trusting the map without re-hashing
        (carries stale bullet text).
    - id: slice-5
      feature_id: feat-42d39d4a
      num: 5
      title: JD-parse + fit-score dedup for near-duplicate JDs
      what: |
        Compute an application_fingerprint per JD from its normalized requirement set
        + normalized text (slice-2). On a new JD, look up application_fingerprints; if
        a prior JD is a near-duplicate above the (config) dedup threshold, reuse its
        jd-parsed.json and fit-score.json (read via src/jobsmith/_state_readers.py:36
        and :44) instead of re-running apply-jd-parser / apply-fit-scorer. Below
        threshold, run normally and store the new fingerprint. This is the FUZZY tier
        above llm_cache's exact jd_hash keying -- it catches reposts/edited JDs that
        llm_cache misses.
      why: |
        Stage-2 in-scope. Near-duplicate JDs are common; skipping parse+score on them
        is cheap and safe. Critic: this complements llm_cache (exact jd_hash) by
        catching near-duplicates, and the specialists are prompts (A2) so the skip is
        enforced at dispatch, not in a Python specialist module.
      files:
        - src/jobsmith/reuse/fingerprint.py
        - src/jobsmith/plugin/agents/apply-jd-parser.md
        - src/jobsmith/plugin/agents/apply-fit-scorer.md
        - src/jobsmith/_state_readers.py
      deps:
        - 1
        - 2
      done_when:
        - A re-submitted near-identical JD reuses prior jd-parsed.json and fit-score.json and skips both specialists
        - A JD below the dedup threshold runs both specialists normally and stores its own fingerprint
        - The dedup threshold is read from the slice-1 config (tunable without code changes)
        - Fingerprint reuse triggers on a near-duplicate that llm_cache (exact jd_hash) would miss
      effort: M
      risk: Med
      tests: |
        Unit: test_fingerprint_stable_for_near_duplicate; test_threshold_gate
        Integration: test_duplicate_jd_skips_parser_and_scorer;
                     test_near_dup_reused_where_llmcache_misses
      complexity: standard
      approved: false
      comment: ""
      approval_status: approved
      execution_status: promoted
      decisions_notes: |
        **Key:** fingerprint = feature-set over normalized requirements + JD text
        (slice-2). **Relationship to llm_cache:** llm_cache keys on EXACT jd_hash; this
        fingerprint is the fuzzy layer that catches near-duplicates llm_cache misses
        (critic). **Skip rule:** above threshold reuses BOTH jd-parsed and fit-score
        (tightly coupled to the same JD). **Rejected:** exact-text dedup (misses
        reposts); deduping parse but re-scoring (fit-score is a function of the same
        parsed JD). Threshold in slice-1 config.
    - id: slice-6
      feature_id: feat-6623ee3b
      num: 6
      title: Reuse-planner pre-phase + --no-reuse flag
      what: |
        Add a planner (src/jobsmith/reuse/planner.py) that runs BEFORE the gather
        phase in the orchestrator (src/jobsmith/core/pipeline.py, integrated via
        src/jobsmith/_cli_apply.py run_apply). It: (1) normalizes the JD (slice-2);
        (2) queries fingerprints/evidence-map/company cache to find the nearest prior
        application and a per-candidate reuse verdict; (3) decides warm-start vs
        full-draft using the config JD-overlap threshold; (4) emits a reuse-plan
        artifact into <app-dir>/.apply-state/ that specialists consult. Add a
        --no-reuse CLI flag (in _cli_apply.py) forcing an all-regenerate plan.
      why: |
        Stage-3: reuse-planner pre-phase + per-specialist checks, tunable warm-start
        threshold, automatic-by-default + --no-reuse. Critic: the orchestrator is
        src/jobsmith/core/pipeline.py + _cli_apply.py (NOT src/jobsmith/pipeline.py).
      files:
        - src/jobsmith/reuse/planner.py
        - src/jobsmith/core/pipeline.py
        - src/jobsmith/_cli_apply.py
      deps:
        - 2
        - 3
        - 4
        - 5
      done_when:
        - Planner emits a reuse-plan listing per-candidate verdicts (reuse/warm-start/regenerate) before gather runs
        - JD overlap above the (config) warm-start threshold selects warm-start; below selects full draft
        - --no-reuse forces an all-regenerate plan identical in effect to the legacy full pipeline
        - When no prior application exists, the planner falls back cleanly to a full run
      effort: L
      risk: High
      tests: |
        Unit: test_planner_verdicts_per_candidate; test_warmstart_threshold;
              test_no_reuse_forces_full; test_no_candidate_falls_back_full
        Integration: test_planner_runs_before_gather
      complexity: complex
      approved: false
      comment: ""
      approval_status: approved
      execution_status: promoted
      questions:
        - id: q-overlap
          text: How is JD-overlap for the warm-start decision computed?
          answer: Jaccard/coverage over canonical requirement sets of the new JD vs the nearest prior application (slice-2 tags). Single tunable score in the slice-1 config; warm-start only above it, else full draft.
      decisions_notes: |
        **Trigger:** new pre-gather step wired into src/jobsmith/core/pipeline.py via
        _cli_apply.run_apply (critic A-path: not src/jobsmith/pipeline.py). Reuse is
        automatic by default (safe -- gates still run); --no-reuse is the escape.
        **Payload:** a reuse-plan artifact in <app-dir>/.apply-state/ that specialists
        read. **Threshold:** warm-start fires only above the config JD-overlap score
        (default ~80%). **Bottleneck (critic warn):** planner depends on 2-5 by design
        (it is the integration join); slices 2/3 and 4/5 parallelize after slice-1.
        **Rejected:** pre-population only (no central warm-start decision);
        per-specialist-only (no cross-specialist coordination / nearest-app).
    - id: slice-7
      feature_id: feat-13a76665
      num: 7
      title: Whole-resume warm-start (diff-and-tweak), owns anchor carry-forward
      what: |
        When the planner selects warm-start, load the nearest prior resume + its
        bullet-selection as a base, compute the requirement delta (what the new JD
        needs that the base does not already satisfy), and short-circuit the draft
        phase to modifying ONLY the delta bullets via the apply-prose-writer agent
        (src/jobsmith/plugin/agents/apply-prose-writer.md, dispatched through the
        existing agent path in src/jobsmith/core/pipeline.py run_phase_iter), instead
        of a from-scratch draft. This slice OWNS anchor carry-forward: anchor bullets
        from the base are copied verbatim and excluded from the diff/regenerate set;
        slice-8 VERIFIES them.
      why: |
        Stage-2 in-scope and the biggest wall-clock win. Critic: prose-writer is a
        prompt .md (A2) dispatched via the agent path, not a Python module; and anchor
        responsibility must be unambiguous -- slice-7 carries them forward, slice-8
        verifies.
      files:
        - src/jobsmith/reuse/warmstart.py
        - src/jobsmith/plugin/agents/apply-prose-writer.md
        - src/jobsmith/core/pipeline.py
      deps:
        - 6
        - 4
      done_when:
        - A near-duplicate JD warm-starts from the nearest prior resume and only delta bullets are regenerated
        - All anchor bullets from the base resume are present and unmodified in the warm-started output (carry-forward owned here)
        - The requirement delta correctly identifies new-JD requirements not covered by the base
        - If warm-start cannot satisfy a required-but-uncovered requirement, it escalates that piece to full generation rather than fabricating
      effort: L
      risk: High
      tests: |
        Unit: test_requirement_delta_computation; test_anchors_carried_forward
        Integration: test_warmstart_regenerates_only_delta;
                     test_uncovered_requirement_escalates
      complexity: complex
      approved: false
      comment: ""
      approval_status: approved
      execution_status: promoted
      questions:
        - id: q-anchor
          text: What if an anchor bullet conflicts with the new JD?
          answer: Anchors are preserved regardless (non-negotiable). A conflict surfaces in the reuse report for human review; it never causes an anchor to be dropped or silently rewritten.
      decisions_notes: |
        **Trigger:** only when planner verdict == warm-start. **Mechanism:** base
        resume + bullet-selection diffed against new canonical requirements;
        apply-prose-writer (prompt, dispatched via core/pipeline run_phase_iter)
        edits only delta bullets (critic A2). **Anchor ownership:** this slice copies
        anchors verbatim and excludes them from regeneration; slice-8 verifies them
        (resolves the design-critic split). Uncovered required requirements escalate
        to full generation (never fabricate). **Rejected:** blind copy of the whole
        prior resume (carries stale JD-specific claims); regenerating everything
        (defeats the win). Output is candidate; slice-8 gates before acceptance.
    - id: slice-8
      feature_id: feat-bd0fc232
      num: 8
      title: 'Correctness backstop: always re-gate via guard.py + factcheck.py'
      what: |
        Ensure that no matter how much was reused or warm-started, the FINAL assembled
        resume + cover letter pass the full gate suite before acceptance, by reusing
        the EXISTING gate implementations: anchor preservation (src/jobsmith/guard.py
        check_anchors) and no-fabrication / fact-check (src/jobsmith/factcheck.py).
        Wire the backstop (src/jobsmith/reuse/backstop.py) into the assembly step in
        src/jobsmith/core/pipeline.py so it runs on the reused path too. On any gate
        failure, regenerate the offending piece via the full specialist and re-gate,
        with a bounded retry count (from slice-1 config); after the bound, fall back
        to full from-scratch generation, then error rather than ship an ungated claim.
      why: |
        Stage-1 constraint (correctness-first) + Stage-4 (always re-gate final
        output). Critic: the gates are guard.py + factcheck.py (NOT a nonexistent
        apply_reviewer.py, A5); reuse them, do not reinvent. Design critic: the retry
        bound must be a done_when, not buried in a question answer.
      files:
        - src/jobsmith/reuse/backstop.py
        - src/jobsmith/guard.py
        - src/jobsmith/factcheck.py
        - src/jobsmith/core/pipeline.py
      deps:
        - 6
        - 7
      done_when:
        - Final assembled output runs guard.py anchor + factcheck.py no-fabrication/fact-check gates on EVERY run, reuse or not
        - A reused/warm-started piece that fails a gate is regenerated and re-gated, not shipped
        - Regeneration is bounded by the config retry count; on exhaustion it falls back to full from-scratch generation, and failing that, raises an error (never ships an ungated claim)
        - A run that passes via reuse produces output that also passes when re-run with --no-reuse (gate parity)
        - Gate outcomes (pass / regenerated-on-fail / fallback) are recorded for the reuse report
      effort: M
      risk: High
      tests: |
        Unit: test_failed_gate_triggers_regen; test_gates_run_on_reused_output;
              test_retry_bound_then_fallback_then_error
        Integration: test_reuse_vs_no_reuse_gate_parity
      complexity: complex
      approved: false
      comment: ""
      approval_status: approved
      execution_status: promoted
      questions:
        - id: q-retry
          text: How many regenerate-and-re-gate retries before failing the run?
          answer: Bounded by the slice-1 config (default 1-2) per piece; on exhaustion fall back to full from-scratch generation for that artifact, and failing that, raise an error rather than ship an ungated claim.
      decisions_notes: |
        **Trigger:** post-assembly, pre-acceptance, unconditional. **Mechanism:**
        reuse EXISTING guard.py (check_anchors) + factcheck.py -- do not fork them
        (critic A5); the backstop guarantees they run on the reused path. **Failure
        policy:** bounded regenerate-and-re-gate (config), then full from-scratch,
        then error -- promoted to done_when (design-critic danger). **Gate parity
        caveat:** if a gate has nondeterminism, the parity test asserts gate VERDICT
        equality (pass/fail), not byte-identical artifacts, to avoid flakiness
        (design-critic warn). **Rejected:** re-gating only modified pieces (a
        cached-valid piece can be wrong in a new JD context); gating the plan up front
        then trusting it (weakest backstop). This slice is why slices 4/7 are safe.
    - id: slice-9
      num: 9
      title: Reuse metrics, report, and A/B acceptance harness
      what: |
        Persist per-run metrics to run_metrics: model-call count, wall-clock, and
        reused-vs-generated tallies per candidate. Emit a human-readable reuse report
        at end of run ("reused company-research from app Y; warm-started from resume
        Z; regenerated 3 bullets; 2 gates re-run"). Add an A/B bench harness
        (tests/test_reuse_ab.py) that runs the same JD with --no-reuse and with reuse
        -- clearing/controlling the existing llm_cache so it measures the reuse
        layer's INCREMENTAL benefit -- and asserts a >=50% reduction in model calls
        AND a >=50% reduction in wall-clock on a warm candidate, FAILING if either
        metric misses, while gate verdicts are identical.
      why: |
        Stage-4: per-run metrics + A/B harness vs baseline; Stage-3 UX: surface
        "reused X from prior application Y". Critics: tests are flat under tests/ (not
        tests/bench/); the baseline must control for the existing llm_cache; and the
        50%-calls-AND-50%-wall-clock acceptance must explicitly fail if either misses.
      files:
        - src/jobsmith/reuse/metrics.py
        - src/jobsmith/reuse/report.py
        - tests/test_reuse_ab.py
      deps:
        - 6
        - 8
      done_when:
        - Every run records model-call count, wall-clock, and per-candidate reused/generated counts to run_metrics
        - End-of-run reuse report names each reused source application/artifact for transparency
        - A/B harness controls for llm_cache and asserts >=50% fewer model calls AND >=50% less wall-clock on a warm JD vs --no-reuse, FAILING if either metric misses
        - A/B harness asserts gate verdicts are identical between reuse and --no-reuse runs
      effort: M
      risk: Med
      tests: |
        Unit: test_metrics_persisted; test_report_names_sources
        Bench: test_reuse_ab_savings_and_gate_parity (tests/test_reuse_ab.py)
      complexity: standard
      approved: false
      comment: ""
      approval_status: approved
      decisions_notes: |
        **State:** run_metrics table (slice-1) holds per-run counts; report renders
        from it. **Acceptance:** the A/B harness is the hard gate -- it FAILS if
        either the call-reduction or the wall-clock-reduction misses 50%, or if gate
        verdicts diverge (design-critic danger: explicit AND-gate). **Baseline:** the
        harness controls for the existing llm_cache so it measures the reuse layer's
        incremental benefit, not pre-existing memoization (critic). **Path:**
        tests/test_reuse_ab.py (flat tests/ dir, not tests/bench/). **Rejected:**
        logging-only (no enforced savings bar); manual spot-check (no regression
        guard). The report doubles as the Stage-3 transparency UX.
