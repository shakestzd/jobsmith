critique:
    reviewed_at: "2026-05-23"
    reviewers:
        - Haiku (design)
        - Sonnet (feasibility)
    assumptions:
        - id: A1
          status: falsified
          text: A CLI-spawned onboard subprocess can feed the in-memory SSE supervisor for live web progress via a reserved __onboard__ slug.
          evidence: supervisor.py:265 register_run requires an in-process asyncio task; a CLI subprocess cannot write to it. apply's API path uses asyncio.to_thread + register_run, NOT headless.py.
        - id: A2
          status: falsified
          text: src/jobsmith/lint.py exists and exposes a callable lint function for slice-5's gate.
          evidence: lint is a Typer command embedded in cli.py:606-685; no lint.py module exists. It also only validates work.yml, not skill/education/author.
        - id: A3
          status: questionable
          text: Required runtime deps for the new code are already available.
          evidence: platformdirs, tomli (Py3.10 tomllib backport — requires-python >=3.10 at pyproject.toml:34), pdfplumber/pypdf, and python-docx are all ABSENT from pyproject.toml.
        - id: A4
          status: plausible
          text: The .apply-state/ + db put-state/get-state slug pattern is reusable for .onboard-state/.
          evidence: core/paths.py:64 + apply_state table (migration 005) accept arbitrary slug TEXT; DB-state reuse is fine. Only the LIVE SSE path (A1) is the problem.
        - id: A5
          status: verified
          text: Repo-root is resolved in multiple scattered places that slice-1/2 must consolidate.
          evidence: main.py:70, main.py:180, applications.py:574, applications.py:606, artifacts.py:61, master.py:77, master.py:89, core/paths.py:26/167/176/196 — more sites than the plan's '>=4'.
    critics: []
    risks:
        - risk: 'Execution-model split: CLI-subprocess onboarding (slice-3) cannot drive the in-memory SSE supervisor that slice-6''s web progress assumes.'
          severity: High
          mitigation: 'Resolved in revised slice-3/6: onboard gets two entry paths mirroring apply — CLI writes DB state only (no live SSE); the API path runs in-process via asyncio.to_thread + supervisor.register_run. Web flow uses the API path.'
        - risk: src/jobsmith/lint.py does not exist; lint logic is CLI-embedded and only checks work.yml.
          severity: High
          mitigation: Revised slice-5 now explicitly extracts lint from cli.py:606-685 into a callable src/jobsmith/lint.py and extends validation to all four master sections; the 'guarantees validity' claim softened accordingly.
        - risk: Undeclared dependencies (platformdirs, tomli, pdfplumber/pypdf, python-docx) block slices 1 and 4.
          severity: Medium
          mitigation: pyproject.toml added to slice-1 and slice-4 file lists with explicit done_when to declare each dep; tomli pinned for Py3.10 compat.
        - risk: No clobber/merge policy when onboarding runs against a repo that already has populated masters.
          severity: Medium
          mitigation: 'Revised slice-3 bootstrap + slice-5 merge define: abort with guidance if masters are non-empty unless --force (overwrite) or --merge is passed.'
        - risk: master.py has TWO cwd-coupled reads (77 and 89), and its module-level helpers can't read app.state without a Request/Depends injection.
          severity: Medium
          mitigation: slice-2 done_when expanded to both call sites; decision_notes note the Depends() injection wrinkle.
    synthesis: |
        The design is sound and well-scoped, but two High-severity feasibility blockers (A1, A2)
        must be resolved before human review — both are now folded into revised slices. A1 (the
        CLI-vs-supervisor SSE mismatch) is the single biggest risk: slice-3 and slice-6 now adopt
        apply's real dual-path model (CLI = DB state only; API = in-process asyncio.to_thread +
        register_run) instead of the original "CLI subprocess + __onboard__ slug gives live SSE
        for free" assumption. A2 (no lint.py, lint only checks work.yml) is absorbed into slice-5
        as an explicit extraction + schema-coverage step. The remaining items are Medium: declare
        four missing dependencies, define a clobber/merge policy for existing repos, fix BOTH
        master.py cwd reads, and widen slice-1's file scope to core/paths.py + _cli_apply.py.
        Reviewer should focus first on the revised slice-3 execution model and slice-5 lint
        extraction — those changed most. The plan-level gaps the design critic flagged (error/
        recovery UX, observability, user docs) are acknowledged as follow-up, intentionally NOT
        added as slices to keep this plan's footprint tight; flag if you want them in-scope.
