meta:
    id: plan-95ec8de7
    title: Location-decoupling + agentic onboarding
    description: |
        Make jobsmith installable for a single jobseeker without the "cd into a magic
        directory" friction. Two intertwined concerns:
          (A) Decouple repo-root discovery from cwd via a user-level settings file.
          (B) An agentic `jobsmith onboard` command that bootstraps master content
              from what the user already has (resume PDF/DOCX, LinkedIn export, profile
              URL, free-text paste), then interviews them for missing fields.
        Scope edge: backend + web onboarding flow only. NO native desktop shell
        (Tauri/Electron) in this plan. Stays single-tenant — no auth/DB-isolation/
        containerized sandboxing (those belong to a hosted-SaaS plan, explicitly out
        of scope here).
        Acceptance north star: `jobsmith` runs from ANY cwd via the settings file, and
        onboarding turns a real resume PDF into valid, lint-passing master YAMLs with a
        gap-interview for missing fields.
    created_at: ""
    status: draft
    schema_version: v3
    version: 1
design:
    problem: |
        jobsmith can only run from a directory containing .apply-config.yaml because
        repo-root discovery is cwd-coupled (find_config(cwd), config.py:262). A jobseeker
        who installs the tool has no obvious "where do I run this" answer, and there is no
        on-ramp that uses the resume/LinkedIn content they already have — they would have
        to author every master YAML by hand. We need an install-and-go, single-user
        experience: run from anywhere, and bootstrap master content agentically.
    goals:
        - Run jobsmith from any working directory via a persisted user-level settings file (repo_root).
        - Provide an agentic `jobsmith onboard` that seeds master YAMLs from existing resume/LinkedIn/paste, then interviews for gaps.
        - 'Guarantee onboarding output is valid: final master YAMLs pass `jobsmith lint` before persistence.'
        - Expose the same onboarding through the existing web app (no terminal required).
    constraints:
        - 'Stay single-tenant: NO auth/registration, per-user DB isolation, or containerized sandboxing in this plan.'
        - No native desktop shell (Tauri/Electron) — backend + existing web app only.
        - 'Preserve backward compatibility: existing JOBSMITH_REPO_ROOT env deploys and the find_config(cwd) fallback must keep working.'
        - 'No fabrication: extracted content must trace to source; honor LinkedIn auth-walls (no scraping behind login).'
    approved: false
    comment: ""
slices:
    - id: slice-1
      num: 1
      title: User-level settings file + repo-root resolution precedence
      what: |
        Introduce a user-level settings store (TOML at the OS config dir, e.g.
        ~/.config/jobsmith/settings.toml; resolved via platformdirs) holding a
        `repo_root` key. Centralize ALL repo-root resolution in paths.py
        `repo_root_for()` — today it is a one-line wrapper over find_config(cwd)
        (paths.py:14-19); make it the multi-tier resolver with documented precedence:
          1. explicit --repo-root CLI flag (new global option)
          2. JOBSMITH_REPO_ROOT env var (existing path)
          3. settings.toml repo_root
          4. find_config(cwd) walk-up (existing fallback)
          5. error with actionable message if none resolve to a dir containing
             .apply-config.yaml
        Add `jobsmith config set-repo-root <path>`, `jobsmith config show`,
        `jobsmith config clear-repo-root`. Settings module is new
        (src/jobsmith/settings.py). Because core/paths.py also calls find_config(cwd)
        at lines 26/167/176/196 and _cli_apply.py threads cwd into those helpers, both
        are in scope so every read funnels through the one resolver. Declare the new
        deps (platformdirs; tomli for Python 3.10 since tomllib is stdlib only >=3.11
        and requires-python is >=3.10) in pyproject.toml.
      why: |
        The cwd coupling (find_config(cwd) in config.py:262) is the root cause of
        "must be run from a specific directory." A persisted user-level pointer is
        the minimum change that lets an installed app run from anywhere while keeping
        the on-disk repo model intact. User chose "user-level config points to a
        chosen path" over an opaque app-data dir for flexibility.
      files:
        - src/jobsmith/settings.py
        - src/jobsmith/paths.py
        - src/jobsmith/core/paths.py
        - src/jobsmith/config.py
        - src/jobsmith/cli.py
        - src/jobsmith/_cli_apply.py
        - pyproject.toml
        - tests/test_paths.py
        - tests/test_settings.py
      deps: []
      done_when:
        - Running any jobsmith command from a cwd OUTSIDE the repo resolves the repo via settings.toml repo_root
        - Resolution precedence is flag > env > settings > find_config(cwd) > actionable error, with a unit test asserting each tier wins over the next
        - '`jobsmith config set-repo-root <path>` validates the path contains .apply-config.yaml and persists it (creating settings.toml if absent); `config show` prints the resolved root and which tier it came from'
        - platformdirs and tomli are declared in pyproject.toml; the settings read works on Python 3.10
        - core/paths.py helpers (apply_state_dir, applications_dir, pipeline_db_path, build_paths) resolve via repo_root_for(), not direct find_config(cwd)
      effort: M
      risk: Med
      tests: |
        Unit: TestRepoRootPrecedence — table test, each tier set/unset, assert winner
        Unit: TestSettingsRoundTrip — set-repo-root writes TOML, reload reads it back
        Unit: TestRepoRootNoConfigError — no tier resolves -> clear error, not silent cwd
        Unit: TestCorePathsUseResolver — core/paths helpers honor settings repo_root
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-settings-format
          text: TOML vs JSON for settings.toml?
          answer: TOML — human-editable, matches the 'power user can hand-edit' intent; tomli reads it on 3.10 / tomllib on 3.11+, tomli-w (or a 3-line writer) emits it.
      critic_revisions:
        - source: sonnet
          severity: DANGER
          summary: 'Py3.10 compat: tomllib is stdlib only >=3.11 but requires-python>=3.10 (pyproject.toml:34); tomli backport must be added — RESOLVED: tomli added to files/done_when.'
        - source: sonnet
          severity: WARN
          summary: 'platformdirs absent from pyproject.toml — RESOLVED: declared in done_when.'
        - source: sonnet
          severity: WARN
          summary: 'core/paths.py (find_config at 26/167/176/196) and _cli_apply.py omitted from original scope — RESOLVED: both added to files + a done_when.'
        - source: sonnet
          severity: INFO
          summary: config.py:262 find_config(start) and paths.py:14-19 repo_root_for confirmed accurate; repo_root_for is currently a thin cwd wrapper as the plan assumes.
      decisions_notes: |
        **State:** new settings.toml under OS config dir (platformdirs.user_config_dir),
          separate from .apply-config.yaml which stays the per-repo contract.
        **Trigger:** every repo-root resolution funnels through paths.repo_root_for().
        **Precedence:** flag > env > settings > find_config(cwd) > error. Env kept above
          settings so existing API/JOBSMITH_REPO_ROOT deploys are unaffected.
        **Deps:** platformdirs (config dir), tomli (TOML read on Py3.10; tomllib only
          stdlib >=3.11 and requires-python is >=3.10). A tiny hand-rolled writer or
          tomli-w emits the file.
        **Rejected:** OS app-data-dir-IS-the-repo (less flexible, user wanted a chosen
          path); storing repo_root inside .apply-config.yaml (chicken-and-egg — can't
          find the config without already knowing the root).
    - id: slice-2
      num: 2
      title: Route API + master reads through the shared resolver
      what: |
        Make the API resolve repo_root through paths.repo_root_for() (settings-aware)
        instead of reading os.environ["JOBSMITH_REPO_ROOT"] directly in scattered spots
        (main.py:70, main.py:180, applications.py:574, applications.py:606,
        artifacts.py:61), and fix BOTH cwd-coupled reads in master.py —
        _require_config_path (master.py:77) AND _get_db_path_for_master (master.py:89) —
        to use the cached app.state.repo_root. Since master.py helpers are module-level
        and lack a Request, inject the root via a FastAPI Depends() (or pass it as a
        param) rather than reaching for a global. After this slice the env var is just
        tier-2 of the shared chain and app.state.repo_root is the single cached truth.
      why: |
        Repo-root is resolved in >=7 sites (5 env reads + 2 master cwd reads).
        Without consolidating, slice-1's settings tier would be honored by the CLI but
        silently ignored by the web app.
      files:
        - src/jobsmith/api/main.py
        - src/jobsmith/api/applications.py
        - src/jobsmith/api/artifacts.py
        - src/jobsmith/api/master.py
        - tests/test_api_applications.py
        - tests/test_api_snapshot.py
      deps:
        - 1
      done_when:
        - All API repo-root reads go through paths.repo_root_for(); a grep for os.environ.get('JOBSMITH_REPO_ROOT') outside paths.py returns zero hits
        - BOTH master.py call sites (_require_config_path:77 and _get_db_path_for_master:89) use the injected app.state.repo_root, not find_config(cwd) — verified by a test that starts the app from an unrelated cwd
        - A NON-mocked integration test proves a settings.toml repo_root override is live through app startup (not a stubbed resolver)
      effort: M
      risk: Med
      tests: |
        Integration: TestApiRepoRootFromSettings — start app from /tmp, settings points
          elsewhere, assert GET /applications reads the settings repo (resolver NOT mocked)
        Integration: TestMasterReadHonorsAppState — both master helpers use cached root
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-env-precedence
          text: Should env var still outrank settings post-consolidation?
          answer: Yes — keep env at tier 2 above settings so container/CI deploys that set JOBSMITH_REPO_ROOT keep working without a settings file.
      critic_revisions:
        - source: sonnet
          severity: WARN
          summary: 'master.py has TWO cwd reads (77 _require_config_path AND 89 _get_db_path_for_master); original done_when named only one — RESOLVED: both now required.'
        - source: sonnet
          severity: INFO
          summary: master.py module-level helpers can't read request.app.state without a Request; needs Depends()/param injection — captured in decisions.
        - source: sonnet
          severity: SUCCESS
          summary: All five env-read sites (main.py:70/180, applications.py:574/606, artifacts.py:61) confirmed real; consolidation goal is grounded.
        - source: haiku
          severity: WARN
          summary: 'done_when ''existing tests pass unchanged'' is weak if they mock the resolver — RESOLVED: added a non-mocked live-override integration test.'
      decisions_notes: |
        **State:** app.state.repo_root remains the per-process cache, seeded from
          paths.repo_root_for() so the settings tier participates.
        **Trigger:** lifespan startup (main.py:166 _lifespan, sets state at :172)
          computes once; helpers read cache.
        **Injection wrinkle:** master.py helpers are module-level with no Request; thread
          repo_root via FastAPI Depends() or an explicit parameter — do NOT introduce a
          module global.
        **Rejected:** per-request re-resolution (needless cost, repo can't move
          mid-process); fixing only _require_config_path (misses :89, the second outlier).
    - id: slice-3
      num: 3
      title: '`jobsmith onboard` command + agentic pipeline scaffold (dual entry, like apply)'
      what: |
        New `jobsmith onboard` command + an onboarding pipeline that REUSES apply's real
        dual-entry model, not a single CLI subprocess:
          - CLI path: spawns the agentic run via headless.py run_phase (Popen with
            cwd = resolved repo root, headless.py:348/393) and writes state to the DB;
            NO live SSE (CLI is not in the API event loop).
          - API path: runs in-process via asyncio.to_thread + supervisor.register_run
            (the same path apply's API uses) so the web flow (slice-6) gets live SSE.
        Phase 0: ensure a repo exists at the resolved root — if .apply-config.yaml is
        absent, scaffold it. NOTE: `jobsmith init` is a Typer command (cli.py:244), so
        first extract its scaffold logic into a callable library function, then call it.
        Clobber policy: if masters already exist and are non-empty, ABORT with guidance
        unless --force (overwrite) or --merge is passed. Accept input flags
        (--resume-file, --linkedin-export, --linkedin-url, --paste/--paste-file; one or
        more), write artifacts to .onboard-state/ (mirrors .apply-state/, core/paths.py:64),
        and dispatch the onboarding agent. Delivers command shell, repo-bootstrap,
        clobber guard, state plumbing, and dispatch — NOT the parsers (slice-4) or
        gap-interview (slice-5).
      why: |
        User chose a first-class `jobsmith onboard` command and wants onboarding itself
        to be agentic. Reusing apply's PROVEN dual-path execution (CLI subprocess +
        in-process API path) is what actually makes live web progress work; the original
        "CLI subprocess + __onboard__ slug = free SSE" assumption was falsified (A1).
      files:
        - src/jobsmith/cli.py
        - src/jobsmith/_cli_onboard.py
        - src/jobsmith/headless.py
        - src/jobsmith/core/paths.py
        - src/jobsmith/plugin/agents/onboard-orchestrator.md
        - tests/test_cli_onboard.py
      deps:
        - 1
      done_when:
        - '`jobsmith onboard` against a directory with NO .apply-config.yaml scaffolds the repo (via the extracted init library fn), persists its path to settings, and exits phase-0 cleanly'
        - Running onboard against a repo whose masters are already non-empty ABORTS with guidance unless --force or --merge is given
        - CLI path writes a manifest + state under .onboard-state/ keyed by the __onboard__ slug; the API path registers with supervisor.register_run so SSE events stream
        - Input flags are validated and inlined into the agent spec; an invalid file path errors before dispatch
      effort: L
      risk: High
      tests: |
        Integration: TestOnboardScaffoldsRepo — empty dir -> repo + settings persisted
        Integration: TestOnboardAbortsOnPopulated — non-empty masters -> abort w/o --force
        Unit: TestOnboardInputValidation — bad --resume-file path -> error pre-dispatch
        Integration: TestOnboardDispatch — CLI path Popen cwd correct + state written;
          API path calls register_run (subprocess/thread mocked)
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-exec-model
          text: How does the web flow get live progress if onboard is a CLI subprocess?
          answer: It doesn't via the CLI path — the API path runs onboard in-process (asyncio.to_thread + supervisor.register_run), exactly as apply's API does. The CLI path only writes DB state.
        - id: q-onboard-slug
          text: How to namespace onboarding state in the shared DB?
          answer: Reserved slug __onboard__ via the existing apply_state table — verified no slug-format constraint in migration 005, so no schema change.
      critic_revisions:
        - source: sonnet
          severity: DANGER
          summary: 'A1 falsified: CLI-spawned subprocess cannot drive the in-memory supervisor (supervisor.py:265 needs an asyncio task) — RESOLVED: adopt apply''s dual-path model; API path uses to_thread + register_run.'
        - source: sonnet
          severity: WARN
          summary: '`jobsmith init` is a Typer command (cli.py:244), not a library fn; ''reuse init internals'' needs an extraction step — RESOLVED: noted in what/decisions.'
        - source: sonnet
          severity: INFO
          summary: headless.py run_phase (348) passes cwd to Popen (393-400); subprocess reuse for the CLI path is accurate. .apply-state pattern (core/paths.py:64) confirmed reusable.
        - source: haiku
          severity: DANGER
          summary: 'No clobber/merge policy for an existing populated repo — RESOLVED: abort-unless-(--force|--merge) added to what + done_when + a test.'
        - source: haiku
          severity: WARN
          summary: --resume-file validation straddles slice-3/4 boundary; kept pre-dispatch validation in slice-3 (existence/format only), semantic parsing stays in slice-4.
      decisions_notes: |
        **Trigger:** explicit `jobsmith onboard` CLI invocation; web triggers the API path.
        **Execution model (revised per A1):** mirror apply — CLI uses headless.py Popen and
          writes DB state only; the API path runs in-process (asyncio.to_thread +
          supervisor.register_run, supervisor.py:265) for live SSE. A CLI subprocess CANNOT
          feed the in-memory supervisor, so live web progress comes from the API path.
        **State:** .onboard-state/ dir parallel to .apply-state/; db put-state/get-state
          keyed by reserved slug __onboard__ (apply_state table accepts arbitrary slug TEXT,
          migration 005 — no schema change).
        **Bootstrap:** extract jobsmith init scaffold (cli.py:244) into a library fn first;
          calling a Typer command programmatically is awkward.
        **Clobber:** abort if masters non-empty unless --force/--merge.
        **Rejected:** "CLI subprocess + slug = free SSE" (falsified — supervisor is in-proc);
          web-only wizard (user wanted a CLI command); brand-new execution engine.
    - id: slice-4
      num: 4
      title: 'Ingest specialists: resume, LinkedIn export, URL, free-text'
      what: |
        The agent specialists/parsers that turn each input type into candidate master
        content (work/skill/education/author structures):
          - Resume PDF/DOCX: text extraction (PDF via pdfplumber; DOCX via python-docx)
            then LLM-structured into the master schema. Fall back to the agent reading
            the file directly if extraction is poor.
          - LinkedIn export: handle both the "Download your data" ZIP (Positions.csv,
            Education.csv, Skills.csv) and a profile PDF.
          - LinkedIn URL: best-effort fetch with explicit caveat that auth-walls usually
            block it; degrade gracefully to "couldn't fetch, please paste or upload."
          - Free-text paste: LLM structures whatever the user provides.
        Each specialist emits candidate-<section>.json into .onboard-state/ plus a
        provenance map linking each field to its source snippet. No fabrication: every
        claim must trace to source text. Declare pdfplumber + python-docx in
        pyproject.toml; create the src/jobsmith/onboard/ package (with __init__.py).
      why: |
        This is the "use what the user already has" requirement. All input formats were
        selected, so each needs a parser, with the URL path flagged best-effort due to
        LinkedIn auth-walling.
      files:
        - src/jobsmith/onboard/__init__.py
        - src/jobsmith/onboard/extract_resume.py
        - src/jobsmith/onboard/extract_linkedin.py
        - src/jobsmith/onboard/extract_text.py
        - src/jobsmith/plugin/agents/onboard-extractor.md
        - pyproject.toml
        - tests/test_onboard_extract.py
        - tests/fixtures/onboarding/
      deps:
        - 3
      done_when:
        - pdfplumber and python-docx are declared in pyproject.toml; a fixture resume PDF AND DOCX both extract
        - A sample resume produces candidate work/skill/education/author JSON where each entry has a provenance entry pointing at source text; a fixture asserts an injected non-source claim is dropped
        - A LinkedIn 'Download your data' ZIP populates positions, education, and skills from its CSVs
        - A LinkedIn URL that is auth-walled (403/login-redirect/999) degrades to a clear 'paste or upload instead' result rather than failing the run
      effort: L
      risk: High
      tests: |
        Unit: TestExtractResumePdf / TestExtractResumeDocx — fixtures -> structured fields
        Unit: TestExtractLinkedinZip — fixture ZIP CSVs -> positions/education/skills
        Unit: TestExtractUrlAuthWalled — 403/login-redirect fixture -> graceful skip
        Unit: TestNoFabrication — fixture pairs (source + expected); injected claim absent
          from source is dropped/flagged via the provenance map
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-pdf-extractor
          text: Which PDF text extractor for resumes?
          answer: pdfplumber — maintained, pure-Python, table-aware (resumes are columnar); pypdf is the fallback. Declared in pyproject.toml; agent direct-read is the last resort.
      critic_revisions:
        - source: sonnet
          severity: DANGER
          summary: 'pdfplumber/pypdf and python-docx absent from pyproject.toml — RESOLVED: pyproject.toml added to files; pdfplumber+python-docx in done_when, extractor choice resolved.'
        - source: sonnet
          severity: WARN
          summary: 'src/jobsmith/onboard/ subpackage doesn''t exist and needs __init__.py — RESOLVED: added to files.'
        - source: haiku
          severity: WARN
          summary: '''traces to source'' had no test mechanism — RESOLVED: provenance map + paired source/expected fixtures + TestNoFabrication.'
        - source: haiku
          severity: INFO
          summary: 'Auth-wall test should reflect real LinkedIn responses (403/login-redirect), not just 999 — RESOLVED: broadened in done_when/tests.'
      decisions_notes: |
        **Payload:** each specialist writes candidate-<section>.json to .onboard-state/
          plus a provenance map (field -> source snippet) so no-fabrication is testable.
        **State:** candidate content is staged, NOT written to master YAMLs yet — the
          gap-interview (slice-5) gates the final write.
        **Deps:** pdfplumber (PDF; pulls pdfminer.six) chosen over pypdf for table-aware
          extraction; python-docx for DOCX. Both new in pyproject.toml.
        **Rejected:** scraping LinkedIn behind auth (ToS + auth-wall, privacy rules);
          merging straight into masters without a confirm step.
    - id: slice-5
      num: 5
      title: Extract lint to a library, gap-interview, lint-gated master write
      what: |
        PREREQUISITE (per A2): `jobsmith lint` currently lives inside cli.py:606-685 as a
        Typer command and validates only work.yml. Extract its logic into a callable
        src/jobsmith/lint.py and extend it to validate all four master sections
        (work/skill/education/author). Then: the orchestrator diffs candidate content
        against the master schema's required fields, runs a conversational gap-interview
        for what's missing or low-confidence, merges candidate + answers into the master
        YAMLs at assets/content/ (config.py:18-43 paths), and calls the extracted lint as
        a hard gate. On failure it loops (cap 3) then stops and reports remaining errors
        rather than persisting broken masters or looping forever. Honors slice-3's
        --merge vs --force semantics when masters pre-exist. Emits an onboarding summary
        (imported vs user-supplied vs still-optional).
      why: |
        The user's core ask: "use what the user has, then have them fill the gaps."
        The lint gate makes the masters valid for a subsequent apply — but only after the
        lint logic is extracted and widened beyond work.yml (the original plan overstated
        what today's lint guarantees).
      files:
        - src/jobsmith/lint.py
        - src/jobsmith/cli.py
        - src/jobsmith/onboard/gap_analysis.py
        - src/jobsmith/onboard/merge_master.py
        - src/jobsmith/plugin/agents/onboard-orchestrator.md
        - tests/test_lint.py
        - tests/test_onboard_gap_merge.py
      deps:
        - 4
      done_when:
        - lint logic is extracted from cli.py into a callable src/jobsmith/lint.py; the `jobsmith lint` CLI command now calls it, and it validates work/skill/education/author (test asserts a malformed skill.yml fails)
        - Missing required master fields are surfaced as interview questions; provided answers merge into the correct master YAML
        - Final master YAMLs pass the extended lint; a lint failure loops the merge step (max 3) then stops and reports, never persisting broken content
        - An onboarding summary reports imported vs user-supplied vs still-optional fields
      effort: M
      risk: Med
      tests: |
        Unit: TestLintLibraryAllSections — malformed skill/education/author each fail
        Unit: TestGapAnalysis — candidate missing author.email -> question generated
        Integration: TestMergeThenLint — candidate+answers -> masters pass extended lint
        Integration: TestLintFailLoopsCapped — invalid merge -> no persist, stops at 3
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-lint-loop-cap
          text: Cap the lint-fix loop?
          answer: Yes — cap at 3 iterations, then stop and report remaining errors; never persist broken masters.
      critic_revisions:
        - source: sonnet
          severity: DANGER
          summary: 'A2 falsified: src/jobsmith/lint.py doesn''t exist (lint is cli.py:606-685) and only checks work.yml — RESOLVED: slice now extracts lint to a library + extends to all 4 sections.'
        - source: sonnet
          severity: WARN
          summary: '''lint gate guarantees validity for apply'' overstated given work.yml-only coverage — RESOLVED: widened coverage + softened claim.'
        - source: haiku
          severity: INFO
          summary: 'Lint-loop terminal state was unspecified — RESOLVED: after 3 failures, stop + report, no persist; added to done_when + test.'
      decisions_notes: |
        **Prerequisite:** extract lint from cli.py:606-685 into src/jobsmith/lint.py
          (callable) and widen coverage to all four master sections; CLI delegates to it.
        **Trigger:** runs after slice-4 extraction within the same onboard run.
        **State:** writes to assets/content/*.yml only AFTER lint passes; staging stays in
          .onboard-state/ until then. Terminal state after 3 failed lint loops = stop +
          report, do NOT persist broken masters.
        **Payload:** gap questions derived from schema-required fields minus
          high-confidence extracted fields.
        **Rejected:** writing masters before lint; relying on the old work.yml-only lint
          (would falsely pass incomplete skill/education/author); unbounded interview.
    - id: slice-6
      num: 6
      title: Web onboarding flow (upload, paste, gap-interview, masters-ready)
      what: |
        Frontend onboarding wizard in the existing web app: first-run flow to upload a
        resume / LinkedIn export, paste text, or give a URL; kicks off onboarding via the
        slice-3 API path (in-process asyncio.to_thread + supervisor.register_run, NOT a
        detached CLI subprocess); streams progress over the existing SSE channel
        (supervisor.py); renders the gap-interview questions; lands on "masters ready".
        New API endpoints wrap the slice-3..5 pipeline: POST /onboard (multipart inputs,
        reusing slice-3's validator — not a duplicate), GET onboarding status, answer gap
        questions. Enforce a multipart size cap (e.g. 10MB, 413 on oversize).
      why: |
        Scope edge chosen = "backend + web onboarding only." The web flow is the
        jobseeker-facing surface that makes onboarding usable without a terminal,
        completing install-and-go (minus a native shell, explicitly out of scope).
      files:
        - web/src/app/onboarding.tsx
        - web/src/api/hooks.ts
        - web/src/api/client.ts
        - src/jobsmith/api/onboard.py
        - src/jobsmith/api/main.py
        - tests/test_api_onboard.py
        - web/src/app/onboarding.test.tsx
      deps:
        - 2
        - 5
      done_when:
