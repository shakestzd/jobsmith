critique:
    reviewed_at: "2026-06-05"
    reviewers:
        - Haiku (design)
        - Sonnet (feasibility)
    assumptions:
        - id: A1
          status: falsified
          text: '`jobsmith up` can `poll the port then webbrowser.open` after starting the server.'
          evidence: server.py:28 uvicorn.run() blocks the calling thread and never returns; the open must happen from a daemon thread (wait-for-listen) started BEFORE uvicorn.run, or via uvicorn Config+Server with a startup callback.
        - id: A2
          status: falsified
          text: Injecting window.__JOBSMITH__.token is enough for the SPA to authenticate, including SSE.
          evidence: client.ts:17 STATIC_TOKEN is an immutable build-time const (import.meta.env); buildEventsUrl (client.ts:265-271) reads getAccessToken()||STATIC_TOKEN and never consults a window shim — SSE URLs would be unauthenticated unless the client is refactored to read a mutable runtime token.
        - id: A3
          status: questionable
          text: Citing the token resolver as auth.py:46.
          evidence: auth.py:46 is the constant TOKEN_ENV_VAR; the real resolver is _get_expected_token() (lru_cache) at auth.py:86; PRIVATE_TOKEN_PATH is a CWD-relative Path at auth.py:52.
        - id: A4
          status: verified
          text: API routers sit under a /api prefix so a SPA catch-all can fall back safely.
          evidence: main.py:237-303 include_router(..., prefix='/api') consistently; EXCEPT a bare @app.get('/health') at main.py:231 and FastAPI's /docs,/openapi.json,/redoc — the catch-all exclusion must cover these bare routes, not just /api.
        - id: A5
          status: verified
          text: CORSMiddleware already exists and is Vite-dev-scoped.
          evidence: main.py:217-228 allows only http://localhost:5173 and :5174; harmless under same-origin but redundant for the served UI — keep it for --dev split mode.
        - id: A6
          status: questionable
          text: web/dist is a clean build artifact the hook can copy.
          evidence: web/dist exists on disk (assets/, index.html) but has NO .gitignore entry; the hook must run `vite build` FRESH and never copy a stale on-disk dist; both web/dist and src/jobsmith/web_dist should be gitignored.
    critics: []
    risks:
        - risk: browser-open after listen is a blocking-call problem (uvicorn.run never returns).
          severity: High
          mitigation: 'Revised slice-4: open from a daemon thread that waits for the port to accept, started before uvicorn.run (or uvicorn Config+Server startup callback). Explicitly NOT ''poll then open'' inline.'
        - risk: injected token never reaches SSE auth (immutable STATIC_TOKEN const).
          severity: High
          mitigation: 'Revised slice-3: refactor client.ts to read a MUTABLE runtime token (window.__JOBSMITH__) in BOTH the header path and buildEventsUrl (client.ts:265-271); VITE var becomes fallback only.'
        - risk: port-already-in-use yields an ugly stacktrace (jobsmith commonly already binds local ports).
          severity: Medium
          mitigation: 'Revised slice-4: catch the bind error, print a friendly message suggesting --port, exit non-zero; done_when + test added.'
        - risk: wheel silently ships without UI (API-only) when node is absent at build time.
          severity: Medium
          mitigation: 'Revised slice-2: a visibility check (jobsmith doctor / --version reports ''UI bundled: yes/no'') + CI builds on a node image so published wheels always include the UI.'
        - risk: inlining a token into index.html is an XSS-exposed secret.
          severity: Medium
          mitigation: 'Revised slice-3: JSON-encode/HTML-escape the token, inject only on a localhost bind, add a restrictive CSP on the served index; a localhost-guarded /api/bootstrap remains an acceptable alternative.'
    synthesis: |
        Macro-architecture is sound (single-server static UI + wheel bundle + one-command launch +
        localhost auto-auth) and most citations check out, but two High-severity feasibility blockers
        must be fixed before build — both now folded into revised slices. A1 (slice-4): `uvicorn.run()`
        blocks, so the browser-open cannot be "poll then open" inline — it needs a wait-for-listen
        daemon thread started before the blocking call (or a uvicorn startup callback). A2 (slice-3):
        the immutable build-time STATIC_TOKEN const means a window shim alone won't authenticate SSE —
        client.ts must be refactored to read a mutable runtime token in BOTH the header and
        buildEventsUrl paths. Also corrected: the token resolver is _get_expected_token() at auth.py:86
        (not :46); the SPA catch-all must exclude bare /health + /docs as well as /api; the hatch hook
        is a NEW [tool.hatch.build.hooks.custom] section (not the force-include at :100) and must build
        fresh to avoid stale web/dist. Medium items (PORT_IN_USE UX, silent API-only wheel, token XSS,
        CORS/cache-control/Windows-webbrowser/editable-install/JWT-refresh) are called out per-slice as
        must-handle-on-implementation. Reviewer should scrutinize slice-3 (client token refactor) and
        slice-4 (non-blocking browser-open) first — those changed most.
