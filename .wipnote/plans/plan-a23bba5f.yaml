meta:
    id: plan-a23bba5f
    title: Convert Jobsmith to Tauri Desktop Application
    description: Package the Jobsmith React UI and Python FastAPI/CLI backend into a single-click macOS Tauri desktop app, with the Python backend bundled as a PyInstaller sidecar, dynamic port/token auth, and download-on-first-run Playwright Chromium.
    created_at: "2026-06-26"
    status: draft
    priority: medium
    schema_version: v4
    version: 4
design:
    problem: |
        Running Jobsmith today requires terminal commands (`uv tool install jobsmith`
        then `jobsmith up`) and a pre-installed Python runtime on the host. Non-technical
        users need a single-click native desktop installer that launches the React UI and
        runs the Python scraping/applying backend in the background — no terminal, no
        pre-installed Python or Node.
    goals:
        - Package the React UI + Python FastAPI/CLI backend as a unified Tauri desktop app (macOS .dmg first).
        - Bundle the Python backend with PyInstaller as a Tauri sidecar; lifecycle managed automatically (starts with the app, terminates on window close).
        - 'Auto-authenticate: Rust assigns a port and token and hands them to the web view, reusing Jobsmith''s existing localhost shim — no manual config.'
        - 'Preserve codebase integrity: CLI (`jobsmith up`) and standalone FastAPI operation remain unchanged for non-desktop installs.'
    constraints:
        - The bundle must not require end-users to have node or python pre-installed at runtime.
        - Handle Playwright Chromium packaging — download on first run into the app data dir, with graceful fallback (httpx fast-path) when unavailable/offline.
    approved: false
    comment: ""
    research:
        - url: https://v2.tauri.app/develop/sidecar/
          claim: Authoritative Tauri v2 sidecar contract — externalBin config, the -$TARGET_TRIPLE binary-naming requirement, shell:allow-spawn capability, and app.shell().sidecar() spawn API used across slices 2-3.
          accessed: "2026-06-26"
        - url: https://github.com/dieharders/example-tauri-v2-python-server-sidecar
          claim: Proven Tauri v2 + FastAPI + PyInstaller reference; documents that with PyInstaller onefile, Tauri only holds the bootloader PID (not the Python child), so kill() leaks the process — motivates onedir + parent-PID watchdog in slices 1 and 3.
          accessed: "2026-06-26"
        - url: https://playwright.dev/docs/browsers
          claim: PLAYWRIGHT_BROWSERS_PATH governs both install and runtime browser location and must be identical at both moments and set before importing Playwright — the basis for slice 4's app-data-dir Chromium strategy.
          accessed: "2026-06-26"
slices:
    - id: slice-1
      num: 1
      title: PyInstaller sidecar build for the Python backend (additive entry point)
      what: |
        Add a NEW desktop sidecar entry point `src/jobsmith/desktop/sidecar_main.py`
        that: parses `--port`, sets PLAYWRIGHT_BROWSERS_PATH before any Playwright
        import, starts a parent-PID watchdog (self-terminates if the Tauri parent
        dies), then runs uvicorn on 127.0.0.1:<port> via the existing
        `jobsmith.api.main:create_app` factory (no browser auto-open). Author a
        PyInstaller spec `packaging/jobsmith-sidecar.spec` (onedir) that collects
        uvicorn/fastapi/playwright/claude-agent-sdk hidden imports and bundles the
        pre-built `src/jobsmith/web_dist/` so the sidecar still serves the UI.
        `scripts/build-sidecar.sh` produces the binary named with the host target
        triple into `src-tauri/binaries/`. cli.py is NOT touched.
      why: |
        Goal 2 — the Python backend must run as a self-contained binary with no host
        Python. onedir (not onefile) is chosen so the bundled executable IS the server
        process, eliminating the bootloader-orphan kill problem and slow cold starts.
        Additive entry point preserves Goal 4 (CLI/FastAPI standalone unchanged).
      files:
        - src/jobsmith/desktop/__init__.py
        - src/jobsmith/desktop/sidecar_main.py
        - packaging/jobsmith-sidecar.spec
        - scripts/build-sidecar.sh
        - pyproject.toml
        - hatch_build.py
      deps: []
      done_when:
        - Running the built `jobsmith-sidecar-<triple> --port 8123` serves the API and UI on 127.0.0.1:8123 with no system Python on PATH.
        - The sidecar process exits within ~2s of its parent process being killed (watchdog verified).
        - '`jobsmith up` and `jobsmith api serve` behave identically to before — cli.py is byte-for-byte unchanged (Goal 4).'
      effort: L
      risk: Med
      tests: |
        Integration: build the sidecar in CI, run it on a free port in a clean env
        (PATH stripped of python), curl /health -> 200 and curl / -> index.html
        containing the window.__JOBSMITH__ shim. Watchdog test: spawn sidecar under a
        wrapper, kill the wrapper, assert the sidecar PID is gone within 3s.
        Regression: existing pytest suite (tests/) and `jobsmith up --help` unchanged.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://github.com/dieharders/example-tauri-v2-python-server-sidecar
          claim: Onefile PyInstaller leaks the Python child because Tauri only knows the bootloader PID — adopt onedir + a parent-PID watchdog instead.
          accessed: "2026-06-26"
        - url: https://aiechoes.substack.com/p/building-production-ready-desktop
          claim: '`pyinstaller --onefile server.py` crashes at startup for FastAPI apps; a custom .spec collecting hidden imports/data is required — confirms the spec-file approach in this slice.'
          accessed: "2026-06-26"
      questions:
        - id: q-onefile-onedir
          text: onefile or onedir for the PyInstaller sidecar?
          answer: onedir — eliminates the bootloader-orphan kill problem (dieharders) and gives faster cold start; Tauri externalBin points at the onedir executable, _internal/ ships as bundle resources. (Inferred from research; no offline-bundle requirement forces onefile.)
      decisions_notes: |
        **Trigger:** PyInstaller invoked by scripts/build-sidecar.sh (CI + local), output consumed by Tauri externalBin.
        **State:** Built binary + onedir _internal/ live under src-tauri/binaries/ (gitignored build artifact, rebuildable).
        **Payload:** A self-contained server binary exposing the existing FastAPI app on a caller-chosen port.
        **Rejected:** onefile (-F) — Tauri can only kill the bootloader PID, orphaning the real Python child per the dieharders reference; also slow cold start. Embedding a full CPython via uv — heavier and reinvents what PyInstaller already solves (Goal 2 mandates PyInstaller). Modifying cli.py `up` to double as the sidecar — would couple desktop concerns into the CLI and risk Goal 4.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - src/jobsmith/desktop/__init__.py (new)
            - src/jobsmith/desktop/sidecar_main.py (new — argparse --port, watchdog, uvicorn.run create_app)
            - packaging/jobsmith-sidecar.spec (new — onedir, collect_all uvicorn/playwright, add web_dist)
            - scripts/build-sidecar.sh (new — pyinstaller + rename to -$(rustc --print host-tuple))
            - pyproject.toml (edit — add [project.optional-dependencies] desktop = pyinstaller)
            - hatch_build.py (reference — npm build -> src/jobsmith/web_dist used as PyInstaller data)
        - type: diagram
          title: Sidecar build pipeline
          fields:
            direction: lr
          entries:
            - npm run build (web/)
            - copy web/dist -> src/jobsmith/web_dist
            - pyinstaller jobsmith-sidecar.spec (onedir)
            - rename binary -> jobsmith-sidecar-<triple>
            - src-tauri/binaries/
    - id: slice-2
      num: 2
      title: Tauri v2 scaffold + macOS bundle config + splash frontend
      what: |
        Initialize `src-tauri/` for Tauri v2: Cargo.toml, build.rs, a minimal main.rs
        skeleton, and tauri.conf.json declaring productName/identifier, macOS bundle
        targets [app, dmg], `bundle.externalBin: ["binaries/jobsmith-sidecar"]`, the
        tauri-plugin-shell, and a tiny bundled splash page (frontendDist) shown while
        the sidecar boots. Grant `shell:allow-spawn` for the sidecar in
        capabilities/default.json. Add root `package.json` scripts (`tauri dev`,
        `tauri build`). No backend wiring yet — that is slice 3.
      why: |
        Goal 1 — establish the Tauri shell and bundle pipeline that wraps the existing
        React UI + Python sidecar. A splash frontend lets the window appear instantly
        while the sidecar starts, before navigating to the localhost server.
      files:
        - src-tauri/Cargo.toml
        - src-tauri/build.rs
        - src-tauri/src/main.rs
        - src-tauri/tauri.conf.json
        - src-tauri/capabilities/default.json
        - src-tauri/splash/index.html
        - package.json
      deps: []
      done_when:
        - '`npm run tauri dev` opens a native window showing the splash page (sidecar not yet spawned).'
        - tauri.conf.json validates and `tauri build --bundles dmg` reaches the sidecar-missing error (proving externalBin + bundle config are wired) when no binary is present.
      effort: M
      risk: Low
      tests: |
        Manual: `npm run tauri dev` renders the splash window. Config: `tauri build`
        dry-run / config validation passes. Assert capabilities/default.json grants
        shell:allow-spawn scoped to the sidecar name only (least privilege).
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://v2.tauri.app/develop/sidecar/
          claim: externalBin entries live in bundle config and require a -$TARGET_TRIPLE-suffixed binary; the shell:allow-spawn capability must be granted and scoped to the sidecar name.
          accessed: "2026-06-26"
      questions:
        - id: q-ui-serving
          text: Does Tauri serve the React build itself, or load the Python-served UI?
          answer: Load the Python-served localhost UI (window navigates to http://127.0.0.1:<port>/ in slice 3). Reuses the existing web_dist serving + window.__JOBSMITH__ shim; Tauri frontendDist is only a splash. (Inferred — maximizes reuse, satisfies the chosen inject-before-load auth.)
      decisions_notes: |
        **Trigger:** `npm run tauri dev|build` from repo root; scaffold authored independently of the sidecar binary (referenced by convention).
        **State:** src-tauri/ is committed source; built bundles land in src-tauri/target/ (gitignored).
        **Payload:** A Tauri shell with macOS app+dmg bundle targets and a splash frontend.
        **Rejected:** Bundling the React build as Tauri frontendDist and talking to Python purely over IPC — discards the existing same-origin auth shim and duplicates UI serving; instead the window will navigate to the Python-served localhost UI (slice 3). Electron — far larger bundle, contradicts the Tauri goal.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - src-tauri/Cargo.toml (new — tauri v2, tauri-plugin-shell)
            - src-tauri/build.rs (new)
            - src-tauri/src/main.rs (new — skeleton, builder.run)
            - src-tauri/tauri.conf.json (new — externalBin, bundle.macOS targets app+dmg)
            - src-tauri/capabilities/default.json (new — shell:allow-spawn for binaries/jobsmith-sidecar)
            - src-tauri/splash/index.html (new — loading splash, design-token styled)
            - package.json (new — root tauri dev/build scripts)
        - type: wireframe
          title: Boot splash
          fields:
            html: |
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:var(--wf-surface);color:var(--wf-text)">
                <div style="font-size:var(--wf-font-lg);font-weight:600">Jobsmith</div>
                <div style="margin-top:var(--wf-space-md);color:var(--wf-text-muted)">Starting backend…</div>
                <div style="margin-top:var(--wf-space-sm);width:160px;height:4px;background:var(--wf-border);border-radius:2px">
                  <div style="width:40%;height:100%;background:var(--wf-accent);border-radius:2px"></div>
                </div>
                </div>
    - id: slice-3
      num: 3
      title: Sidecar lifecycle + dynamic port/token auth wiring (Rust)
      what: |
        In main.rs: on setup, pick a free ephemeral port (bind :0, read, release),
        generate a random token, spawn the sidecar via `app.shell().sidecar()` with
        `--port <p>` and env `JOBSMITH_API_TOKEN=<tok>`, pipe its stdout/stderr to the
        Tauri log, poll `GET /health` until 200, then navigate the main WebviewWindow
        to `http://127.0.0.1:<port>/`. Jobsmith's existing localhost shim
        (staticui.py:208-216) reads the same token from auth.py and injects
        `window.__JOBSMITH__={token,apiBase}` into index.html before the React app
        boots — satisfying inject-before-load auth with zero new UI code. On
        RunEvent::ExitRequested / window close, kill the child (belt-and-suspenders
        with slice 1's watchdog).
      why: |
        Goal 2 (managed lifecycle) + Goal 3 (Rust-owned port/token handed to the web
        view). Reusing the existing server-side shim is DRY — the token flows
        Rust -> env -> auth.py -> shim -> webview, no second auth mechanism.
      files:
        - src-tauri/src/main.rs
        - src-tauri/src/sidecar.rs
        - src/jobsmith/api/staticui.py
        - src/jobsmith/api/auth.py
      deps:
        - 1
        - 2
      done_when:
        - Launching the app spawns the sidecar on a free port and shows the React UI fully authenticated, with no login prompt and no token in the URL.
        - Two app instances can run concurrently without port collision (ephemeral port per instance).
        - Closing the window terminates the sidecar process within a few seconds (no orphaned Python in `ps`).
      effort: L
      risk: Med
      tests: |
        Integration (Rust): unit-test the free-port picker and the /health poll with a
        stub server. Manual E2E: launch packaged app, confirm UI loads authenticated;
        `ps aux | grep jobsmith-sidecar` empty after quit. Negative: kill the sidecar
        mid-session -> Rust surfaces a clear error rather than a blank window.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://v2.tauri.app/develop/sidecar/
          claim: app.shell().sidecar(name).spawn() returns (rx, child); args and env are passed on the Command — the basis for handing --port and JOBSMITH_API_TOKEN to the sidecar.
          accessed: "2026-06-26"
        - url: https://github.com/dieharders/example-tauri-v2-python-server-sidecar
          claim: Reference for terminating the sidecar on window close so no orphaned server/Python process remains.
          accessed: "2026-06-26"
      questions:
        - id: q-token-transport
          text: How does Rust hand the token to the web view?
          answer: Rust passes the token via JOBSMITH_API_TOKEN env to the sidecar; Python's existing staticui shim injects it into index.html before page load. User chose inject-before-load; reusing the shim avoids a second auth mechanism. (User-confirmed transport; reuse path inferred from architecture map.)
      decisions_notes: |
        **Trigger:** Tauri app setup() spawns the sidecar; RunEvent::ExitRequested kills it.
        **State:** Port + token are per-process, in-memory (Rust), passed by CLI arg + env; no persistence.
        **Payload:** token -> JOBSMITH_API_TOKEN env -> auth.py active token -> existing window.__JOBSMITH__ shim (inject-before-load, user's choice).
        **Rejected:** Token via URL query (?token=) — leaks into history/logs. Tauri invoke() IPC handshake on boot — adds an async boot step and a second auth path when the server-side shim already does it for free. Fixed port 8000 — collides with a user-run `jobsmith up`; ephemeral free port chosen instead.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - src-tauri/src/main.rs (edit — free-port pick, token gen, spawn, health poll, navigate, exit-kill)
            - src-tauri/src/sidecar.rs (new — spawn/manage child, health-poll helper)
            - src/jobsmith/api/staticui.py (reference/verify — existing shim fires for 127.0.0.1 host)
            - src/jobsmith/api/auth.py (reference/verify — JOBSMITH_API_TOKEN honored as active token)
        - type: diagram
          title: Startup + auth handshake
          entries:
            - 'Tauri setup: pick free port + generate token'
            - spawn sidecar (--port, JOBSMITH_API_TOKEN env)
            - 'Python: auth.py adopts token; uvicorn binds 127.0.0.1:port'
            - Rust polls GET /health until 200
            - navigate webview -> http://127.0.0.1:port/
            - staticui shim injects window.__JOBSMITH__ before React boot
            - 'on app exit: kill sidecar child'
    - id: slice-4
      num: 4
      title: Playwright Chromium download-on-first-run with graceful fallback
      what: |
        Add `src/jobsmith/desktop/playwright_bootstrap.py`: resolve a stable
        app-data browsers dir via platformdirs, export PLAYWRIGHT_BROWSERS_PATH to it
        (set in sidecar_main.py BEFORE importing playwright, per the install==runtime
        rule), and expose status + install operations. New desktop API router
        `src/jobsmith/api/routes/desktop.py`: `GET /api/desktop/browser/status`
        (installed?/path), `POST /api/desktop/browser/install` (runs
        `playwright install chromium` in a background task), and an SSE
        `GET /api/desktop/browser/install/events` for progress. A small web/src
        surface prompts the download on first scrape and shows progress. If the
        download fails/offline, the existing httpx fast-path in jd/fetcher.py still
        handles most JDs — surface a clear, retryable error, never a hard crash.
      why: |
        Constraint 2 — Chromium can't ship in the .dmg (size) per the chosen
        download-on-first-run strategy; it must install into a writable app-data dir
        and degrade gracefully when unavailable.
      files:
        - src/jobsmith/desktop/playwright_bootstrap.py
        - src/jobsmith/desktop/sidecar_main.py
        - src/jobsmith/api/routes/desktop.py
        - src/jobsmith/api/main.py
        - src/jobsmith/jd/fetcher.py
        - web/src/api/client.ts
      deps:
        - 1
        - 3
      done_when:
        - On a clean machine, first scrape prompts a one-time Chromium download into the app-data dir and succeeds afterward without re-downloading.
        - PLAYWRIGHT_BROWSERS_PATH is identical at install and runtime so launch finds the installed browser.
        - With networking disabled and no Chromium present, JD fetching still returns results via the httpx fast-path and shows a clear retryable message instead of crashing.
      effort: M
      risk: Med
      tests: |
        Unit: browser/status reports installed:false on empty dir, true after a stub
        browser tree exists. Integration: POST install in a temp PLAYWRIGHT_BROWSERS_PATH
        downloads chromium (network-gated test, skipped offline). Fallback: monkeypatch
        chromium.launch to raise, assert fetcher.py returns the httpx result + a
        structured 'browser_unavailable' signal, not an exception.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://playwright.dev/docs/browsers
          claim: PLAYWRIGHT_BROWSERS_PATH is read at install and at runtime and must match; setting it after importing Playwright has no effect — so it is exported in sidecar_main.py before any playwright import.
          accessed: "2026-06-26"
      questions:
        - id: q-fallback
          text: What happens if the Chromium download fails or the host is offline?
          answer: 'Degrade, don''t crash: jd/fetcher.py already tries an httpx fast-path before Playwright, so JD fetching keeps working for most sites; the UI shows a clear retryable ''browser unavailable'' message. (Inferred from the existing fetcher fallback in the architecture map.)'
      decisions_notes: |
        **Trigger:** First Playwright-requiring scrape; explicit POST /api/desktop/browser/install.
        **State:** Chromium lives under a platformdirs app-data browsers dir; PLAYWRIGHT_BROWSERS_PATH exported before any playwright import.
        **Payload:** status JSON + SSE progress; on failure a structured retryable error.
        **Rejected:** Bundling Chromium in the .dmg — user chose download-on-first-run (smallest bundle). Using system Chrome via channel — fails when no compatible browser exists. Setting PLAYWRIGHT_BROWSERS_PATH after importing playwright — ignored by the driver (read at import).
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - src/jobsmith/desktop/playwright_bootstrap.py (new — platformdirs path, status, install runner)
            - src/jobsmith/desktop/sidecar_main.py (edit — set PLAYWRIGHT_BROWSERS_PATH before playwright import)
            - src/jobsmith/api/routes/desktop.py (new — status/install/events routes)
            - src/jobsmith/api/main.py (edit — include desktop router)
            - src/jobsmith/jd/fetcher.py (edit — graceful 'chromium missing' fallback to httpx path)
            - web/src/ (edit — first-run download prompt + progress UI)
        - type: api-endpoint
          title: Browser status
          fields:
            method: GET
            path: /api/desktop/browser/status
          rows:
            - name: 200 body
              type: '{"installed":bool,"browsers_path":str,"chromium_version":str|null}'
        - type: api-endpoint
          title: Trigger install
          fields:
            method: POST
            path: /api/desktop/browser/install
          rows:
            - name: 202 body
              type: '{"status":"installing"} — progress via SSE /api/desktop/browser/install/events'
        - type: diagram
          title: First-run Chromium flow
          entries:
            - user starts a scrape needing Playwright
            - GET /api/desktop/browser/status -> installed:false
            - UI prompts; POST /api/desktop/browser/install
            - playwright install chromium -> PLAYWRIGHT_BROWSERS_PATH (app data)
            - SSE streams progress -> UI
            - 'on failure/offline: fall back to httpx fast-path + retryable error'
    - id: slice-5
      num: 5
      title: macOS .dmg packaging — ad-hoc-signed build + notarization stub + build script
      what: |
        Add `scripts/build-desktop.sh` orchestrating the full pipeline: npm build (web)
        -> copy to src/jobsmith/web_dist -> build-sidecar.sh -> `tauri build --bundles dmg`.
        Configure tauri.conf.json macOS signing: default to ad-hoc
        (`signingIdentity: "-"`) so the .dmg runs locally without an Apple Developer
        cert (user approves once in Gatekeeper), and document/wire the env-driven
        notarization path (APPLE_SIGNING_IDENTITY + APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID)
        for later distributable builds. Ensure the onedir sidecar `_internal/` ships as
        bundle resources alongside externalBin. Optional `.github/workflows` build job.
      why: |
        Goal 1 (ship a macOS .dmg) + Constraint 1 (self-contained — no node/python at
        runtime). Ad-hoc signing unblocks a working first .dmg without waiting on an
        Apple Developer enrollment; notarization is staged for public distribution.
      files:
        - scripts/build-desktop.sh
        - src-tauri/tauri.conf.json
        - docs/desktop-build.md
        - .github/workflows/desktop-build.yml
      deps:
        - 3
        - 4
      done_when:
        - '`scripts/build-desktop.sh` produces a Jobsmith .dmg that installs and launches the full app on a clean macOS host with no Python or Node installed (Constraint 1).'
        - The ad-hoc-signed app runs after the one-time Gatekeeper approval; no Apple Developer cert is required for the local build.
        - Setting the APPLE_* env vars produces a notarized .dmg via the same script (documented; verified when a cert is available).
      effort: M
      risk: Med
      tests: |
        Manual on a clean macOS VM/user: mount the .dmg, drag to Applications, launch,
        complete a scrape+apply with no host Python/Node. Verify the bundled sidecar +
        _internal/ are present and code-objects are ad-hoc signed (`codesign -dv`).
        Notarization path tested when an Apple Developer ID is provisioned.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://v2.tauri.app/distribute/sign/macos/
          claim: Ad-hoc signing (signingIdentity '-') lets the app run locally without Apple authentication (user whitelists once); notarization uses APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID (or App Store Connect API key) with `tauri build --bundles dmg`.
          accessed: "2026-06-26"
      questions:
        - id: q-signing
          text: Sign + notarize for v1, or ship an ad-hoc-signed local .dmg first?
          answer: Ad-hoc-signed local .dmg first (no Apple Developer cert needed; user approves once), with the env-driven notarization path wired and documented for a later distributable build. (Inferred default to avoid blocking on Apple enrollment; flagged unverified until a cert is available.)
      decisions_notes: |
        **Trigger:** scripts/build-desktop.sh locally or in CI.
        **State:** Output .dmg in src-tauri/target/release/bundle/dmg/ (build artifact).
        **Payload:** A self-contained macOS .dmg embedding the React UI, PyInstaller sidecar (+_internal), and Tauri runtime.
        **Rejected:** Requiring full Developer-ID signing + notarization for v1 — blocks on a paid Apple enrollment; ad-hoc signing ships a runnable .dmg now (Gatekeeper approve-once) with notarization staged. Per-arch universal binary in v1 — target aarch64-apple-darwin first, x86_64 later.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - scripts/build-desktop.sh (new — web build -> web_dist -> sidecar -> tauri build dmg)
            - src-tauri/tauri.conf.json (edit — bundle.macOS signingIdentity, resources for onedir _internal/, dmg config)
            - docs/desktop-build.md (new — local build + notarization env vars)
            - .github/workflows/desktop-build.yml (new, optional — CI .dmg artifact)
        - type: diagram
          title: Packaging pipeline
          fields:
            direction: lr
          entries:
            - npm run build (web)
            - copy -> src/jobsmith/web_dist
            - build-sidecar.sh -> src-tauri/binaries
            - tauri build --bundles dmg (ad-hoc sign)
            - Jobsmith.dmg
questions: []
