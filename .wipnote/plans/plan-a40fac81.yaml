      critic_revisions:
        - source: local-design
          severity: SUCCESS
          summary: Resolved — split from draft; master-data assembly (inputs.py) + bullet-select's real multi-artifact writes made explicit; no-fab halt-and-surface policy added; fit-score reframe (single gemma call) noted.
      decisions_notes: |
