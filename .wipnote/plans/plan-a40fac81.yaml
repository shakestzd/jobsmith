          text: How to distinguish an engine crash from a node parse failure mid-run?
          answer: On a connection-refused / non-JSON transport error, query vllm_mlx.health(); a 'crashed' classification = ENGINE-DOWN (route to on_failure), distinct from a node returning parse_ok=False (model output) or status=halt (no-fab). Honor on_failure (error | fallback_cloud).
      critic_revisions:
        - source: local-design
          severity: SUCCESS
          summary: Resolved — edit seam retargeted to _cli_apply.run_apply (apply.py is a shim); deps now [1..6]; hybrid per-node-routing acceptance test added (gives AnthropicBackend a live caller); backend marker replaces dir-suffix to keep fallback resume sane.
        - source: local-feasibility
          severity: WARN
          summary: 'done_when #1 (real gemma gather->draft) is a manual E2E gate; the ENGINE-DOWN/on_failure/hybrid-routing/passthrough branches are the CI-automatable ones.'
      decisions_notes: |
        **Trigger:** `jobsmith apply` with config.llm.apply.orchestrator=code_local.
        **State:** engine lifecycle bound to the run; artifacts in applications/{slug}/.apply-state/ (a backend marker records which backend wrote the run so a fallback doesn't resume cross-backend); routing in _cli_apply.run_apply.
        **Payload:** a complete local/hybrid gather->draft, or a clear error / cloud fallback.
        **Rejected:** editing apply.py (a deprecation shim — route in _cli_apply); silent fallback (hides local failure); a dir-name suffix for backend isolation (use a marker file — avoids breaking the cloud path's un-suffixed dir); treating connection-refused as a model error (mis-routes the fallback).
      blocks:
