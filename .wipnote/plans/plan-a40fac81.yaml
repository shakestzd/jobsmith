          fields:
            direction: lr
          entries:
            - config orchestrator=code_local + node_backends
            - ensure vllm-mlx healthy (else loading/error)
            - run Pipeline(gather+draft) — per-node Backend (local | cloud)
            - engine crash -> health() down -> on_failure (error | fallback_cloud -> claude -p)
