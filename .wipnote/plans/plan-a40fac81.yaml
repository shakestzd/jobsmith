critique:
    reviewed_at: "2026-06-27"
    reviewers:
        - local-design (design critic; general-purpose agent on Opus 4.8 — read the plan + specialist-contracts.yaml + config.py + apply.py)
        - local-feasibility (feasibility critic; general-purpose agent on Opus 4.8 — verified cited files in-repo + fetched official anthropic/vLLM/advisory docs)
    assumptions:
        - id: A1
          status: verified
          text: Structured JSON from Claude is via a tool with input_schema (tool_use), NOT an OpenAI response_format; the `anthropic` SDK (MIT) is the right dep and is NOT already installed.
          evidence: https://platform.claude.com/docs/en/build-with-claude/tool-use/overview ; pyproject.toml (only claude-agent-sdk + httpx present)
        - id: A2
          status: verified
          text: OpenAICompatClient.complete(messages, response_format=..., temperature=...) returns the content string and accepts a json_schema response_format; the 4-provider LLMProvider enum exists to extend.
          evidence: src/jobsmith/llm/openai_compat.py:169-203 ; src/jobsmith/config.py:22,260-288
        - id: A3
          status: verified
          text: specialist-contracts.yaml declares pipeline.stages and the v1 specialists' reusable .apply-state outputs; bullet-select writes multiple artifacts + anchor logic.
          evidence: src/jobsmith/plugin/agents/apply/specialist-contracts.yaml:136-155,191-208,276-349
        - id: A4
          status: verified
          text: vLLM enforces response_format json_schema server-side; robust-parse stays justified because some servers silently ignore it.
          evidence: https://docs.vllm.ai/en/latest/features/structured_outputs.html ; llm_rescore.py:549-555
        - id: A5
          status: verified
          text: AnthropicBackend coherence resolved — config now carries a node_backends map + an `anthropic` enum value; slice 7 has a hybrid acceptance test giving it a live caller.
          evidence: slices 2/3/7 (revised)
    critics:
        - title: DESIGN CRITIC
          sections:
            - heading: AnthropicBackend coherence (was top blocker — RESOLVED)
              items:
                - badge: per-node routing
                  kind: success
                  text: Resolved — node_backends map + `anthropic` enum value + a hybrid acceptance test (slice 7) give AnthropicBackend live callers.
            - heading: Slice 5 reshape (was blocker — RESOLVED)
              items:
                - badge: split + inputs
                  kind: success
                  text: Split into gather (slice 5) + draft (slice 6); master-data assembly (inputs.py) + bullet-select's multi-artifact writes made explicit; halt-and-surface no-fab policy added; prose-qa modeled as code-side deterministic checks; fit-score reframe noted.
            - heading: Seams + reuse (RESOLVED)
              items:
                - badge: dead shim
                  kind: success
                  text: slice 7 retargeted apply.py -> _cli_apply.run_apply; .apply-state path corrected; backend marker replaces dir-suffix; slice 2 now SHARES llm_rescore robust-parse rather than forking.
        - title: FEASIBILITY CRITIC
          sections:
            - heading: Verified clean
              items:
                - badge: external claims
                  kind: success
                  text: Anthropic tool_use/input_schema, MIT anthropic SDK, vLLM server-side json_schema, gemma-4 serve flags + no-continuous-batching crash, the 4-provider enum, OpenAICompatClient reuse, the specialist DAG/state files, and all 4 research URLs — verified.
            - heading: Findings (addressed)
              items:
                - badge: wrong file
                  kind: success
                  text: slice 8 retargeted to src/jobsmith/api/config.py (config_routes.py does not exist). [FIXED]
                - badge: authoritative flags
                  kind: warn
                  text: vllm-mlx README defaults to --continuous-batching; slice 4 names the spike doc as the authoritative flag source for gemma-4.
                - badge: manual gate
                  kind: warn
                  text: 'slice 7 done_when #1 is a manual E2E gate; ENGINE-DOWN/on_failure/hybrid/passthrough are the CI-automatable branches.'
    risks:
        - risk: A 4B can emit schema-valid but fabricated content; CI proves plumbing (stubs), not model quality.
          severity: Medium
          mitigation: Halt-and-surface no-fab policy (slices 5/6) + shared robust-parse/parse_ok; a manual E2E quality gate; done_when documents that CI proves wiring, not draft quality.
        - risk: prose-write on a 4B may be low quality.
          severity: Medium
          mitigation: Per-node routing — route prose-write to cloud Claude via node_backends while keeping cheap nodes on local gemma (hybrid, slice 7).
        - risk: ~20-30s cold load reads as a hang.
          severity: Low
          mitigation: Slice 4 loading-vs-crashed health; slice 8 docs the wait.
    synthesis: |-
        Both critic passes verified the plan's external and in-repo factual claims clean. The two
        design blockers are now RESOLVED in v2: (1) AnthropicBackend is coherent — config gains a
        node_backends per-node map + an authorized `anthropic` enum value, and slice 7 adds a hybrid
        acceptance test, so the native cloud backend has live callers and delivers the per-node
        promise; (2) the old slice 5 is split into gather (slice 5) + draft (slice 6), with the
        master-data input assembly (inputs.py), bullet-select's real multi-artifact writes, the
        deterministic prose-qa checks, and a v1 halt-and-surface no-fabrication policy all made
        explicit. Wrong edit seams were corrected (api/config.py, _cli_apply.run_apply), the
        applications/{slug}/.apply-state path fixed, a backend marker replaces dir-suffixing, and
        slice 2 now shares the existing BaseScorerBackend robust-parse rather than forking. Remaining
        items are non-blocking warns (manual E2E gates; the upstream-README flag caveat). The plan is
        ready for human review.
