        **State:** the existing applications/{slug}/.apply-state/ artifacts — same contract the cloud path uses, so artifacts are interchangeable; inputs.py reads master YAML read-only.
        **Payload:** validated gather artifacts + a halt signal on a no-fab violation.
        **Rejected:** re-deriving schemas from scratch (reuse specialist-contracts.yaml shapes); hiding master-data assembly (it's the hard part — explicit in inputs.py); single-output bullet-select (it really writes 5 artifacts + anchor logic); fabricating to fill a gap (halt-and-surface instead — no inquirer in v1).
