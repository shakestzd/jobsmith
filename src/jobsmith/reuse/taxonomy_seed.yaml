# Taxonomy seed — canonical skill/requirement tags with synonym aliases.
#
# Format:
#   <tag_key>:
#     description: <human-readable label>
#     aliases:
#       - <lowercase synonym phrase>
#       - ...
#
# Rules for contributors:
#   1. Tag keys must start with "tag:" and use snake_case after the prefix.
#   2. Aliases must be lowercase; canonicalize.py normalizes input to lowercase
#      before lookup, so mixed-case aliases are redundant.
#   3. To add a new tag: append a new entry here — no Python code change needed.
#   4. To add a new synonym to an existing tag: append to the aliases list.
#   5. Keep aliases specific enough to avoid false-positive merges across
#      semantically distinct skills (e.g., "sql" vs "nosql").
#
# Version: 1 (feat-5024375d)

