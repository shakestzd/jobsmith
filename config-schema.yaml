# jobsmith configuration schema
#
# Users place a `.apply-config.yaml` in their application repo.
# This file documents every supported field. Defaults are sensible —
# only override what you need.
#
# All paths are relative to the user's application repo (where /apply
# is invoked from), unless explicitly absolute.

# ----------------------------------------------------------------------------
# master — paths to the user's source-of-truth content YAMLs
# ----------------------------------------------------------------------------
master:
  # Required. The user's master work history.
  work_yml: assets/content/work.yml

  # Required. Master skills.
  skill_yml: assets/content/skill.yml

  # Required. Master education.
  education_yml: assets/content/education.yml

  # Required. Author block (name, contact, links, role tagline).
  author_yml: assets/content/author.yml

  # Optional. Publications (academic papers, public talks).
  publication_yml: assets/content/publication.yml

  # Optional. Awards / recognitions.
  award_yml: assets/content/award.yml

# ----------------------------------------------------------------------------
# output — where /apply writes per-application artifacts
# ----------------------------------------------------------------------------
output:
  # Required. Directory where each application's slug subdirectory is created.
  # Example: private/applications/pwc-ai-engineer/{documents/,index.qmd,...}
  applications_dir: private/applications

  # Optional. Path to the SQLite job-search tracking DB.
  job_search_db: private/job_search.db

# ----------------------------------------------------------------------------
# user — author identity for cover letters and contact blocks
# ----------------------------------------------------------------------------
user:
  # Required. Display name in cover letters and resume header.
  name: "Pat Doe"

  # Required. Email shown on resume + cover letter header.
  email: "pat@example.com"

  # Optional. Phone shown on resume header.
  phone: ""

  # Optional. City and state (or country).
  location: ""

  # Optional. GitHub username (will appear as github.com/{username}).
  github: ""

  # Optional. LinkedIn slug (linkedin.com/in/{slug}).
  linkedin: ""

# ----------------------------------------------------------------------------
# voice — control over how the prose-writer + cover-letter-writer phrase things
# ----------------------------------------------------------------------------
voice:
  # Optional. Path to a markdown file documenting the user's writing voice
  # preferences (banned words, tone notes, examples). The prose-writer reads
  # this for guidance before drafting Professional Summary and rephrased
  # bullets.
  voice_guide_path: null  # e.g., ~/.claude/memory/feedback_writing_voice.md

  # Optional. Banned words/phrases the prose-writer must NOT use.
  # These are checked by the apply-resume-tell-fixer specialist.
  banned_action_verbs:
    - Architected
    - Leveraged
    - Orchestrated
    - Spearheaded
    - "Delivered end-to-end"
    - "Shipped end-to-end"

  banned_buzzwords:
    - enterprise
    - proprietary
    - comprehensive
    - innovative
    - passionate

  banned_marketer_phrases:
    - "perfect fit"
    - "passionate about"
    - "proven track record"

  # Optional. Snippet text used by apply-cover-letter-writer to address an
  # employment gap. If null, no employment-gap text is added to cover letters.
  # If set, the literal text is inserted near the closing paragraph.
  #
  # Example:
  #   employment_gap_snippet: |
  #     I took a planned career break in 2025 to focus on family and
  #     credentialing. That's now resolved and I'm fully available.
  employment_gap_snippet: null

# ----------------------------------------------------------------------------
# anchor_thresholds — what counts as a "load-bearing" bullet
# ----------------------------------------------------------------------------
# Bullets containing any of these markers are preserved across applications
# unless an explicit reason to drop is logged. The anchor-bullet-guard runs
# after apply-bullet-selector to enforce this.
anchor_thresholds:
  money_min_usd: 10_000_000      # $10M
  percent_min: 50.0              # 50%
  asset_count_min: 100_000       # 100K assets / users / records / etc.

# ----------------------------------------------------------------------------
# cover_letter — letter-specific tuning
# ----------------------------------------------------------------------------
cover_letter:
  # Required if you want cover letters generated. Set to "none" to skip.
  framework: careerfair-io  # careerfair-io | minimal | none

  # Word count targets per role-type. The cover-letter-writer chooses the
  # closest match to the parsed jd.role_type.
  word_targets:
    senior_strategic: 150
    ai_engineer: 150
    data_engineer: 150
    data_analyst: 130
    ic_portal: 120
    finance: 150
    renewable_energy: 150
    general: 130

  # Salutation when no hiring manager is detected. The hm-enricher writes a
  # sentinel file when it can't find a named HM; cover-letter-writer falls
  # back to this.
  default_salutation: "Hello,"

# ----------------------------------------------------------------------------
# resume — render-specific tuning
# ----------------------------------------------------------------------------
resume:
  # Path to the Quarto resume template (relative to jobsmith plugin root,
  # OR the user can override with their own template).
  template: templates/resume/resume-template.typ

  # Page-count enforcement. The renderer halts if the rendered PDF exceeds
  # max_pages and the visual-layout-reviewer can't trim within iteration_limit
  # iterations.
  max_pages: 1
  layout_iteration_limit: 2

# ----------------------------------------------------------------------------
# fit_scorer — fit thresholds and tier assignment
# ----------------------------------------------------------------------------
fit_scorer:
  # When fit-score >= fast_threshold, run the fast pipeline path (Tier 1 only).
  # When fit-score < fast_threshold, run the deep pipeline path.
  # Phase 1 of jobsmith treats fast and deep identically — slice 9 of the
  # original /apply spec is deferred.
  fast_threshold: 0.70

  # Optional. Path to user's profile YAML for fit-scorer's evidence comparison.
  # Created via `jobsmith init` based on master YAML content + manual notes.
  profile_yaml: private/capacity/profile.yaml

# ----------------------------------------------------------------------------
# portfolio — required signals for ai-engineer / data-engineer / data-analyst roles
# ----------------------------------------------------------------------------
portfolio:
  # When the parsed role_type is one of these, the apply-portfolio-ats-checker
  # treats the live-URL + GitHub-link checks as BLOCKING.
  blocking_for_role_types:
    - ai-engineer
    - data-engineer
    - data-analyst

  # When NOT in the blocking list, the portfolio check is advisory only.

# ----------------------------------------------------------------------------
# benchmarks — personal style-reference files used by quality checks
# ----------------------------------------------------------------------------
# These paths point to a "gold standard" application the user is proud of.
# Specialists compare new output against these files to assess style and
# quality consistency.  All paths are relative to the repo root.
#
# When a field is omitted (null), jobsmith falls back to the generic
# "Pat Doe" example files shipped inside the plugin so quality checks can
# always run — even on a fresh install.  The fallback is style guidance only;
# it never copies Pat Doe content into your application.
#
# Populate private/benchmarks/ with your own files (symlinks work well) and
# point the fields below at them.  Run `jobsmith doctor` to verify resolution.
benchmarks:
  # Path to your best previous resume (rendered PDF, for visual reference).
  resume_pdf: null            # e.g., private/benchmarks/resume.pdf

  # Path to your best previous resume source (Quarto .qmd, for structure reference).
  resume_qmd: null            # e.g., private/benchmarks/resume.qmd

  # Path to your best previous cover letter (markdown source).
  cover_letter_md: null       # e.g., private/benchmarks/cover-letter.md

  # Optional. PDF render of the cover letter above.
  cover_letter_pdf: null      # e.g., private/benchmarks/cover-letter.pdf

  # Optional. Workflow HTML snapshot (rendered index.qmd) you liked.
  workflow_html: null         # e.g., private/benchmarks/workflow.html

  # When false (default): missing user benchmarks fall back to Pat Doe silently.
  # When true: missing user benchmarks are a hard FAIL in `jobsmith doctor`.
  required: false

# ----------------------------------------------------------------------------
# llm — LLM backend for chat and scoring pipelines
# ----------------------------------------------------------------------------
# Controls which AI backend jobsmith uses for its chat and fit-scoring calls.
# Omitting this section (the default) keeps all existing behaviour unchanged:
# the pipeline routes through the Claude CLI subprocess exactly as before.
#
# Provider enum (5 values — feat-c7fab5c0 added `anthropic`):
#   claude_cli         — Claude Code CLI subprocess (default, backward-compat)
#   antigravity_cli    — Antigravity `agy` CLI subprocess
#   codex_cli          — OpenAI Codex CLI subprocess
#   openai_compatible  — Single unified OpenAI-compatible HTTP endpoint
#                        (covers MLX via mlx_lm.server and Ollama).
#                        REQUIRES base_url.
#   anthropic          — Direct Anthropic API (no CLI subprocess).
#                        REQUIRES api_key.
#
# Quick presets for openai_compatible:
#   MLX  (mlx_lm.server): base_url: http://127.0.0.1:8080/v1
#   Ollama:               base_url: http://localhost:11434/v1
llm:
  # One of: claude_cli | antigravity_cli | codex_cli | openai_compatible | anthropic
  provider: claude_cli

  # Optional. Model identifier passed to the provider.
  # For openai_compatible this is the model name the server expects (e.g. "llama3.2").
  model: null

  # Required when provider == openai_compatible; ignored for CLI providers.
  # Example values:
  #   http://127.0.0.1:8080/v1   ← MLX (mlx_lm.server)
  #   http://localhost:11434/v1  ← Ollama
  base_url: null

  # Required when provider == anthropic. Ignored for all other providers.
  # Optional for openai_compatible (many local servers do not check it).
  api_key: null

  # Per-request spend ceiling in USD (advisory — not enforced by all providers).
  budget_usd: 1.0

  # Request timeout in seconds. Increase for large local models.
  timeout_s: 300

  # --------------------------------------------------------------------------
  # llm.apply — orchestrator selector + per-node backend routing
  # --------------------------------------------------------------------------
  # Controls which apply pipeline path is used and how each DAG node is routed
  # to an LLM backend. Omitting this block leaves all existing behaviour
  # unchanged (orchestrator defaults to claude_cloud).
  #
  # orchestrator enum:
  #   claude_cloud  — (DEFAULT) existing cloud `claude -p` path; byte-identical
  #                   when this block is absent. No call-site changes.
  #   code_local    — Python DAG runner executes the apply pipeline locally,
  #                   routing each node to its configured backend.
  #
  # on_failure enum (code_local only):
  #   error         — (DEFAULT) fail hard when a node raises.
  #   fallback_cloud — retry the failed node via the cloud claude_cloud path.
  #
  # Node backend resolution (highest priority first):
  #   1. node_backends[node_name]  — explicit per-node override.
  #   2. node_backend              — default backend for all nodes.
  #   3. Parent llm.provider       — falls back when neither is set.
  apply:
    # One of: claude_cloud | code_local
    orchestrator: claude_cloud

    # One of: error | fallback_cloud
    on_failure: error

    # Default backend applied to every DAG node that lacks an explicit override.
    # Uses the same fields as llm (provider, model, base_url, api_key).
    # Omit to inherit the parent llm.provider for all nodes.
    node_backend: null
    # Example (local MLX for all nodes):
    # node_backend:
    #   provider: openai_compatible
    #   base_url: http://127.0.0.1:8080/v1
    #   model: mlx-community/gemma-3-4b-it-qat-4bit

    # Per-node backend overrides. Keys are DAG node names (e.g. prose-write).
    # A node present here uses its specific backend regardless of node_backend.
    node_backends: {}
    # Example (hybrid run — cloud Anthropic for prose-write, local for the rest):
    # node_backends:
    #   prose-write:
    #     provider: anthropic
    #     api_key: sk-ant-...
    #     model: claude-3-5-haiku-20241022
