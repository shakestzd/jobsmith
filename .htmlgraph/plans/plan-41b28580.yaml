      title: Ingest pipeline + dedup + cross-source merge
      what: |
        Wire it all together. The end-to-end ingest service.

        `src/jobsmith/sources/ingest.py`:
        - `IngestService(db, gmail_client, parsers)` —
          - `poll(since: datetime | None) -> IngestResult` — list Gmail messages
            newer than cursor, fetch raw, build envelope, dispatch parser,
            upsert candidates + sightings, persist new cursor.
          - Cursor stored in `private/jobsmith.db` table `ingest_cursors(source TEXT, last_envelope_id TEXT, last_received_at TEXT)`.
        - Dedup logic:
          - If sighting's `(source, external_id)` already exists → no-op (idempotent re-run)
          - Else check `dedup_key`: if match → INSERT sighting onto existing candidate; merge metadata (max of match_scores, union of badges, latest description_snippet)
          - Else INSERT new candidate + sighting
        - Cross-source merge: when LinkedIn ID `4398755649` (PwC ERP AI Engineer)
          and JobRight hex `69abcd...` resolve to the same `(company, title, location)`
          normalized tuple, they share one `job_candidates` row with two `email_sightings` rows.

