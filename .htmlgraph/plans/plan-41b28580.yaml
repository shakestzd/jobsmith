        Unit: TestGreenhouse_PollAndParse — httpx mock returns JSON board response, candidates parsed.
        Unit: TestLever_PollAndParse — same for Lever JSON.
        Unit: TestATS_ExpireRemoved — first poll persists 5 candidates; second poll returns 4; the missing one's status flips to 'expired'.
        Regression: existing ingest tests pass; cursor handling unaffected by new source.
      approved: false
      comment: ""
      approval_status: pending
      execution_status: not_started
questions:
    - id: q-email-source
      text: Which email-access path for the source layer?
      description: |
        Validation pass showed Gmail MCP cannot return HTML bodies (JobRight is HTML-only); Apple Mail / AppleScript is macOS-only. Three viable cross- platform options: - Direct Gmail API with OAuth refresh-token: returns full MIME, runs
          headless, supports Pub/Sub push for instant alerts. One-time browser
          login.
        - IMAP: any provider works, simpler auth (app password). Lacks push. - Hybrid: MCP for what it can do (LinkedIn plaintext) + Gmail API for
          what it can't (JobRight HTML). Two code paths.
      recommended: option-gmail-api
      options:
        - key: option-gmail-api
          label: Direct Gmail API + OAuth refresh-token (Recommended — single code path, push-capable, headless)
        - key: option-imap
          label: IMAP — universal, simpler auth, no push
        - key: option-hybrid
          label: 'Hybrid: MCP where possible + Gmail API where MCP fails'
      answer: option-gmail-api
    - id: q-prescore-cost
      text: Prescore on ingest or on triage open?
      description: |
        Each prescore = one LLM call (~$0.001 with Haiku). At 25 candidates/day that's $0.75/month — affordable but not free. Three options: - On ingest, with daily budget cap (Recommended) - Lazy on triage list view (cheapest, but list sort by prescore can't
          work for un-prescored candidates)
        - Both — try on ingest, lazy fallback when over budget
      recommended: option-ingest-with-cap
      options:
        - key: option-ingest-with-cap
          label: On ingest + JOBSMITH_PRESCORE_DAILY_BUDGET cap (default 50). Over-budget = lazy. (Recommended)
        - key: option-lazy-only
          label: Lazy only on triage list — cheapest; list ordering for un-prescored candidates falls back to (match_score, posted_at)
        - key: option-both-no-cap
          label: Both, no cap — every candidate prescored eagerly; budget is the user's monthly LLM bill
      answer: option-ingest-with-cap
    - id: q-cross-source-merge
      text: Same job sighted across multiple sources — merge or keep separate?
      description: |
        LinkedIn job 4398755649 (PwC ERP AI Engineer) and JobRight hex 69abc... can resolve to the same dedup_key. Two approaches: - Merge: one candidate row, multiple email_sightings rows (Recommended).
          User makes ONE triage decision; provenance preserved on sightings.
        - Keep separate: two candidate rows; user triages twice. Simpler dedup
          logic; less work on edge cases (e.g., LinkedIn says NYC, JobRight says
          Manhattan — different normalized locations → not merged).
      recommended: option-merge
      options:
        - key: option-merge
          label: Merge into one candidate; preserve sightings array (Recommended — one triage decision per job)
        - key: option-separate
          label: Keep separate — simpler dedup, but user triages duplicates
      answer: option-merge
    - id: q-parser-versioning
      text: When a parser changes, how do we handle historical envelopes?
      description: |
        Parsers will be revised when LinkedIn / JobRight change their email templates. Three options for how to handle previously-ingested data: - Forward-only: old data stays parsed by old version; new envelopes use
          new version. (Recommended — simple, audit trail in parser_version
          column.)
        - Replay-on-bump: every parser_version bump triggers re-parse of all
          envelopes by that parser. (Slower, more LLM calls.)
        - Replay-on-demand: forward-only by default; explicit
          `jobsmith candidates replay --parser <name> --since <date>` for
          intentional re-parse.
      recommended: option-replay-on-demand
      options:
        - key: option-forward-only
          label: Forward-only — historical data stays as-is
        - key: option-replay-on-bump
          label: Auto-replay on every parser_version bump
        - key: option-replay-on-demand
          label: Forward-only default + explicit `replay` command (Recommended — intentional, auditable)
      answer: option-replay-on-demand
    - id: q-poll-cadence
      text: How often does ingest run?
      description: |
        Three options: - Cron (every 15-30 min): simple, predictable; instant alerts may lag up
          to 30 min.
        - Manual only (jobsmith sources poll): user-driven; zero background process. - Pub/Sub push (Gmail watches messages → webhook): instant, but requires
          public webhook endpoint or local tunneling — friction in single-user
          local mode.
      recommended: option-cron-15min
      options:
        - key: option-cron-15min
          label: Cron every 15 min + manual `jobsmith sources poll` (Recommended — predictable, no public endpoint)
        - key: option-manual-only
          label: Manual only — user runs `jobsmith sources poll` when they want
        - key: option-pubsub
          label: Gmail Pub/Sub push — instant, but needs a webhook endpoint
      answer: option-cron-15min
    - id: q-helper-package-boundary
      text: Are sources/helpers/* part of jobsmith or extracted as a separate package?
      description: |
        The helpers (parse_salary, normalize_location, etc.) are reusable beyond jobsmith — any tool that ingests job listings could use them. Two options: - Stay in-tree: `src/jobsmith/sources/helpers/`. Simplest. (Recommended for now.) - Extract to standalone package `jobalerts-helpers` on PyPI: enables
          third-party reuse and external community parsers, but adds release/
          maintenance burden.
      recommended: option-in-tree
      options:
        - key: option-in-tree
          label: Stay in-tree under src/jobsmith/sources/helpers/ (Recommended — defer extraction until 0.10+ when there's external demand)
        - key: option-standalone-package
          label: Extract to a standalone PyPI package — enables third-party parsers
      answer: option-in-tree
