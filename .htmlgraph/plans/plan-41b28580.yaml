    - id: slice-11
      num: 11
      title: Triage rules YAML + linter + dry-run
      what: |
        Make `private/triage-rules.yaml` a first-class artifact with a schema,
        linter, and a way to dry-run rules against existing candidates.

        Schema (Pydantic, validated on load):
        ```yaml
        version: 1
        blocks:
          - id: block-1
            kind: company_exact          # company_exact | company_keyword | title_regex | title_keyword | location_keyword | salary_min
            value: "Acme Co"
            reason: "anti-employee record"
            added_at: "2026-05-04T18:30:00Z"
            added_via: "jobsmith candidates dismiss --block-company"
          # ...
        boosts:                          # optional — boost prescore by additive delta
          - id: boost-1
            kind: company_keyword
            value: "climate"
            delta: 0.15
            reason: "career focus"
        ```

        Subcommands:
        - `jobsmith rules check` — validate YAML against schema; print parse errors.
        - `jobsmith rules dry-run` — apply rules to ALL existing candidates; show
          what WOULD change without writing anything. Useful when adding a rule:
          verify it doesn't auto-dismiss valid candidates retroactively.
        - `jobsmith rules apply` — actually re-evaluate rules and update
          triage_status for any new matches. Generates audit log of changes.
        - `jobsmith rules suggest` — analyze recent dismissal patterns (slice 12);
          suggest new rules.

        Backward compat: a missing rules file is treated as "no rules" — no error.
      why: |
        Rules accumulate. Without a linter and dry-run, a new rule can silently
        auto-dismiss legitimate candidates and the user never sees them. Dry-run
        makes rule edits reversible by preview.
