        - '`jobsmith sources poll` polls both Gmail and configured RSS feeds'
        - HN comment ingestion produces candidates with low_structured flag
        - Cursor-per-feed prevents duplicate ingestion
        - feeds.example.yaml documents the format
      effort: L
      risk: Med
      tests: |
        Unit: TestRSS_HNExtract — synthetic comment text, parser yields candidate via JD specialist.
        Integration: TestRSS_PollAndPersist — mock feed, ingest, candidates in DB.
        Regression: Gmail polling still works after this slice.
      approved: false
      comment: ""
      approval_status: pending
      execution_status: not_started
    - id: slice-17
      num: 17
      title: ATS scraper source (Greenhouse + Lever public boards)
      what: |
        Direct scraping for target companies the user identifies. Many
        Greenhouse and Lever boards expose stable JSON or HTML endpoints
        without auth — better signal than waiting for the company to send an
        alert through LinkedIn.

        `src/jobsmith/sources/ats_source.py`:
        - `class GreenhouseSource:` —
          - Polls `https://boards-api.greenhouse.io/v1/boards/<token>/jobs?content=true`
            (returns JSON with title, location, content, updated_at).
          - One Envelope per posting.
        - `class LeverSource:` —
          - Polls `https://api.lever.co/v0/postings/<company>?mode=json`.
          - Same Envelope shape.

        `src/jobsmith/sources/parsers/greenhouse.py` and `lever.py`:
        - Structured JSON parsers; trivial mapping → JobCandidate.

        `private/ats-targets.yaml`:
        ```yaml
        greenhouse:
          - { company: "Anthropic", token: "anthropic" }
          - { company: "Sunnova", token: "sunnova" }
        lever:
          - { company: "Some Climate Co", company_slug: "someclimate" }
        ```

        Wire into IngestService — same `jobsmith sources poll` runs all sources.
      why: |
        Strongest signal source: target-list-driven, no email middleman, no
        LinkedIn keyword matching. The user names the companies they care about,
        jobsmith polls their boards directly. Closes the gap that "passive
        inbox firehose" leaves: roles the user would ONLY find by manually
        visiting target company career pages.
      files:
        - src/jobsmith/sources/ats_source.py
        - src/jobsmith/sources/parsers/greenhouse.py
        - src/jobsmith/sources/parsers/lever.py
        - src/jobsmith/sources/parsers/__init__.py
