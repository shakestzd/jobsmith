        - On redirect failure, candidate URL falls back to SendGrid URL with low_confidence_url=True
        - Sender pattern dispatches alerts@climatebase.org to this parser (not other parsers)
        - private/triage-rules.example.yaml documents the source_exact boost rule
      effort: M
      risk: Med
