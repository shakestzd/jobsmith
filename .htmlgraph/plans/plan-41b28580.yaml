    - id: slice-16
      num: 16
      title: RSS source adapter (HN 'Who is hiring' + climate-tech newsletters)
      what: |
        Extend beyond email. Adds a new SOURCE type — RSS feeds — that produce
        Envelope objects the existing parser registry can route.

        Note: Climatebase is handled as a first-class email source in slice 7
        (HTML-only digest emails with SendGrid-wrapped URLs). Climatebase does not
        have a structured RSS feed suitable for this adapter; use slice 7's
        `climatebase_email` parser for all Climatebase job ingestion.

        `src/jobsmith/sources/rss_source.py`:
        - `class RSSSource:` —
          - `__init__(feeds: dict[str, str])` — name → URL.
          - `poll(since: datetime | None) -> Iterable[Envelope]` — uses `feedparser`
            to fetch each feed, build Envelope per entry.
        - Feeds:
          - HN "Who is hiring" thread RSS
            (`https://hnrss.org/newcomments?q=who+is+hiring`)
          - Climate Drift Substack RSS (climate-tech newsletter with job postings)
          - Work on Climate job board RSS (if RSS available)
          - Additional feeds listed in feeds.yaml.

        `src/jobsmith/sources/parsers/hn_who_is_hiring.py`:
        - Loose-text parser — HN comments are unstructured. Strategy:
          - Use the existing apply pipeline's JD-parser specialist on the comment
            body to extract title + company + remote/location + URL (if present)
          - Cache extraction on `email_sightings.raw_card_text` (same column reused)
        - Confidence flag `low_structured`.

        Add `feedparser>=6.0` to `[api]` deps. Wire into IngestService so a
        `jobsmith sources poll` polls Gmail AND RSS in one call.
      why: |
        The user is climate-focused (per LinkedIn footer audit). HN "Who is hiring"
        and climate-tech newsletters surface roles that don't appear on LinkedIn /
        JobRight. Without this slice, the sourcing pipeline misses a meaningful
        corner of the user's target market. Climatebase specifically is covered by
        the email parser in slice 7 (which handles the actual job digest emails).
      files:
        - src/jobsmith/sources/rss_source.py
        - src/jobsmith/sources/parsers/hn_who_is_hiring.py
        - src/jobsmith/sources/parsers/__init__.py
        - src/jobsmith/sources/ingest.py
