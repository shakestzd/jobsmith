meta:
    id: plan-41b28580
    track_id: trk-299ae137
    title: 0.9 Job sourcing pipeline — Gmail-API + extensible parsers
    description: |
        Inbox-as-firehose: poll Gmail via direct API (cross-platform — no AppleScript / no MCP), route messages through a parser registry, normalize into a single JobCandidate type with provenance, dedup across sources, prescore against master, surface in CLI + web triage. Layered architecture: Source → Envelope → Parser → JobCandidate. Per-platform parsers reuse shared helpers (salary, time, location, URL canonicalization, dedup keys). Adding a new platform = one parser file + golden fixtures. MVP covers LinkedIn + JobRight; Indeed and Glassdoor land as later slices to prove the abstraction; RSS and ATS-scraper sources extend beyond email. Climatebase is treated as a first-class email source (slice 7) given the user's climate-sector career focus.
    created_at: "2026-05-04"
    status: finalized
    created_by: claude-opus
    version: 5
design:
    problem: |
        Job sourcing today is manual: the user reads two inboxes (LinkedIn alerts + JobRight digests) for ~25 unique candidates per day after dedup, copies a URL into `jobsmith apply`, and discards the rest. There's no persisted candidate store, no cross-source merge (same job from LinkedIn and JobRight creates two manual lookups), no prescoring against master, no triage rules (block companies / titles / keywords), no feedback loop from dismissals back to master.yaml. Validation pass already confirmed: LinkedIn canonical job URLs (`/jobs/view/<id>/`) and JobRight URLs (`jobright.ai/jobs/info/<hex>`) are publicly fetchable; LinkedIn emails have plaintext alternatives, JobRight emails are HTML-only (Gmail MCP surfaces neither HTML nor raw, hence the direct Gmail API decision). Inbox audit additionally surfaces alerts@climatebase.org ships HTML-only digests every 2-3 days with SendGrid-wrapped URLs — currently dropped silently because no parser exists.
    goals:
        - '**Inbox → store** — Gmail messages from any registered job platform land in `job_candidates` automatically; user only triages, never copies URLs'
        - '**Cross-platform** — runs on macOS / Linux / Windows / Docker / cron; no AppleScript, no Mail.app, no Claude session required'
        - '**Extensible** — adding Indeed / Glassdoor / Wellfound is one parser file plus golden fixtures; the dispatcher and helpers do not change'
        - '**Dedup-first** — same job sighted across multiple sources merges into one candidate row with provenance preserved; user makes one triage decision'
        - '**Prescored top-N** — candidates ranked by reuse of `apply-fit-scorer` against master so the user only reviews the top 10 per day, not 25'
        - '**Closed-loop triage** — dismissals (by company, title pattern, keyword) become master.yaml exclusion suggestions reviewed by the user'
        - '**Halt over fabricate inherited** — no auto-apply; triage = saved / dismissed / queued for /apply pipeline'
        - '**Climate-sector source coverage** — Climatebase emails ingested first-class with a SendGrid-redirect resolver that doubles as a reusable helper for any tracker-wrapping email source.'
    constraints:
        - 'Cross-platform: do NOT depend on AppleScript / Mail.app / IMAP single-vendor / MCP runtime. Direct Gmail API + OAuth refresh-token flow only.'
        - 'Per-source PARSERS are pure functions: input = parsed `email.message.Message` envelope, output = `ParseResult(candidates, alert_metadata, warnings)`. No side effects, no I/O.'
        - Shared HELPERS in `src/jobsmith/sources/helpers/` are the reusable core. Parsers compose helpers; parsers do not duplicate parsing logic.
        - Master YAMLs stay read-only. The triage feedback loop SUGGESTS additions to a separate `private/triage-rules.yaml`; it never writes assets/content/*.yml.
        - Inherits 0.6 spike Option C (skip PocketBase). All persistence in the existing `private/jobsmith.db` SQLite.
        - 'Dedup is two-stage: source-specific external_id (when present), then `(normalized_company, normalized_title, normalized_location)` SHA1 fallback for cross-source merge.'
        - 'Out of scope: auto-applying, sourcing from Twitter/LinkedIn DMs, auto-master-edits, multi-user concurrency, hosted/SaaS.'
    approved: false
    comment: ""
slices:
    - id: slice-1
      feature_id: feat-fdd6280c
      num: 1
      title: Schema — job_candidates + email_sightings + triage_decisions + triage_rules
      what: |
        Add three tables + Pydantic models + a numbered SQL migration. All in
        `private/jobsmith.db` (the existing 0.8 SQLite).

        Migration: `src/jobsmith/migrations/00X_job_candidates.sql` (verify next
        number — current highest is `008_llm_cache.sql`, so 009 is next).
        Update `src/jobsmith/db.py:_PIPELINE_MIGRATIONS` (hardcoded list — adding a
        file alone is silently ignored, see 0.8 plan slice 4).

        Tables:
        ```
        job_candidates (
          id INTEGER PRIMARY KEY,
          dedup_key TEXT NOT NULL UNIQUE,        -- SHA1(normalized_company, normalized_title, normalized_location)
          title TEXT NOT NULL,
          company TEXT NOT NULL,
          company_normalized TEXT NOT NULL,
          location TEXT,
          url TEXT NOT NULL,                      -- canonical, tracking-stripped
          description_snippet TEXT,
          salary_min INT, salary_max INT,
          salary_currency TEXT DEFAULT 'USD',
          salary_period TEXT DEFAULT 'yr',        -- 'yr' | 'mo' | 'hr'
          match_score REAL,                       -- aggregated max across sightings
          prescore REAL,                          -- jobsmith-side, populated by slice 8
          prescore_at TEXT,
          posted_at TEXT,
          discovered_at TEXT NOT NULL,
          triage_status TEXT DEFAULT 'new',       -- new | saved | dismissed | queued | applied
          triage_decided_at TEXT,
          triage_reason TEXT
        )
        CREATE INDEX idx_job_candidates_dedup ON job_candidates(dedup_key);
        CREATE INDEX idx_job_candidates_status ON job_candidates(triage_status);

        email_sightings (
          id INTEGER PRIMARY KEY,
          candidate_id INTEGER NOT NULL REFERENCES job_candidates(id) ON DELETE CASCADE,
          source TEXT NOT NULL,                   -- 'linkedin', 'jobright', 'indeed', ...
          external_id TEXT,                       -- platform-specific job ID
          envelope_id TEXT NOT NULL,              -- Gmail message id / RSS entry id
          envelope_received_at TEXT NOT NULL,
          match_score REAL,                       -- per-source (e.g., JobRight 0.93)
          parser_name TEXT NOT NULL,
          parser_version TEXT NOT NULL,
          raw_card_text TEXT                      -- the raw extracted card for replay
        )
        CREATE INDEX idx_sightings_candidate ON email_sightings(candidate_id);
        CREATE UNIQUE INDEX idx_sightings_envelope ON email_sightings(envelope_id, source, external_id);

        triage_decisions (
          id INTEGER PRIMARY KEY,
          candidate_id INTEGER NOT NULL REFERENCES job_candidates(id) ON DELETE CASCADE,
          decision TEXT NOT NULL,                 -- save | dismiss | queue | apply
          reason TEXT,
          decided_at TEXT NOT NULL,
          rule_matched TEXT                       -- triage-rule id if auto-decision
        )
        ```

        `private/triage-rules.yaml` (NEW, gitignored):
        ```yaml
        blocks:
          - { kind: company_exact, value: "Some Bad Co", reason: "anti-employee" }
          - { kind: title_regex, value: "(?i)senior manager", reason: "not IC" }
          - { kind: company_keyword, value: "consulting", reason: "out of scope" }
        ```

        Pydantic models in `src/jobsmith/sources/models.py` mirror the tables.
      why: |
        Foundation. Every later slice writes to or reads from these tables. The
        triage_rules YAML lives separately because it's user-editable and
        unstructured (regex patterns); keeping it out of the DB makes the
        feedback loop reviewable in git.
      files:
        - src/jobsmith/migrations/009_job_candidates.sql
        - src/jobsmith/db.py
        - src/jobsmith/sources/__init__.py
        - src/jobsmith/sources/models.py
        - tests/test_sources_schema.py
      deps: []
      done_when:
        - Migration applies cleanly to a fresh DB and is idempotent on re-run
        - _PIPELINE_MIGRATIONS in db.py includes the new migration filename
        - Three tables exist with the columns + indexes shown
        - Pydantic models round-trip a canonical JobCandidate / EmailSighting / TriageDecision
        - tests/test_sources_schema.py covers the migration + each model
      effort: M
      risk: Low
      tests: |
        Unit: TestMigration_Apply — fresh DB, run migration, assert tables/indexes.
        Unit: TestMigration_Idempotent — apply twice, no error.
        Unit: TestModels_Roundtrip — populate, dict()->dump->load, equality.
        Regression: existing 008 migration tests pass; existing _PIPELINE_MIGRATIONS callers don't break.
      approved: false
      comment: ""
      approval_status: pending
      execution_status: promoted
    - id: slice-2
      num: 2
      title: Gmail API OAuth client — cross-platform, headless
      what: |
        Direct Gmail API client (NOT MCP, NOT AppleScript) so the pipeline runs on
        Linux / Windows / macOS / Docker / cron without a Claude session.

        `src/jobsmith/sources/gmail_client.py`:
        - `GmailClient(credentials_path: Path = Path('private/gmail-credentials.json'),
          token_path: Path = Path('private/gmail-token.json'))` — wraps
          `google-api-python-client` + `google-auth-oauthlib`.
        - `authorize()` — first-run browser OAuth flow; persists refresh token to
          `private/gmail-token.json` mode 0600. Auto-refresh on subsequent runs.
        - `list_messages(query: str, since: datetime | None = None) -> Iterable[GmailMessageRef]`
          — wraps `users.messages.list` with paging.
        - `get_message_raw(message_id: str) -> bytes` — calls
          `users.messages.get(format='raw')`, base64url-decodes the result, returns
          RFC822 bytes parseable by `email.message_from_bytes`.
        - `get_envelope(message_id: str) -> Envelope` — convenience: fetch raw +
          parse + wrap as Envelope (slice 3 defines Envelope).

        `jobsmith sources auth` typer subcommand triggers `authorize()`.

        Add deps to `[api]` optional group: `google-api-python-client>=2.130`,
        `google-auth-oauthlib>=1.2`, `google-auth-httplib2>=0.2`.

        Scope: `https://www.googleapis.com/auth/gmail.readonly` (read-only —
        writes are unnecessary for ingest).

        Hard-fail at startup if `private/gmail-credentials.json` is missing with a
        clear message linking to Google Cloud Console setup steps in
        `docs/sources/gmail-setup.md` (this slice ships the doc too).
      why: |
        The MCP cannot return HTML bodies (validated empirically — see
        `meta.description`). Apple Mail / AppleScript is macOS-only.
        `q-email-source` was answered `option-gmail-api` because it's the only
        cross-platform path that handles both LinkedIn (plaintext-multipart) and
        JobRight (HTML-only). Token-store + auto-refresh means a one-time
        browser login, then headless forever.
      files:
        - src/jobsmith/sources/gmail_client.py
        - src/jobsmith/sources/__init__.py
        - src/jobsmith/cli.py
        - pyproject.toml
        - docs/sources/gmail-setup.md
        - tests/test_sources_gmail_client.py
      deps: []
      done_when:
        - '`uv pip install -e ''.[api]''` resolves the new google-* deps'
        - '`jobsmith sources auth` runs OAuth flow and persists token at private/gmail-token.json mode 0600'
        - '`get_message_raw` returns RFC822 bytes parseable by stdlib email module'
        - Refresh-token auto-refresh works without browser interaction on second run
        - docs/sources/gmail-setup.md walks through Google Cloud Console OAuth client creation
        - Hard-fail at startup with clear message if private/gmail-credentials.json missing (not per-call 401)
      effort: M
      risk: Med
      tests: |
        Unit: TestGmailClient_GetMessageRaw — httplib mock returns base64url-encoded RFC822, assert decoded bytes.
        Unit: TestGmailClient_AutoRefresh — mock 401 + refresh-token flow, assert token refreshed.
        Unit: TestGmailClient_NoCredentials — missing file, RuntimeError at startup.
        Integration (marked @pytest.mark.requires_gmail): live OAuth flow — skipped in CI.
        Regression: existing `[api]` deps + tests still pass.
      approved: false
      comment: ""
      approval_status: pending
      execution_status: not_started
    - id: slice-3
      num: 3
      title: Parser protocol + shared helpers (the reusable core)
      what: |
        The foundational abstraction. Adding a new platform later (Indeed, Glassdoor)
        is mechanical because of this slice.

        `src/jobsmith/sources/protocol.py`:
        ```python
        @dataclass
        class Envelope:
            envelope_id: str           # Gmail message id (or RSS entry id later)
            source_kind: Literal['email', 'rss', 'http']
            received_at: datetime
            headers: dict[str, str]    # Subject, From, Date, ...
            plaintext_body: str | None
            html_body: str | None
            raw_bytes: bytes | None

        @dataclass
        class ParseResult:
            candidates: list[JobCandidate]
            alert_metadata: AlertMetadata   # search keyword, alert kind (digest/instant)
            parser_warnings: list[str]      # for golden-test regression detection

        class JobAlertParser(Protocol):
            name: str                       # 'linkedin', 'jobright', ...
            parser_version: str
            sender_patterns: list[re.Pattern]
            subject_patterns: list[re.Pattern]   # optional secondary check

            def matches(self, env: Envelope) -> bool: ...
            def parse(self, env: Envelope) -> ParseResult: ...

        def register_parser(parser: type[JobAlertParser]) -> None: ...
        def parse_envelope(env: Envelope) -> ParseResult: ...   # iterates registry, picks first match
        ```

        `src/jobsmith/sources/helpers/`:
        - `salary.py:parse_salary(text)` — handles `$160K/yr - $200K/yr`,
          `$70/hr - $85/hr`, `$80,000 - $140,000`, `€60K - €80K`. Returns
          `SalaryRange | None`.
        - `time_parse.py:parse_relative_time(text, *, ref)` — handles "5 hours ago",
          "20 minutes ago", "yesterday", "just posted", "2 days ago", "3 weeks ago".
        - `location.py:normalize_location(loc)` — returns `NormalizedLocation`
          with `city`, `state`, `country`, `remote_policy`. Handles "NYC Metro Area, US",
          "Remote", "Hybrid - Austin, TX".
        - `company.py:normalize_company_name(name)` — strips Inc/LLC/Ltd/Corp/Co.,
          casefolds, trims; for dedup.
        - `url.py:normalize_url(url, *, source)` — per-source canonicalization.
          linkedin: `/jobs/view/<id>/`. jobright: `/jobs/info/<hex>`. indeed:
          `/viewjob?jk=<key>`. glassdoor: strip `s` and `pos` params.
        - `dedup.py:compute_dedup_key(company, title, location)` — SHA1 of
          normalized tuple; deterministic.
        - `html.py:extract_anchors(html)` — list of (text, href) tuples. Reuses
          BeautifulSoup4.
        - `email_envelope.py:envelope_from_rfc822(raw)` — builds Envelope from
          RFC822 bytes. Walks MIME tree, extracts plaintext_body and html_body
          regardless of structure (multipart/alternative, html-only, plaintext-only).

        Add deps to `[api]`: `beautifulsoup4>=4.12`, `lxml>=5.0`, `python-dateutil>=2.8`.

        No parsers ship in this slice — only the protocol + helpers + tests with
        synthetic fixtures.
      why: |
        Reusable core called out in user feedback ("design reusable functions for
        the jobparsers so that other platforms like indeed, glassdoor etc"). Slice
        4 onward is one parser file each; without this slice, every parser would
        reimplement salary regex, time parsing, etc.
      files:
        - src/jobsmith/sources/protocol.py
        - src/jobsmith/sources/helpers/__init__.py
        - src/jobsmith/sources/helpers/salary.py
        - src/jobsmith/sources/helpers/time_parse.py
        - src/jobsmith/sources/helpers/location.py
        - src/jobsmith/sources/helpers/company.py
        - src/jobsmith/sources/helpers/url.py
        - src/jobsmith/sources/helpers/dedup.py
        - src/jobsmith/sources/helpers/html.py
        - src/jobsmith/sources/helpers/email_envelope.py
        - pyproject.toml
        - tests/test_sources_helpers_salary.py
        - tests/test_sources_helpers_time.py
        - tests/test_sources_helpers_location.py
        - tests/test_sources_helpers_url.py
        - tests/test_sources_helpers_dedup.py
        - tests/test_sources_envelope.py
      deps:
        - 1
      done_when:
        - JobAlertParser protocol + register_parser + parse_envelope dispatch implemented
        - Each helper has table-driven tests covering ≥10 representative inputs
        - envelope_from_rfc822 correctly handles multipart/alternative, html-only, and plaintext-only emails
        - compute_dedup_key is deterministic (same input → same SHA1) and stable across versions
        - normalize_url(linkedin) strips trackingId/refId/lipi/midToken/midSig/trk/trkEmail/eid/otpToken params
        - All helpers have type hints; tsc-equivalent (mypy strict) is clean
      effort: L
      risk: Med
      tests: |
        Unit: TestParseSalary — table-driven over 15+ formats including weird Unicode dashes.
        Unit: TestParseRelativeTime — "5 hours ago", "yesterday", "just now", "3 weeks ago", invalid input.
        Unit: TestNormalizeLocation — 10+ formats including "Remote", "Hybrid - X", "NYC Metro Area", non-US.
        Unit: TestNormalizeCompany — strips Inc/LLC/Ltd, preserves accents.
        Unit: TestNormalizeURL_LinkedIn — strips all 8 known LinkedIn tracking params.
        Unit: TestNormalizeURL_JobRight — strips utm_*, imp_id.
        Unit: TestComputeDedupKey — same input → same hash; case-insensitive on company.
        Unit: TestEnvelopeFromRFC822 — three fixtures: multipart/alt, html-only, plaintext-only.
        Unit: TestParserRegistry_Dispatch — register two stub parsers, parse_envelope picks the right one by sender_patterns.
      approved: false
      comment: ""
      approval_status: pending
      execution_status: not_started
    - id: slice-4
      num: 4
      title: LinkedIn digest parser (jobalerts-noreply)
      what: |
        First concrete parser. Validates the slice-3 abstraction.

        `src/jobsmith/sources/parsers/linkedin_digest.py`:
        - `class LinkedInDigestParser(JobAlertParser)`
        - `name = 'linkedin'`, `parser_version = '1.0.0'`
        - `sender_patterns = [re.compile(r'^jobalerts-noreply@linkedin\.com$', re.I)]`
        - Subject pattern (optional fingerprint): `re.compile(r'^Your job alert')` or contains "and more"
        - `parse(env)` walks `env.plaintext_body` (LinkedIn sends multipart/alt,
          plaintext is canonical):
          - Split on `r'\n-{40,}\n'` (40+ dashes) into blocks
          - Per block: line 1 = title, line 2 = company, line 3 = location,
            remaining lines = badges until `View job: <url>`
          - Extract LinkedIn job ID from URL via `re.search(r'/jobs/view/(\d+)/', url)`
          - Use `normalize_url(url, source='linkedin')` to canonicalize
          - Use `compute_dedup_key(company, title, location)`
        - Alert metadata: parse subject for search keyword
          (`r'"([^"]+)":'` matches the quoted keyword in subjects like
          '"artificial intelligence engineer": Qcells North America - …').
        - Register via `register_parser(LinkedInDigestParser)` in
          `src/jobsmith/sources/parsers/__init__.py`.

        Golden fixtures: commit ≥3 real LinkedIn digest emails as
        `tests/fixtures/sources/linkedin/digest_*.eml` (sanitize: keep structure,
        strip user PII from footer if any). Each fixture has a sibling JSON file
        `digest_*.expected.json` with the candidates the parser MUST produce.
      why: |
        Validates slice-3 architecture against real-world data. LinkedIn is the
        highest-volume source per the inbox audit (~10-15 emails/day). Plaintext
        parsing is easier than HTML, so this is the right "first parser" — it
        shakes out helper bugs without HTML-parsing complexity.
      files:
        - src/jobsmith/sources/parsers/__init__.py
        - src/jobsmith/sources/parsers/linkedin_digest.py
        - tests/fixtures/sources/linkedin/digest_2026-05-04_durham-ai.eml
        - tests/fixtures/sources/linkedin/digest_2026-05-04_durham-ai.expected.json
        - tests/fixtures/sources/linkedin/digest_2026-05-02_data-eng.eml
        - tests/fixtures/sources/linkedin/digest_2026-05-02_data-eng.expected.json
        - tests/test_sources_linkedin_digest.py
      deps:
        - 3
      done_when:
        - 'Three real LinkedIn digest fixtures parse cleanly: candidates count + every field matches expected.json'
        - Tracking params stripped from all candidate URLs
        - Subject keyword extracted into AlertMetadata.search_keyword
        - parser_warnings populated when a card is malformed (don't crash; skip with warning)
        - register_parser wired so parse_envelope dispatches LinkedIn senders correctly
      effort: M
      risk: Med
      tests: |
        Unit: TestLinkedInDigest_Canonical — three golden fixtures.
        Unit: TestLinkedInDigest_BadCard — fixture with one malformed block, parser yields N-1 candidates + 1 warning.
        Unit: TestLinkedInDigest_TrackingStripped — fixture URL has trackingId/refId/lipi, output URL is clean.
        Unit: TestLinkedInDigest_Dispatch — Envelope from jobalerts-noreply triggers this parser; from jobs-noreply does NOT.
        Regression: shared helpers tests still pass.
      approved: false
      comment: ""
      approval_status: pending
      execution_status: not_started
    - id: slice-5
      num: 5
      title: LinkedIn saved-job nudge parser (jobs-noreply)
      what: |
        Second LinkedIn variant — the "apply now to '<title> at <company>'" reminder.
        One job per email, signal that the user already saved the role.

        `src/jobsmith/sources/parsers/linkedin_saved.py`:
        - `name = 'linkedin'` (same source — different parser variant)
        - `parser_version = '1.0.0'`
        - `sender_patterns = [re.compile(r'^jobs-noreply@linkedin\.com$')]`
        - `subject_patterns = [re.compile(r"apply now to [''](.+) at (.+)['']")]`
        - `parse(env)`:
          - Extract title + company from subject regex
          - Extract job ID from the first `/jobs/view/<id>/` URL in body
          - Set `EmailSighting.alert_metadata.kind = 'saved_reminder'` so dedup +
            merge can boost candidates with this signal
          - Add `'user_saved'` to badges
        - Register in parsers/__init__.py.

        Golden fixtures: 2 saved-job reminders.
      why: |
        User has already opted in to these jobs — they should rank higher in
        triage. Without this parser, saved-job emails are silently dropped.
      files:
        - src/jobsmith/sources/parsers/linkedin_saved.py
        - src/jobsmith/sources/parsers/__init__.py
        - tests/fixtures/sources/linkedin/saved_2026-05-04_pwc.eml
        - tests/fixtures/sources/linkedin/saved_2026-05-04_pwc.expected.json
        - tests/fixtures/sources/linkedin/saved_2026-05-02_pwc.eml
        - tests/fixtures/sources/linkedin/saved_2026-05-02_pwc.expected.json
        - tests/test_sources_linkedin_saved.py
      deps:
        - 3
        - 4
      done_when:
        - Subject regex extracts title + company correctly across smart-quote variants ('' vs '')
        - Job ID extracted from body URL
        - '''user_saved'' badge in candidates'
        - Dispatcher correctly routes jobs-noreply (saved) vs jobalerts-noreply (digest)
      effort: S
      risk: Low
      tests: |
        Unit: TestLinkedInSaved_Canonical — two golden fixtures.
        Unit: TestLinkedInSaved_SmartQuotes — fixture with curly quotes parses identically to straight.
        Unit: TestLinkedInSaved_BadgeSet — assert 'user_saved' in candidate.badges.
        Regression: slice-4 tests still pass.
      approved: false
      comment: ""
      approval_status: pending
      execution_status: not_started
    - id: slice-6
      num: 6
      title: JobRight digest + instant-alert parsers (HTML)
      what: |
        Two HTML parsers for the JobRight platform. Validates HTML-helper paths in
        slice 3.

        `src/jobsmith/sources/parsers/jobright_digest.py`:
        - `name = 'jobright'`, `parser_version = '1.0.0'`
        - `sender_patterns = [re.compile(r'^noreply@jobright\.ai$')]`
        - `subject_patterns = [re.compile(r'Your job matches for')]`
        - `parse(env)` walks `env.html_body` with BeautifulSoup:
          - Each job card lives in a structured div block; per inbox sample:
            company name, industry · stage line, percentage badge, title,
            salary text, location, referral count, posted-time, "APPLY NOW" anchor
          - Extract apply URL from `<a href="https://jobright.ai/jobs/info/<hex>?utm_*">`
          - Use `normalize_url(url, source='jobright')` to strip utm
          - Extract match score (e.g., `62%`) → `match_score = 0.62`
          - Use helpers for salary, location, posted-time
          - Set `external_id` to the 24-char hex from URL

        `src/jobsmith/sources/parsers/jobright_instant.py`:
        - Sister parser for "X just posted a Y% match Z role N minutes ago" emails
        - Subject regex extracts company + match score; body has the apply URL
        - One candidate per email
        - `alert_metadata.kind = 'instant'` (vs `'digest'`) so triage UI can
          prioritize fresh listings

        Both parsers register via parsers/__init__.py.

        Golden fixtures: 2 digest + 2 instant emails.
      why: |
        JobRight is the second highest-volume source. Match-score signal is unique
        to JobRight and feeds prescore (slice 8). HTML parsing here proves the
        `extract_anchors` + BeautifulSoup helpers work on real-world templates.
      files:
        - src/jobsmith/sources/parsers/jobright_digest.py
        - src/jobsmith/sources/parsers/jobright_instant.py
        - src/jobsmith/sources/parsers/__init__.py
        - tests/fixtures/sources/jobright/digest_2026-05-04.eml
        - tests/fixtures/sources/jobright/digest_2026-05-04.expected.json
        - tests/fixtures/sources/jobright/digest_2026-05-03.eml
        - tests/fixtures/sources/jobright/digest_2026-05-03.expected.json
        - tests/fixtures/sources/jobright/instant_2026-05-04_davita.eml
        - tests/fixtures/sources/jobright/instant_2026-05-04_davita.expected.json
        - tests/fixtures/sources/jobright/instant_2026-05-03_capitalone.eml
        - tests/fixtures/sources/jobright/instant_2026-05-03_capitalone.expected.json
        - tests/test_sources_jobright_digest.py
        - tests/test_sources_jobright_instant.py
      deps:
