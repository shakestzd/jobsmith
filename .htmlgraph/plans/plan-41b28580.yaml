    - id: slice-7
      num: 7
      title: Climatebase email parser + SendGrid redirect helper
      what: |
        Climatebase is the user's highest-priority career-target source (climate
        sector focus). Inbox audit confirmed: `alerts@climatebase.org` ships
        "New jobs matching your profile" emails every 2-3 days, HTML-only (~50KB),
        ~5-15 jobs per email. URLs are wrapped through SendGrid click-tracking
        (`https://u23036105.ct.sendgrid.net/ls/click?upn=<token>`); the canonical
        Climatebase URL or the employer ATS URL is reachable only by following
        the redirect.

        ## New shared helper

        `src/jobsmith/sources/helpers/redirect.py`:
        - `resolve_redirect(url: str, *, max_hops: int = 5, timeout: float = 10.0) -> str`
          — uses httpx with `follow_redirects=False` in a manual loop, walks the
          Location header chain, returns the final non-tracked URL.
        - Recognized trackers (return final URL, not the tracker URL):
          SendGrid (sendgrid.net/ls/click), Mailgun (email.mailgunhq.com),
          ActiveCampaign (activehosted.com/proc.php?ix=), generic 30x chains.
        - Honors per-tracker timeouts; on failure returns the original URL with a
          flag so callers can mark the candidate `low_confidence_url`.
        - This helper is part of the reusable core — JobRight, Glassdoor, and any
          future tracker-wrapping source can use it.

        ## Climatebase parser

        `src/jobsmith/sources/parsers/climatebase_email.py`:
        - `name = 'climatebase'`, `parser_version = '1.0.0'`
        - `sender_patterns = [re.compile(r'^alerts@climatebase\.org$')]`
        - `subject_patterns = [re.compile(r'New jobs matching')]`
        - `parse(env)` walks `env.html_body` with BeautifulSoup:
          - Each job card has: company logo, company name, role title, location,
            posted-time text, "View Job" anchor (SendGrid-wrapped)
          - Extract title, company, location, posted-time using the slice-3
            helpers (`parse_relative_time`, `normalize_location`,
            `normalize_company_name`)
          - For each `<a href>` SendGrid URL, call `resolve_redirect` to get the
            canonical destination. Cache resolution per parse run (multiple cards
            may link to same target).
          - If resolution fails (tracker rate-limit, DNS error), keep the SendGrid
            URL but flag `low_confidence_url=True`. Triage UI shows a yellow
            warning icon.
        - Register in `src/jobsmith/sources/parsers/__init__.py`.

        ## Golden fixtures

        Commit ≥3 real Climatebase emails as
        `tests/fixtures/sources/climatebase/jobs_*.eml`. Each has a sibling
        `expected.json` listing the candidates with both the SendGrid URL and the
        resolved canonical URL (so the parser test can mock `resolve_redirect`
        and assert the final URL).

        ## Companion in `private/triage-rules.example.yaml`

        Add a recommended boost rule for climate-sector candidates so the user's
        target sector is amplified at prescore time:
        ```yaml
        boosts:
          - id: boost-climate-sector
            kind: source_exact
            value: "climatebase"
            delta: 0.15
            reason: "career focus — climate"
        ```
        Document this in the `why` of slice 11 (rules linter) too.
      why: |
        User's career focus is climate-finance / climate-infrastructure (per
        LinkedIn footer audit: "788 MW / $4.25B portfolio optimization at Sunnova").
        Climatebase is the dominant climate-jobs board; its emails arrive in the
        inbox already but currently get ignored. Without this slice, the most
        career-aligned source is dropped on the floor. The `resolve_redirect`
        helper is also reusable for any future SendGrid/Mailgun-wrapped source —
        it's not a Climatebase-specific cost.
      files:
        - src/jobsmith/sources/helpers/redirect.py
        - src/jobsmith/sources/parsers/climatebase_email.py
        - src/jobsmith/sources/parsers/__init__.py
        - private/triage-rules.example.yaml
