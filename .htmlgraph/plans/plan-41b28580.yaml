        - tests/fixtures/sources/climatebase/jobs_2026-05-04.expected.json
        - tests/fixtures/sources/climatebase/jobs_2026-04-30.eml
        - tests/fixtures/sources/climatebase/jobs_2026-04-30.expected.json
        - tests/fixtures/sources/climatebase/jobs_2026-04-27.eml
        - tests/fixtures/sources/climatebase/jobs_2026-04-27.expected.json
        - tests/test_sources_redirect.py
        - tests/test_sources_climatebase_email.py
      deps:
