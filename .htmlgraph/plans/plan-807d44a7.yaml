meta:
    id: plan-807d44a7
    track_id: trk-30ae4da3
    title: Marimo review UI for jobsmith resumes — section-level edits via headless Claude Code (moplan-pattern)
    description: |
        Pivot the original "Marimo wraps run_apply" plan to a moplan-style **section-level review** layer that runs AFTER the 3-phase apply pipeline (gather → draft → render) has produced per-slug YAMLs under `<applications_dir>/<slug>/documents/`. Quarto is kept in the system but demoted to "PDF-only" (the very last step). The Marimo notebook + `mo.sidebar` + `mo.ui.chat` + headless Claude Code (subprocess of `claude -p`, with Anthropic SDK fallback) lets the user tweak individual resume sections — bullets in `work.yml`, the summary in `author.yml`, skills in `skill.yml` — without rerunning gather or draft. moplan (`/Users/shakes/DevProjects/moplan/plugin/notebooks/`) is the **explicit reference implementation**: `claude_chat.py`, `amendment_parser.py`, `moplan_store.py`, and `plan_ui.py:render_chat_history_bubbles()` are direct ports with thin domain-specific adapters. State model is hybrid: YAML on disk = source of truth (hand-editable, diffable, mergeable); SQLite = chat history + amendment statuses + Claude Code session UUIDs; in-memory dict = derived from YAML at startup, never mutated until Finalize (atomic write-tmp-then-rename).
    created_at: "2026-05-02"
    status: draft
    created_by: claude-opus
    version: 3
design:
    problem: |
        jobsmith's apply pipeline lands per-slug YAMLs (`work.yml`, `education.yml`, `skill.yml`, `author.yml`) under `<applications_dir>/<slug>/documents/`, plus `index.qmd` and `documents/resume.qmd`. Today, fixing a single bullet means re-running `jobsmith apply` (3 phases × multiple specialists × minutes each) or hand-editing a YAML and re-rendering. There is no interactive review surface for "tweak this bullet, regenerate just the PDF." The earlier plan-807d44a7 v1 proposed a Marimo wrapper around `run_apply` with a live progress display, which solves the *observability* problem but not the *iterate-on-output* problem. Meanwhile, moplan (sister project at `/Users/shakes/DevProjects/moplan`) has shipped a working pattern for section-level review with a chat sidebar, headless Claude Code subprocess, and amendment accept/reject flow over a YAML+SQLite hybrid store. That pattern is portable to jobsmith with minor adapters — the YAMLs are already the right shape.
    goals:
        - '**Quarto kept, demoted to PDF renderer** — the system continues to use Quarto + Typst as the deterministic PDF generator. Marimo never replaces Quarto. The user flow is `apply → review → render PDF`, where the middle step is a new Marimo surface and the third step is the existing render path.'
        - '**Marimo + mo.sidebar + mo.ui.chat as the review surface** — single notebook (`src/jobsmith/marimo/review.py` or PEP 723 inline script) that loads one slug''s YAMLs, renders section cards in the main area, and pins a chat sidebar (`mo.sidebar(_items, width="480px")`) for directives.'
        - '**Headless Claude Code via moplan''s ClaudeChatBackend** — port `claude_chat.py` directly. Subprocess: `claude -p <message> --output-format stream-json --verbose --append-system-prompt <ctx> [--resume <session-id>]`. Daemon thread reads stdout JSON lines into `queue.Queue`; main thread yields text from `type=assistant` events, breaks on `type=result`. Anthropic SDK fallback when `claude` binary absent and `ANTHROPIC_API_KEY` is set. System prompt (resume context) injected via `--append-system-prompt` inside `<context>` XML tags — never in the user message (prompt-injection defense).'
        - '**Section-level edits without rerunning the pipeline** — user types `REVISE bullet work[0].highlights[2]: tighten and quantify`; Claude streams prose + a structured directive; parser extracts `{section, operation, field, content}` (port of `amendment_parser.py:26-40`); amendment lands in SQLite as `action=proposed`; per-amendment `mo.ui.dropdown` chooses Pending / Accept / Reject; Finalize iterates accepted amendments, mutates the in-memory dict, and atomically writes YAML.'
        - '**Hybrid YAML + SQLite state model (moplan pattern)** — YAMLs on disk are the source of truth. SQLite (`plan_feedback`-equivalent table renamed to `review_feedback`) holds chat turns, Claude session UUID, amendment statuses, and approvals. In-memory Python dict is derived from YAML at startup and never mutated until Finalize.'
        - '**Atomic YAML writes** — port `moplan_store.py:236-245` write-tmp-then-rename pattern. Non-edited fields preserved verbatim. (Moplan''s own finalize is non-atomic; jobsmith fixes this on port.)'
        - '**`jobsmith review <slug>` CLI command** — shells out to `uv run --script src/jobsmith/marimo/review.py --slug <slug>` (PEP 723) or `marimo run` (extra-installed), opens browser. Consistent with how `jobsmith site serve` shells out to `quarto preview` (`cli.py:734-745`).'
        - '**Reusable moplan modules ported with attribution** — `claude_chat.py` (domain-agnostic), `amendment_parser.py` (regex-only), `moplan_store.py` (renamed `review_store.py`, walk-up discovery + atomic write), `plan_ui.py:render_chat_history_bubbles()` copied as-is.'
    constraints:
        - '**Quarto stays in the dependency graph** — the apply pipeline still ends in `documents/resume.qmd` + `documents/cover-letter.qmd` and a Quarto/Typst render. Marimo must not write QMD; its writes are scoped to `documents/*.yml`.'
        - '**`--append-system-prompt` requires a recent claude CLI** — moplan recon flags this. Validate the installed CLI version at notebook startup; fall back to embedding context as the first user turn if the flag is unsupported (with a banner warning).'
        - '**`--resume <uuid>` brittleness** — Claude Code sessions expire; on `--resume` failure, retry without `--resume` (loses turn context, surfaced as a banner). Port moplan''s retry logic.'
        - '**`marimo>=0.22.4` hard requirement** — `mo.sidebar` and `mo.ui.chat` (stock components) require this floor. Pin in the `[ui]` extra in `pyproject.toml`.'
        - '**No streaming cancellation upstream** — moplan uses a 60s `queue.Queue.get(timeout=60)` as the only circuit breaker. Decide v1 cancel UX in q-streaming-cancellation.'
        - '**Amendment ID dedup must be stable** — moplan uses Python `hash()`, which is randomized per interpreter restart (PYTHONHASHSEED). jobsmith MUST use UUID4 or a per-slug sequential counter persisted in SQLite.'
        - '**Atomic YAML write — non-negotiable** — write to `documents/<file>.yml.tmp`, fsync, then `os.replace` to the final path. Preserves non-edited fields. Moplan''s own finalize is non-atomic; jobsmith fixes this on port.'
        - '**AnyWidget ESM from CDN breaks offline** — only relevant if jobsmith adds custom widgets. v1 uses stock marimo components only; defer custom widgets.'
        - '**Single-user, local-only** — `marimo run` on `localhost:2718`, no auth. Document the threat model: anyone with localhost access can read all per-slug YAMLs and invoke Claude Code with the project as cwd.'
        - '**`marimo` and `anywidget` add dependencies** — land as a `[project.optional-dependencies] ui` extra (extras already exist: `tui`, `test`, `dev`). Core install stays small; CLI-only path preserved.'
        - '**Existing per-slug YAML schema is the contract** — `work.yml`, `education.yml`, `skill.yml`, `author.yml` shapes are already produced by the apply pipeline. Marimo READS them as-is and writes back the same shape. No migration. Schema discovery lives in a shared loader module.'
        - '**Claude Code subprocess `cwd` must be the jobsmith project root**, not the slug directory — so the agent can read specialist contracts and the rest of the project context. moplan does the same.'
        - '**System-prompt context payload size** — too much context (entire YAML dump per turn) blows token budgets. Strategy: include only the section the user references plus a project-wide YAML index. Confirm strategy in q-context-payload.'
    approved: false
    comment: ""
slices:
    - id: slice-1
      num: 1
      title: Marimo notebook scaffold + per-slug YAML loader + section cards
      what: |
        Create `src/jobsmith/marimo/__init__.py` (empty) and `src/jobsmith/marimo/review.py` — a single marimo notebook (or PEP 723 inline-script header per q-pep723). First cells: (a) imports + `mo` setup; (b) parse `--slug` from `sys.argv` or default to most-recent slug; (c) resolve config using the canonical pattern from `apply.py:674-681` — `find_config(Path.cwd())` then `load_config(config_path)` then `resolve(config.output.applications_dir, config_path.parent)`; (d) load `<applications_dir>/<slug>/documents/{work,education,skill,author}.yml` into typed pydantic models in a new module `src/jobsmith/marimo/loader.py`; (e) render section cards in the main area: one `mo.accordion` (or `mo.vstack`) per top-level section, each card showing the section's editable fields rendered as `mo.md` (read-only in this slice). Add `marimo>=0.22.4` to a new `[project.optional-dependencies] ui` extra in `pyproject.toml`. No chat sidebar yet, no edits — just load + display.
      why: |
        Ships a runnable, read-only review surface in one slice and validates the YAML schema discovery + loader before any Claude/SQLite/Finalize complexity is added. Aligns with goal "Marimo + mo.sidebar + mo.ui.chat as the review surface" by getting the main content area right first.
      files:
        - src/jobsmith/marimo/__init__.py
        - src/jobsmith/marimo/review.py
        - src/jobsmith/marimo/loader.py
        - pyproject.toml
        - tests/test_marimo_loader.py
      deps: []
      done_when:
        - '`uv pip install -e ''.[ui]''` succeeds and pulls in `marimo>=0.22.4`.'
        - '`marimo run src/jobsmith/marimo/review.py -- --slug <slug>` (or `uv run --script` equivalent) opens a browser tab on localhost:2718 showing per-section cards for the slug''s `work.yml`, `education.yml`, `skill.yml`, `author.yml`.'
        - '`loader.load_resume_documents(slug, applications_dir) -> ResumeDocuments` returns a typed pydantic model with `work`, `education`, `skill`, `author` populated and `loaded_from` paths recorded (for later Finalize round-trip).'
        - Missing optional YAML (e.g., `skill.yml` not present) renders a "section not yet generated" placeholder; does not raise.
        - Malformed YAML in one file raises with the file path in the error message; other sections still render.
      effort: M
      risk: Low
      tests: |
        Unit (`tests/test_marimo_loader.py`):
          - `test_load_complete_documents` — fixture slug with all 4 YAMLs → all populated, paths recorded.
          - `test_load_partial_documents` — slug with only `work.yml` and `author.yml` → other fields are None.
          - `test_load_invalid_slug` — slug not in applications_dir → raises `ApplicationNotFound`.
          - `test_load_malformed_yaml` — corrupt `skill.yml` → raises with file path in error message.
        Integration (`tests/test_marimo_review.py`):
          - `test_review_notebook_imports_cleanly` — `import jobsmith.marimo.review` succeeds (catches syntax/dep errors).
        Regression: 119 existing tests remain green.
      approved: false
      comment: ""
    - id: slice-2
      num: 2
      title: Chat sidebar with ported ClaudeChatBackend (subprocess + SDK fallback)
      what: |
        Port `claude_chat.py` from moplan to `src/jobsmith/marimo/claude_chat.py` (rename if needed; verify license — it's the same author so likely fine). Class `ClaudeChatBackend` with: subprocess invocation `claude -p <message> --output-format stream-json --verbose --append-system-prompt <ctx> [--resume <session-id>]`; daemon stdout reader thread → `queue.Queue`; generator `send(user_msg)` yields text chunks from `type=assistant` events; session UUID captured from `type=system, subtype=init` event; stale-resume retry; Anthropic SDK fallback when `claude` not on PATH and `ANTHROPIC_API_KEY` is set; subprocess `cwd` set to jobsmith project root. Then in `review.py`, add a `_chat_model(messages, config)` streaming generator that wraps backend.send, and mount `mo.sidebar([mo.ui.chat(_chat_model)], width="480px")`. System prompt for jobsmith: a context envelope summarizing the loaded resume sections (NOT the full YAML dump in v1) wrapped in `<context>...</context>` XML tags. Port `render_chat_history_bubbles()` from `plan_ui.py` for the prior-conversation accordion. No directive parsing yet — chat is conversational only in this slice. Validate `--append-system-prompt` is supported by the installed claude CLI at startup; warn + fallback if not.
      why: |
        The chat sidebar is the user's primary input channel. Getting subprocess + SDK fallback + session resume + system-prompt injection working before the directive layer means the directive layer (slice 3) is purely "parse what Claude already says." moplan has done the hard work; we port and adapt.
      files:
        - src/jobsmith/marimo/claude_chat.py
        - src/jobsmith/marimo/chat_ui.py
        - src/jobsmith/marimo/review.py
        - tests/test_marimo_claude_chat.py
      deps:
        - 1
      done_when:
        - '`ClaudeChatBackend(...).send("hello")` returns a generator that yields text chunks from a real `claude -p` invocation; full response accumulated correctly.'
        - '`claude` binary absent + `ANTHROPIC_API_KEY` set → backend falls back to Anthropic SDK; same generator interface.'
        - '`--resume <uuid>` failure (synthetic stale UUID) → backend retries without `--resume`, surfaces a banner via the chat panel, and the next turn proceeds.'
        - Sidebar renders with `mo.ui.chat`; user can send a message and see streamed Claude output.
        - System prompt injected via `--append-system-prompt` is wrapped in `<context>...</context>` tags; the user message itself is unmodified (verified by inspecting the subprocess argv in tests).
        - Subprocess `cwd` is the jobsmith project root, not the slug dir (verified in test).
        - Notebook startup runs `claude --version` (or equivalent) once; if `--append-system-prompt` is unsupported, a banner is shown and context falls back to the first user turn.
      effort: L
      risk: Med
      tests: |
        Unit (`tests/test_marimo_claude_chat.py`):
          - `test_subprocess_invocation_args` — mock subprocess.Popen, send() builds expected argv: `claude -p <msg> --output-format stream-json --verbose --append-system-prompt <ctx>`.
          - `test_session_uuid_captured_from_init_event` — feed synthetic JSON lines including `{"type":"system","subtype":"init","session_id":"abc-123"}`; assert backend.session_id == "abc-123".
          - `test_stream_yields_assistant_text` — feed JSON lines with type=assistant; assert generator yields concatenated text.
          - `test_stream_breaks_on_result` — feed type=result; assert generator terminates.
          - `test_stale_resume_retries_without_resume` — first invocation exits non-zero with "session not found"; second invocation has no --resume flag in argv.
          - `test_sdk_fallback_when_binary_absent` — patch shutil.which to return None, ANTHROPIC_API_KEY set; assert SDK path taken.
          - `test_system_prompt_xml_wrapped` — assert injected context is wrapped in `<context>...</context>` tags in argv.
          - `test_subprocess_cwd_is_project_root` — assert Popen called with cwd=<project-root>, not slug dir.
        Regression: slice 1 loader tests + 119 existing green.
      approved: false
      comment: ""
    - id: slice-3
      num: 3
      title: Directive parser + amendment store (SQLite, UUID dedup)
      what: |
        Port `amendment_parser.py` from moplan to `src/jobsmith/marimo/directive_parser.py` and adapt the regex for jobsmith vocabulary: `REVISE <section>[<index>].<field>: <content>`. Section is one of `work`, `education`, `skill`, `author`. Examples: `REVISE work[0].highlights[2]: tighten and quantify`; `REVISE author.summary: emphasize ML and rewrite in second person`; `REVISE skill[3].keywords: add "Kubernetes" and "Terraform"`. Parser returns `Amendment(id: UUID4, section: str, index: int|None, field: str, operation: str, content: str)`. Then port `moplan_store.py` to `src/jobsmith/marimo/review_store.py`: SQLite at `~/.jobsmith/jobsmith.db` (default) or per-slug `<slug>/.review.db` (per q-state-db-location). Single table `review_feedback (slug TEXT, amendment_id TEXT, section TEXT, action TEXT, value TEXT, created_at TEXT)` with composite PK `(slug, amendment_id)`. UUID4 for `amendment_id` (NOT Python `hash()` — moplan bug we fix on port). Persist proposed amendments after each Claude turn; surface them as a list under each section card with `mo.ui.dropdown(["Pending","Accept","Reject"])`. Walk-up discovery for the DB path (look for nearest `.jobsmith/` dir; create on first run).
      why: |
        Separates the parsing + persistence concerns from the chat layer (slice 2) and the finalize layer (slice 4). UUID4 fixes the moplan dedup bug. SQLite is the durable record of "what did the user accept and when" — git tracks the YAML, SQLite tracks the conversation that led there.
      files:
        - src/jobsmith/marimo/directive_parser.py
        - src/jobsmith/marimo/review_store.py
        - src/jobsmith/marimo/review.py
        - tests/test_marimo_directive_parser.py
        - tests/test_marimo_review_store.py
      deps:
        - 2
      done_when:
        - '`directive_parser.parse_amendments(text)` extracts every `REVISE <section>[i].<field>: <content>` from a multiline string; returns list of `Amendment`. Handles nested arrays (`work[0].highlights[2]`). Ignores prose around directives.'
        - Each `Amendment.id` is a UUID4 (stable across Python interpreter restarts, no PYTHONHASHSEED dependence).
        - '`review_store.persist_amendment(slug, amendment, action="proposed")` inserts into SQLite; idempotent on `(slug, amendment_id)` composite PK.'
        - '`review_store.set_action(slug, amendment_id, action)` updates `action` to "accepted" or "rejected".'
        - After a chat turn, all parsed amendments appear under the relevant section card with a Pending/Accept/Reject dropdown.
        - 'Walk-up discovery: starting from `Path.cwd()`, walk parents until a `.jobsmith/` dir is found, or create one in `Path.home()`.'
      effort: M
      risk: Med
      tests: |
        Unit (`tests/test_marimo_directive_parser.py`):
          - `test_parse_simple_directive` — `REVISE author.summary: shorten` → 1 amendment with section=author, field=summary, content="shorten".
          - `test_parse_indexed_directive` — `REVISE work[0].highlights[2]: quantify` → section=work, index=0, field="highlights[2]" (or nested rep — confirm in q-directive-vocabulary).
          - `test_parse_multiple_directives` — multiline with prose + 3 directives → 3 amendments, prose ignored.
          - `test_amendment_ids_are_uuid4` — parse same directive twice → different UUID4s; both valid UUIDs.
          - `test_invalid_section_rejected` — `REVISE foo.bar: ...` where `foo` is not in {work,education,skill,author} → not parsed (or flagged warning).
        Unit (`tests/test_marimo_review_store.py`):
          - `test_persist_amendment_idempotent` — call twice with same (slug, amendment_id) → still 1 row.
          - `test_set_action_updates_row` — proposed → accepted; verify by SELECT.
          - `test_walk_up_discovery_finds_dotdir` — fixture parent dir has `.jobsmith/`; resolve from a subdirectory cwd.
          - `test_walk_up_discovery_creates_in_home` — no `.jobsmith/` anywhere → creates `~/.jobsmith/` (mocked HOME).
        Regression: slice 2 chat tests + 119 existing green.
      approved: false
      comment: ""
    - id: slice-4
      num: 4
      title: 'Finalize: atomic YAML write back to documents/*.yml'
      what: |
        Add a "Finalize accepted edits" `mo.ui.run_button` to the notebook. On click: (1) read all `action="accepted"` amendments from `review_store` for the current slug; (2) starting from the in-memory `ResumeDocuments` dict (loaded in slice 1), apply each amendment in order — mutating only the addressed section/field; (3) for each modified YAML file, serialize to `documents/<file>.yml.tmp`, fsync, then `os.replace` to the final path (atomic). Non-edited fields preserved verbatim — use `ruamel.yaml` (or already-vendored YAML lib) with round-trip mode to preserve key order, comments, and quoting. Port the atomic write helper from `moplan_store.py:236-245` (FIX: moplan's own finalize is non-atomic; this is where jobsmith corrects the upstream bug). After Finalize, mark amendments `action="finalized"` in SQLite (preserves history; running Finalize again is a no-op for already-finalized rows). Surface a summary `mo.callout` listing which files were rewritten and which were untouched.
      why: |
        Closes the write loop. Atomicity matters because the user may have a Quarto render in flight that reads `documents/*.yml`. Round-trip YAML preserves the `apply` pipeline's formatting choices (comments, key order) so diffs in git remain minimal and reviewable. moplan's non-atomic finalize is a known bug — jobsmith fixes it on port.
      files:
        - src/jobsmith/marimo/finalize.py
        - src/jobsmith/marimo/review.py
        - tests/test_marimo_finalize.py
      deps:
        - 3
      done_when:
        - Clicking Finalize with 3 accepted amendments across `work.yml` and `author.yml` results in those two files rewritten atomically; `education.yml` and `skill.yml` untouched (verified by mtime).
        - Round-trip serialization preserves key order, top-of-file comments, and quoting style (`ruamel.yaml` round-trip mode or equivalent).
        - 'Atomic write: write-tmp + fsync + `os.replace`. A simulated crash between `os.replace` calls leaves the previous YAML intact (verified by killing the test mid-finalize).'
        - After Finalize, accepted amendments are marked `action="finalized"` in SQLite; re-clicking Finalize is a no-op for those rows.
        - Pending and Rejected amendments are NOT applied.
        - Summary callout lists the N files rewritten with a 1-line per-amendment description.
      effort: M
      risk: High
      tests: |
        Unit (`tests/test_marimo_finalize.py`):
          - `test_finalize_writes_only_modified_files` — 3 accepted amendments touching work + author; education + skill mtimes unchanged.
          - `test_finalize_preserves_unedited_fields` — full diff before vs. after = only the edited fields changed (round-trip preserves rest).
          - `test_finalize_atomic_on_crash` — patch os.replace to raise on the second call; assert the first file's previous content is intact (write-tmp not yet renamed → original survives).
          - `test_finalize_marks_amendments_finalized` — after success, `review_store.get_amendments(slug, action="finalized")` returns the 3 rows.
          - `test_finalize_idempotent_on_already_finalized` — call twice; second call is a no-op (no file mtime change).
          - `test_finalize_skips_pending_and_rejected` — amendments with action=proposed or action=rejected are not applied.
        Regression: slice 3 store tests + 119 existing green.
      approved: false
      comment: ""
    - id: slice-5
      num: 5
      title: '`jobsmith review <slug>` CLI command'
      what: |
        Add a `review` subcommand to `cli.py` (Typer pattern, consistent with other subcommands). `jobsmith review <slug> [--port 2718] [--no-browser]` resolves `src/jobsmith/marimo/review.py` via `importlib.resources`, then invokes either `uv run --script <path> -- --slug <slug>` (PEP 723 path, per q-pep723) OR `marimo run <path> -- --slug <slug>` (extra-installed path), with `--port` and browser-open flags. Mirrors the existing precedent at `cli.py:734-745` (`site serve` shells out to `quarto preview`). Validate that the slug exists under `<applications_dir>/<slug>/documents/` and that at least one of the 4 YAMLs is present; fail fast with a clear message otherwise. Document in README: `apply → review → render` user flow.
      why: |
        Without a CLI launcher, users must remember marimo paths and PEP 723 invocations. `jobsmith review <slug>` matches users' mental model — "I just ran `jobsmith apply <url>`; now `jobsmith review <slug>` opens the editor."
      files:
        - src/jobsmith/cli.py
        - tests/test_cli_review.py
        - README.md
      deps:
        - 4
      done_when:
        - '`jobsmith review <slug>` opens the marimo notebook in the browser pointed at the correct slug.'
        - '`jobsmith review nonexistent-slug` fails fast with a "slug not found at <path>" message and exit code 2.'
        - '`jobsmith review <slug> --no-browser` starts marimo without opening a browser; URL printed to stdout.'
        - '`jobsmith review --help` documents the subcommand alongside other CLI commands.'
        - README has a "review" section under the user flow describing `apply → review → render PDF`.
      effort: S
      risk: Low
      tests: |
        Unit (`tests/test_cli_review.py`):
          - `test_review_subcommand_exists` — `runner.invoke(app, ["review", "--help"])` exits 0.
          - `test_review_invokes_marimo_or_uv_run` — patch subprocess; assert correct argv built for both PEP 723 path and extras path.
          - `test_review_unknown_slug_fails_fast` — slug not in applications_dir → exit 2 with "slug not found".
          - `test_review_no_documents_dir_fails` — slug exists but no `documents/` subdir → exit 2 with helpful message.
        Regression: existing 119 CLI tests green.
      approved: false
      comment: ""
    - id: slice-6
      num: 6
      title: 'Quarto-as-PDF-only validation: confirm render path post-edit'
      what: |
        Add an integration test (and document) confirming the canonical post-edit user flow: `jobsmith apply <url>` → `jobsmith review <slug>` → user accepts amendments → Finalize writes YAMLs → `jobsmith assemble <slug>` (or `jobsmith render <slug>` — confirm name) regenerates `documents/resume.qmd` from the modified YAMLs and runs Quarto/Typst to produce a fresh `documents/resume.pdf`. No code change to the assemble/render path is required; this slice is a regression-prevention slice. Test: end-to-end fixture that runs apply on a sample URL (or uses a pre-recorded fixture), invokes review programmatically (skip Marimo UI; call `finalize.apply_amendments` directly with a hardcoded amendment list), then runs the existing render path and asserts the PDF mtime is newer than the YAML mtime and the PDF is non-empty. Update README with the full apply → review → render flow.
      why: |
        Pinning down the contract: Marimo never touches `.qmd` files or runs Quarto. Quarto's role is reduced to "deterministic PDF renderer at the end." A regression test guards against future Marimo changes accidentally breaking the render path. The test is the documentation.
      files:
        - tests/test_apply_review_render_e2e.py
        - README.md
      deps:
        - 5
      done_when:
        - 'End-to-end test: pre-recorded apply fixture + programmatic finalize + existing render path → fresh PDF produced.'
        - PDF mtime > YAML mtime asserted.
        - PDF is >1KB (non-empty stub check).
        - README documents the 3-step flow with concrete commands and a screenshot/diagram (text diagram acceptable).
        - No Marimo code changes in this slice — only test + docs.
      effort: S
      risk: Low
      tests: |
        E2E (`tests/test_apply_review_render_e2e.py`):
          - `test_apply_review_render_pdf_regenerates` — pre-recorded fixture; finalize a single bullet amendment; render; assert fresh PDF.
