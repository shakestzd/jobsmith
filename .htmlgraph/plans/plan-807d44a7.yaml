questions:
    - id: q-state-db-location
      text: Where should the SQLite review state live?
      description: |
        Two viable locations. (a) `~/.jobsmith/jobsmith.db` — single user-wide DB, all slugs in one place. Pros: easy lineage queries across applications, one walk-up to find. Cons: requires `slug` column in every row (planned anyway); user-wide state lives outside the project repo. (b) Per-slug `<applications_dir>/<slug>/.review.db` — DB lives next to the YAMLs it describes. Pros: deletes with the application, naturally scoped, matches the `.apply-state/` precedent. Cons: many DBs to manage, no cross-application chat history queries. Moplan uses option (a)-equivalent in the project root. For jobsmith's "many slugs per project" model, (b) feels more natural; for "global review history" it's (a).
      recommended: option-b
      options:
        - key: option-a
          label: 'A: ~/.jobsmith/jobsmith.db — single user-wide DB; cross-application queries trivial; lives outside project repo'
        - key: option-b
          label: 'B: <applications_dir>/<slug>/.review.db — per-slug; deletes with the application; matches .apply-state/ precedent'
        - key: option-c
          label: 'C: <project-root>/.jobsmith/review.db — project-scoped; one DB per project; matches moplan'
      answer: null
    - id: q-pep723
      text: PEP 723 inline-script header vs. depending on jobsmith's pyproject?
      description: |
        Two options. (a) PEP 723 inline-script — `review.py` declares its own deps in the script header (`# /// script` ... marimo, anywidget, pyyaml, anthropic ...). Run with `uv run --script src/jobsmith/marimo/review.py`. Pros: no host-pyproject coupling for dev dependencies; matches moplan exactly; portable. Cons: dep duplication between pyproject `[ui]` extra and inline header; harder to update both in sync. (b) Depend on jobsmith's pyproject `[ui]` extra — `marimo run src/jobsmith/marimo/review.py` after `uv pip install -e '.[ui]'`. Pros: single source of truth for deps. Cons: forces the user to install the extra to run the notebook; no isolation. Either works; PEP 723 is moplan's choice and is the path of least friction for "just run the notebook."
      recommended: option-a
      options:
        - key: option-a
          label: 'A: PEP 723 inline-script header — matches moplan; isolated; `uv run --script` works without installing extras'
        - key: option-b
          label: 'B: Depend on `[ui]` extra — single source of dep truth; requires `uv pip install -e ".[ui]"` first'
        - key: option-c
          label: 'C: Both — inline header for direct invocation, extra for `jobsmith review` CLI which can prefer the installed env'
      answer: null
    - id: q-directive-vocabulary
      text: What exact directive syntax should the parser accept?
      description: |
        moplan uses `AMEND slice-<n>: <op> <field> "<content>"`. jobsmith needs to address nested fields in YAML lists. Three options. (a) Bracket-path syntax — `REVISE work[0].highlights[2]: <content>` — terse, matches Python attribute access intuition. (b) Slash-path syntax — `REVISE work/0/highlights/2: <content>` — JSONPointer-like, unambiguous, no shell quoting issues. (c) Dotted with named indices — `REVISE work.aws.highlights[2]: ...` (where `aws` is a synthetic key derived from the company name) — readable but requires the parser to resolve names back to indices. Option (a) is the most natural and minimizes parser ambiguity; a single regex handles `<section>(\[<int>\])?(\.<field>(\[<int>\])?)+`.
      recommended: option-a
      options:
        - key: option-a
          label: 'A: REVISE work[0].highlights[2]: <content> — bracket-path; matches Python access; one regex'
        - key: option-b
          label: 'B: REVISE work/0/highlights/2: <content> — JSONPointer-like; unambiguous'
        - key: option-c
          label: 'C: REVISE work.<company>.highlights[2]: ... — named indices; readable but parser must resolve'
      answer: null
    - id: q-diff-preview
      text: Should accepted amendments show a diff/preview before Finalize?
      description: |
        Moplan ships with no diff/preview — accept/reject is on a one-line label and git provides post-finalize history. For resume bullets, the change is more nuanced (a "tightened" bullet might surprise the user). Three options. (a) Match moplan — no diff; one-line directive label; git provides post-finalize diff. Simplest. (b) Inline diff per amendment using `mo.md` with red/green spans showing old vs. new bullet text. ~30 LOC. (c) Full file diff in a side panel before Finalize — user reviews entire YAML diff. Heavier UI, more confidence. Option (b) is the right cost/benefit for resume content where exact wording matters.
      recommended: option-b
      options:
        - key: option-a
          label: 'A: No diff — match moplan; one-line label; rely on git for post-finalize diff'
        - key: option-b
          label: 'B: Inline per-amendment diff (old vs. new) using mo.md with red/green spans — ~30 LOC'
        - key: option-c
          label: 'C: Full-file YAML diff in a side panel before Finalize — heaviest, most confidence'
      answer: null
    - id: q-streaming-cancellation
      text: How should mid-stream cancellation be handled?
      description: |
        Moplan has no cancel — the only circuit breaker is a 60s `queue.Queue.get(timeout=60)`. For long Claude responses on resume bullets (which can be 30-60s), the user might want to abort. Three options. (a) Match moplan — no cancel button; 60s timeout is the only safety net. Simplest. (b) Stop button that calls `subprocess.terminate()` on the claude process and surfaces a "Cancelled" banner. ~15 LOC change. (c) Stop button + chat history rollback — terminate + remove the in-flight turn from chat history so the next turn doesn't see a partial response. ~40 LOC. Option (b) is the right balance for v1.
      recommended: option-b
      options:
        - key: option-a
          label: 'A: No cancel — match moplan; 60s timeout is the only circuit breaker'
        - key: option-b
          label: 'B: Stop button → subprocess.terminate() + banner — ~15 LOC; v1-shippable'
        - key: option-c
          label: 'C: Stop button + chat history rollback — cleanest semantics; ~40 LOC'
      answer: null
    - id: q-package-location
      text: Where should the marimo notebook + supporting modules live?
      description: |
        Three options. (a) `src/jobsmith/marimo/` — new package inside jobsmith; importable as `jobsmith.marimo.review`; ships with `pip install jobsmith[ui]`. Mirrors the original plan's location and lets `jobsmith review` resolve via importlib.resources. (b) Top-level `notebooks/` dir — outside the package; ships in sdist but not pip-installed. Easier for users to find as a runnable file but harder for the CLI to resolve. (c) Top-level `examples/` — explicit "example" status; not part of the supported surface. Option (a) makes review a first-class part of the package and matches the original plan's intent.
      recommended: option-a
      options:
        - key: option-a
          label: 'A: src/jobsmith/marimo/ — new package; importable; ships with pip install jobsmith[ui]'
        - key: option-b
          label: 'B: notebooks/ — top-level dir; ships in sdist; user-runnable file'
        - key: option-c
          label: 'C: examples/ — explicit example status; not part of supported surface'
      answer: null
    - id: q-context-payload
      text: How much YAML context should be injected via --append-system-prompt?
      description: |
        Three options. (a) Full YAML dump of all 4 documents on every turn — simplest, most accurate, but blows token budgets on 5+ turn conversations and pays for context the user never references. (b) Section index + on-demand inclusion — first turn includes a YAML index ("the resume has work entries 0-4, education entries 0-2, ..."); subsequent turns include only the section the user references. ~50 LOC of prompt-building logic. (c) Per-turn dynamic — parse the user's message for section references, include only matching YAML chunks. Most efficient, most complex. Option (b) is moplan's effective pattern (it includes the plan structure but not every slice body); the right v1 choice.
      recommended: option-b
      options:
        - key: option-a
          label: 'A: Full YAML dump every turn — simple, correct, but expensive on long conversations'
        - key: option-b
          label: 'B: Section index + on-demand chunks per turn — moplan-like; ~50 LOC prompt-building'
        - key: option-c
          label: 'C: Per-turn dynamic chunk selection by parsing user message — most efficient, most complex'
      answer: null
    - id: q-multi-slug-review
      text: Should one Marimo session handle multiple slugs, or one slug per session?
      description: |
        Moplan handles one plan per notebook session. For jobsmith, the user might want to review several recently-applied jobs in one sitting. Three options. (a) One slug per session — `jobsmith review <slug>`; close + reopen for a different slug. Matches moplan; simplest state model. (b) Slug picker in the notebook — `mo.ui.dropdown` populated with all slugs, switching reloads the in-memory dict and chat history. Adds a state-reset edge case for in-flight Claude streams. (c) Multi-tab — each slug gets its own marimo tab. Heavy. Option (a) is the v1 default — `jobsmith review` is cheap to invoke per slug.
      recommended: option-a
      options:
        - key: option-a
          label: 'A: One slug per session — matches moplan; simplest; close+reopen for different slug'
        - key: option-b
          label: 'B: Slug picker in the notebook — switch slugs without restart; state-reset edge cases'
        - key: option-c
          label: 'C: Multi-tab per slug — heavy; full isolation'
      answer: null
critique:
    reviewed_at: "2026-05-02"
    reviewers:
        - Opus (pivot architect)
    assumptions:
        - id: A1
          status: verified
          text: jobsmith already produces per-slug YAMLs (work.yml, education.yml, skill.yml, author.yml) under <applications_dir>/<slug>/documents/.
          evidence: User-provided recon; consistent with the existing apply pipeline that lands index.qmd and documents/resume.qmd reading from those YAMLs.
        - id: A2
          status: verified
          text: moplan ships a working ClaudeChatBackend, amendment_parser, and moplan_store at /Users/shakes/DevProjects/moplan/plugin/notebooks/.
          evidence: User-provided recon citing plan_notebook.py:361-425, claude_chat.py:181-258, amendment_parser.py:26-40, moplan_store.py:236-245.
        - id: A3
          status: verified
          text: mo.sidebar and mo.ui.chat are stock marimo components in >=0.22.4.
          evidence: User-provided recon; matches moplans PEP 723 header marimo>=0.22.4.
        - id: A4
          status: questionable
          text: Atomic YAML write via write-tmp + os.replace is sufficient on macOS APFS and Linux ext4.
          evidence: os.replace is atomic on POSIX same-filesystem renames. Cross-filesystem (e.g., tmp on tmpfs, target on disk) is NOT atomic — must write tmp file in the same directory as the target.
        - id: A5
          status: questionable
          text: Python hash() in moplan is unstable across interpreter restarts.
          evidence: Confirmed by Python docs — PYTHONHASHSEED randomizes string hashing per process (since 3.3). jobsmith uses UUID4 instead.
        - id: A6
          status: unverified
          text: claude CLI --append-system-prompt flag is available in the version users have installed.
          evidence: Cited in moplan recon as a "recent" feature; need to validate at notebook startup and fall back if unsupported.
        - id: A7
          status: unverified
          text: ruamel.yaml round-trip mode preserves apply pipelines key order, comments, and quoting in jobsmith YAMLs.
          evidence: ruamel.yaml is the standard tool for this; need to verify the apply pipelines emitted YAML round-trips cleanly (no quoting/style drift).
        - id: A8
          status: verified
          text: cli.py has a precedent for CLI subcommands shelling out to local processes (site serve → quarto preview).
          evidence: Original plan-807d44a7 v1 references cli.py:734-745; same pattern applies for jobsmith review → marimo run.
    critics:
        - title: PIVOT CRITIC
          sections:
            - heading: What v1 Plan Got Right (Preserved)
              items:
                - badge: Keep
                  kind: success
                  text: '`[ui]` optional-dependencies extra in pyproject.toml — preserved.'
                - badge: Keep
                  kind: success
                  text: CLI subcommand pattern (jobsmith review) mirrors site serve precedent — preserved.
                - badge: Keep
                  kind: success
                  text: Canonical config resolution pattern (find_config + load_config + resolve) — preserved in slice 1.
                - badge: Keep
                  kind: success
                  text: src/jobsmith/marimo/ as the package location — preserved.
                - badge: Keep
                  kind: success
                  text: Single-user, local-only threat model — preserved.
            - heading: What v1 Plan Got Wrong (Pivoted)
              items:
                - badge: Pivot
                  kind: warn
                  text: v1 wrapped run_apply with a live progress display. v2 reviews the OUTPUT of run_apply. Different problem.
                - badge: Pivot
                  kind: warn
                  text: v1 spent slices 3-5 on ApplyRenderer subclass + threading bridge + progress display. v2 drops all of that — Marimo doesn't invoke run_apply at all.
                - badge: Pivot
                  kind: warn
                  text: v1 was read-only with no edit surface. v2 is fundamentally edit-centric — chat sidebar + amendments + Finalize.
                - badge: Pivot
                  kind: warn
                  text: v1 had no Claude Code integration. v2 makes headless Claude Code the central interaction model.
            - heading: Moplan Port Notes
              items:
                - badge: Port
                  kind: info
                  text: claude_chat.py — port directly; verify license; rename if needed; no behavioral changes.
                - badge: Port
                  kind: info
                  text: 'amendment_parser.py — port + adapt regex for jobsmith vocab (REVISE <section>[i].<field>: ...).'
                - badge: Port
                  kind: info
                  text: moplan_store.py → review_store.py — port hybrid YAML+SQLite pattern + walk-up discovery; FIX moplan dedup bug (UUID4 instead of hash()); FIX moplan finalize atomicity bug (write-tmp + os.replace).
                - badge: Port
                  kind: info
                  text: plan_ui.py:render_chat_history_bubbles() — copy as-is.
                - badge: Port
                  kind: info
                  text: dagre_widget.py — anywidget reference only; no port in v1 (stock components suffice).
    risks:
        - risk: claude CLI --append-system-prompt unsupported on user installs.
          severity: Medium
          mitigation: Validate at notebook startup; fall back to embedding context as the first user turn with a banner warning. Slice 2 done_when explicitly requires this fallback.
        - risk: Stale --resume <uuid> loses turn context.
          severity: Low
          mitigation: Port moplan retry-without-resume; surface as a banner so the user knows the conversation context is reset. Slice 2 tests cover this.
        - risk: Amendment ID dedup is unstable across restarts (moplan bug).
          severity: High
          mitigation: jobsmith uses UUID4 (NOT hash()) — fix on port. Slice 3 done_when and tests guard this explicitly.
        - risk: Non-atomic Finalize partial-writes leave the YAMLs in an inconsistent state (moplan bug).
          severity: High
          mitigation: jobsmith uses write-tmp + os.replace — fix on port. Slice 4 has a kill-mid-finalize test.
        - risk: ruamel.yaml round-trip drifts key order/comments/quoting on the apply pipelines emitted YAMLs.
          severity: Medium
          mitigation: Slice 1 loader test verifies round-trip is identity on unmodified YAMLs. If drift appears, fall back to surgical text editing of just the modified fields.
        - risk: Token budget blows up if full YAML context injected per turn.
          severity: Medium
          mitigation: Per q-context-payload, default to section index + on-demand chunks. Slice 2 system-prompt builder enforces this.
        - risk: Subprocess cwd misalignment — Claude reads project context from the wrong directory.
          severity: Medium
          mitigation: Slice 2 explicitly sets cwd=<project root>; test verifies argv. Same as moplan.
        - risk: Marimo and Quarto coexistence — user runs both at once and Quarto reads a half-written YAML.
          severity: Medium
          mitigation: Atomic write (slice 4) prevents readers from ever seeing a partial file. Document in README that running both simultaneously is supported but YAMLs may change between Quarto reads.
    synthesis: |
        v1 (run_apply wrapper) and v2 (post-pipeline review) solve different problems. v2 is the right pivot given (a) the per-slug YAMLs already exist and are the right shape; (b) moplan has done the hard architectural work and the port surface is well-defined; (c) the user pain point is "fix one bullet without rerunning gather/draft," which v1 didn't address. The plan preserves what's reusable from v1 (extras, CLI subcommand pattern, package location, config resolution) and replaces the apply-renderer+progress slices with the chat+parse+store+finalize stack. Two upstream moplan bugs (hash-based dedup, non-atomic finalize) are fixed on port. The eight open questions are real design choices the user should weigh in on before slice 1 starts; the most consequential are q-state-db-location (per-slug vs. user-wide), q-pep723 (PEP 723 vs. extras), and q-context-payload (token budget management). Status remains draft pending human review.
