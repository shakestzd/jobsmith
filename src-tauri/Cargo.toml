[package]
name = "jobsmith"
version = "0.1.0"
description = "Jobsmith desktop shell (Tauri v2) — wraps the React UI + Python sidecar."
authors = ["Jobsmith"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
# Smaller, faster-to-ship release bundle for the desktop app.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
